x-app: &app
  image: flux-de-fichiers:${IMAGE_TAG:-local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128

services:
  central:
    <<: *app
    build:
      context: .
      target: runtime
    environment:
      BIND: 0.0.0.0:3000
      CONFIG_DIR: /config
      DATA_DIR: /data
      INPUT_DIR: /input
      LOG_DIR: /logs
      STATIC_DIR: /usr/share/flux-de-fichiers/frontend
      # The scenario lab controls worker availability explicitly.
      LOCAL_WORKER: "false"
    volumes:
      - ./var/config:/config
      - data:/data
      - central_logs:/logs
      - ./var/input:/input:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/health]
      interval: 3s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    pull_policy: never
    command: [worker]
    environment:
      CENTRAL_URL: http://central:3000
      WORKER_KEY_FILE: /config/worker_key
    volumes:
      - ./var/config:/config:ro
      - work:/work
      - logs:/logs
    healthcheck:
      test: [CMD-SHELL, "grep -qa worker /proc/1/cmdline"]
      interval: 2s
      timeout: 2s
      retries: 10
    depends_on:
      central: {condition: service_healthy}

  # Outils réservés aux scénarios : jamais inclus dans les services de traitement.
  fixtures:
    profiles: [test]
    build:
      context: .
      dockerfile: deploy/fixtures.Dockerfile
    image: flux-fixtures:local
    volumes:
      - ./var/input:/fixtures
    entrypoint: [ffmpeg]

volumes:
  data:
  central_logs:
  work:
  logs:
