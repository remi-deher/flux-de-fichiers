# Branches de travail : toute PR vers dev passe fmt, clippy et tests avant fusion
# (ADR 0002). Même vérification que le job fmt-clippy-tests de test.yml, sans
# image Docker : celle-ci reste construite sur la PR dev → test.
name: feature

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  # Après chaque fusion, le même job remplit le cache de `dev` : GitHub ne laisse
  # une PR restaurer que les caches de sa branche cible ou de la branche par défaut.
  push:
    branches: [dev]

concurrency:
  group: feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: fmt-clippy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer la toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: mise-en-place
      # Vérifications indépendantes : chacune s'exécute même si une précédente échoue (le job reste
      # en échec), mais aucune sans mise en place achevée ni après une annulation.
      - run: cargo fmt --check
      - if: ${{ !cancelled() && steps.mise-en-place.outcome == 'success' }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: ${{ !cancelled() && steps.mise-en-place.outcome == 'success' }}
        run: cargo test --locked
      - name: Contrat partagé, client WASM et page (ADR 0014)
        if: ${{ !cancelled() && steps.mise-en-place.outcome == 'success' }}
        run: |
          cargo clippy -p forgearr-shared -p forgearr-client -p forgearr-frontend --all-targets --locked -- -D warnings
          cargo clippy -p forgearr-client --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test -p forgearr-shared -p forgearr-client -p forgearr-frontend --locked
      - name: La page se génère (frontend/dist/index.html n'est pas versionnée)
        if: ${{ !cancelled() && steps.mise-en-place.outcome == 'success' }}
        run: cargo run -p forgearr-frontend --locked
