openapi: 3.1.0
info:
  title: Forgearr — API de traitement média
  version: 0.1.0
  description: >-
    Central unique, workers MKVToolNix et frontend Leptos.
    Les noms de fichiers sont des noms MKV simples présents dans INPUT_DIR.
    Les humains ouvrent une session par compte (identifiant et mot de passe) ; les
    machines utilisent des clés d'API nommées et révocables (ADR 0011). Le bail est un secret
    temporaire transmis dans le corps des renouvellements ou dans un en-tête,
    jamais dans une URL. L'API accepte les clés Bearer et, pour le navigateur,
    une session cookie avec CSRF/origine. Tous les échanges distants nécessitent HTTPS.
servers:
  - url: https://localhost:3443
security:
  - ApiKey: []
paths:
  /:
    get:
      security: []
      summary: Informations publiques minimales du service
      responses:
        '200':
          description: Service et absence d'interface
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: {type: string}
                  interface: {type: boolean, const: false}
  /health:
    get:
      security: []
      summary: Disponibilité du central et de PostgreSQL
      responses:
        '204': {description: PostgreSQL joignable}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/files:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les entrées MKV admissibles, triées par nom, maximum 500
      responses:
        '200':
          description: Fichiers non vides sous la limite de taille, sans liens symboliques
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, bytes]
                  properties:
                    name: {type: string}
                    bytes: {type: integer, minimum: 1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/openapi.yaml:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire la spécification OpenAPI 3.1.0 du central
      responses:
        '200':
          description: Spécification OpenAPI au format YAML
          content:
            application/yaml:
              schema: {type: string}
  /mcp:
    post:
      security: [{ApiKey: []}]
      summary: Point d'entrée Streamable HTTP (JSON-RPC 2.0) du serveur MCP
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Réponse JSON-RPC 2.0
        '202':
          description: Notification JSON-RPC acceptée
        default: {$ref: '#/components/responses/Error'}
  /api/v1/files/{name}:
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Déposer un fichier média dans le dossier d'entrée (input_dir)
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Fichier déposé avec son empreinte SHA-256
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer un fichier média du dossier d'entrée (input_dir)
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Fichier supprimé
        default: {$ref: '#/components/responses/Error'}
  /api/v1/flows/validate:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Valider la structure d'un graphe de flux avant sauvegarde ; les expressions `{$…}` des
        variables déclarées des nœuds script (inconnues, réservées aux blocs HTTP, ou vers un nœud qui
        ne précède pas) sont aussi signalées dans `errors` ; une référence à une variable exposée
        dépréciée et l'ancienne syntaxe `{{…}}` (convertie, puis réécrite à l'enregistrement) le sont
        dans `warnings` (ADR 0025, 0026)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: {type: [object, string]}
                flowId:
                  type: string
                  description: Flux validé, pour refuser un appel de sous-flux qui reviendrait sur lui (ADR 0022).
      responses:
        '200':
          description: Rapport de validation (valid, errors, warnings), y compris sous-flux circulaires, trop profonds (4 niveaux) ou introuvables et flux d'échec inconnu
        default: {$ref: '#/components/responses/Error'}
  /api/v1/flows/failure-default:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire le flux d'échec global (appliqué aux flux qui n'en désignent pas)
      responses:
        '200':
          description: Flux d'échec global
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DefaultFailureFlow'}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Définir ou effacer (flowId null) le flux d'échec global ; droit ManageFlows
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DefaultFailureFlow'}
      responses:
        '200':
          description: Flux d'échec global enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DefaultFailureFlow'}
        '400': {description: Flux inconnu}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/scripts/{entry_id}:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Code d'un script du catalogue (tous dépôts confondus, le premier dépôt qui porte l'identifiant l'emporte),
        en lecture seule : métadonnées, variables, lignes de jetons colorés et état de ses dépendances. Affiché dans
        le tiroir de l'entrée du catalogue.
      parameters:
        - {name: entry_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Aperçu du script.}
        '404': {description: Script inconnu.}
  /api/v1/plugins/scripts/{entry_id}/import:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Copie un script du catalogue dans la librairie locale (« ma collection ») sous un identifiant neuf, avec son
        code, ses variables et ses dépendances. 409 si le script est déjà local ou si un script local porte déjà ce nom.
      parameters:
        - {name: entry_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Script local créé.}
        '404': {description: Script inconnu.}
        '409': {description: Déjà dans la librairie locale.}
  /api/v1/flows/{id}/media-sample:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Métadonnées finales du dernier job exécuté pour ce flux (ADR 0025), proposées comme échantillon de
        simulation. 404 tant qu'aucun job n'a été exécuté.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Dernier échantillon.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, sourceName, mediaInfo, recordedAt]
                properties:
                  jobId: {type: string, format: uuid}
                  sourceName: {type: string}
                  mediaInfo: {type: object}
                  recordedAt: {type: string}
        '404': {description: Aucun échantillon pour ce flux.}
  /api/v1/flows/node-variables:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Variables du script d'un nœud (ADR 0025, 0026) : schéma, expressions `{$…}` disponibles à cet
        endroit du graphe (variables du flux, métadonnées d'exemple `media.*`, nœuds en amont
        `nodes.<id>.*`, plugins qui s'exécutent avant) et `config` résolue avec des valeurs d'exemple,
        par le même chemin que l'exécution (ancienne syntaxe `{{…}}` convertie). Le graphe peut ne pas être enregistré. `warnings` liste les
        références à des variables exposées dépréciées (absent s'il n'y en a pas). Les secrets présents dans `config.secrets` n'y apparaissent jamais (remplacés par `••••••••`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph, nodeId]
              properties:
                graph: {type: object}
                nodeId: {type: string}
                mediaInfo: {description: Exemple de métadonnées du fichier (JSON de sonde)}
      responses:
        '200':
          description: >-
            `variables`, `references` (`reference` : expression sans délimiteurs, par exemple
            `media.video.codec` à insérer en `{$media.video.codec}` ; `label` ; `source` : variables,
            flow, media_info, node, plugin ; `sample`), `resolved` (absent si la résolution échoue),
            `error` et `warnings`
        default: {$ref: '#/components/responses/Error'}
  /api/v1/flows/{id}/versions/{version}/restore:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Restaurer une version figée d'un flux en tant que nouvelle version courante
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: path
          name: version
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Flux restauré
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}/files/{name}:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Déposer un fichier média et créer immédiatement une tâche dans la bibliothèque
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: name
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Fichier déposé et tâche créée
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}/scan:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Scanner les dossiers de la bibliothèque sur leurs hôtes et créer les tâches manquantes
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun: {type: boolean}
                targetWorkerId: {type: string, format: uuid}
                flowId: {type: string}
      responses:
        '200':
          description: Bilan du scan (fichiers analysés, tâches créées, doublons ignorés)
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}/files:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Voir les traitements regroupés par fichier et emplacement
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Page de fichiers et tâches associées}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}/files/{job}/reprocess:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Retraiter la source d’une tâche terminée avec une version du flux
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: job, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flowVersion: {type: [integer, 'null'], minimum: 1}
      responses:
        '201': {description: Nouveau traitement mis en file}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/failures:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire la dernière étape en échec pour chaque tâche indiquée
      parameters:
        - {in: query, name: ids, required: true, schema: {type: string}, description: "UUID séparés par une virgule."}
      responses:
        '200': {description: Étapes en échec}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Retraiter un lot de tâches échouées
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                version: {type: [integer, 'null'], minimum: 1}
      responses:
        '200': {description: Nombre de traitements recréés et ignorés}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/notifications/retry:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Réessayer les notifications différées d’un traitement publié
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Nombre de notifications reprises}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/resources:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire la classe de ressource (CPU ou GPU) des tâches indiquées
      description: "GPU si un bloc du flux figé exige une accélération matérielle (`acceleration` = nvenc ou vaapi), sinon CPU."
      parameters:
        - {in: query, name: ids, required: true, schema: {type: string}, description: "UUID séparés par une virgule (200 au plus)."}
      responses:
        '200':
          description: Classe de ressource par tâche
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JobResourceInfo'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/leases:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire l'état du bail des tâches indiquées (ADR 0027)
      parameters:
        - {in: query, name: ids, required: true, schema: {type: string}, description: "UUID séparés par une virgule (200 au plus)."}
      responses:
        '200':
          description: Tâches en cours, et tâches en file pour un worker désigné hors ligne
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JobLeaseInfo'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/placement:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Expliquer le placement d’une tâche en file
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Workers admissibles et état des prérequis}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les bibliothèques déclarées, triées par nom
      responses:
        '200':
          description: Chaque bibliothèque porte au plus un flux et un chemin par worker
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Library'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Déclarer une bibliothèque
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryWrite'}
      responses:
        '201':
          description: Bibliothèque créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire une bibliothèque
      responses:
        '200':
          description: Bibliothèque
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Remplacer le nom, le flux et les chemins de workers
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryWrite'}
      responses:
        '200':
          description: Bibliothèque mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer une bibliothèque et ses chemins de workers
      responses:
        '204': {description: Supprimée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les tâches par ordre de création décroissant
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: before
          description: UUID de la dernière tâche de la page précédente
          schema: {type: string, format: uuid}
        - {in: query, name: state, schema: {type: string, enum: [active, completed, succeeded, failed]}}
        - {in: query, name: library, schema: {type: string, format: uuid}}
        - {in: query, name: volume, schema: {type: string}}
        - {in: query, name: error, schema: {type: string}}
      responses:
        '200':
          description: Page, tableau vide en fin de liste ou si le curseur est inconnu
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer une tâche et figer l'empreinte de la source
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - in: header
          name: Origin
          required: false
          description: Requis et égal à WEB_ORIGIN pour l'authentification par cookie ; Bearer reste indépendant.
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_name]
              properties:
                source_name: {type: string, maxLength: 240, example: exemple.mkv}
                target_worker_id: {type: [string, 'null'], format: uuid}
                library_id: {type: [string, 'null'], format: uuid}
                flow_id: {type: [string, 'null']}
                priority: {type: [integer, 'null'], minimum: -100, maximum: 100, description: "Absente : priorité par défaut de la bibliothèque, sinon 0."}
      responses:
        '201':
          description: Tâche créée ; les soumissions répétées créent des tâches distinctes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/stats:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Statistiques globales et économies d'espace disque agrégées par bibliothèque
      responses:
        '200': {description: Bilan volumétrique global et par bibliothèque}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/batch:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Appliquer une action par lot (relancer, annuler ou supprimer) à une sélection de tâches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  items: {type: string, format: uuid}
                action: {type: string, enum: [retry, cancel, delete]}
      responses:
        '200': {description: Bilan de l'opération par lot}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Consulter l'état d'une tâche sans exposer son jeton de bail
      responses:
        '200':
          description: Tâche
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer ou annuler une tâche
      responses:
        '204':
          description: Tâche supprimée
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/retry:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Relancer à la main une tâche échouée après perte de bail (`lease_expired`)
        que la remise en file automatique n'a pas reprise (ADR 0027).
      description: >-
        Refusée (409) pour un autre échec, ou tant qu'un remplacement de la source a une issue
        inconnue. Tentatives épuisées, le compte repart à zéro. Le registre des actions
        irréversibles est effacé : l'appelant assume leur répétition.
      responses:
        '200':
          description: Tâche remise en file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Annuler une tâche en attente ou en cours (invalide son bail)
      responses:
        '200':
          description: Tâche annulée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/priority:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Ajuster la priorité d'une tâche en file (-100 à 100)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: {type: integer, minimum: -100, maximum: 100}
      responses:
        '200':
          description: Priorité mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/source-publication-inspections/pending:
    get:
      security: [{ApiKey: []}]
      summary: Recevoir les demandes de vérification en lecture seule d'un détenteur
      parameters:
        - {in: query, name: worker_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: wait_ms, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Vérifications réservées au worker authentifié
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SourcePublicationTask'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/source-publication-inspections/{id}/report:
    post:
      security: [{ApiKey: []}]
      summary: Rapporter le constat des fichiers sans modifier la source
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, worker_id, outcome]
              properties:
                request_id: {type: string, format: uuid}
                worker_id: {type: string, format: uuid}
                outcome: {type: string, enum: [published, source_changed, failed]}
      responses:
        '204': {description: Constat accepté pendant le bail actif}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/output:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Télécharger le résultat d'une tâche réussie ou conservé après une publication incertaine
      responses:
        '200':
          description: Résultat immuable, téléchargement attachment en flux avec Cache-Control no-store
          headers:
            Content-Length:
              description: Taille exacte du fichier
              schema: {type: integer, minimum: 1}
            Cache-Control:
              description: Le média ne doit pas être mis en cache.
              schema: {type: string, const: no-store}
            Content-Disposition:
              description: Téléchargement direct, sans mise en mémoire du média.
              schema: {type: string}
          content:
            video/x-matroska:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer le résultat conservé d'une tâche terminée
      responses:
        '204': {description: Référence et fichier supprimés}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: "Catalogue lu dans les dépôts de plugins synchronisés (enrichi de `runtime` : état opérationnel, réglages, outils manquants, blocs/composants)"
      responses:
        '200':
          description: Fiches du catalogue enrichies de `runtime` (`readiness`, `hasSettings`, `configured`, `missingToolsCount`, `blocksCount`, `componentsCount`) ; une fiche inconnue du central est ignorée
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/{id}:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Détail d'un plugin, dépendances (avec `status` réel dans le cache d'outils), blocs fournis, statut des outils requis et variables exposées aux scripts (`exposures`, absent si le plugin n'en expose pas)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: "Vue détaillée du plugin (`dependencies[].status` indique `ready`, `installing` ou `not_installed`)"}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les dépôts de plugins
      responses:
        '200': {description: Dépôts, officiel en premier}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Ajouter un dépôt ; l'URL d'index doit être http(s) et finir par /index.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, indexUrl]
              properties:
                id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$', description: Nom du dossier local du dépôt}
                name: {type: string, minLength: 1}
                indexUrl: {type: string, format: uri}
      responses:
        '200': {description: Dépôt ajouté}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Détail d'un dépôt de plugins (entrées et index brut résolu)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Détail du dépôt}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer un dépôt tiers (le dépôt officiel est protégé)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Dépôt supprimé}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/scripts/{entryId}:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Aperçu en lecture seule d'un script d'un dépôt synchronisé : métadonnées et variables, code,
        lignes de jetons colorés (kind : plain, comment, string, number, keyword, function, variable,
        operator), dépendances sur des variables exposées par des plugins (`requirements`, avec leur
        disponibilité sur ce central) et `dependenciesUnverified`
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: entryId, required: true, schema: {type: string}}
      responses:
        '200': {description: Script et jetons de coloration syntaxique}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/toggle:
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Activer ou désactiver un dépôt
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Nouvel état}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/sync:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Synchroniser un dépôt : copie atomique de l'index, des manifestes et des contrats de
        distribution dans /config/plugins/{id}. Sans redirection, adresses privées refusées
        (sauf PLUGIN_ALLOW_PRIVATE_HOSTS=1), taille et nombre de fichiers bornés.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Bilan (entrées, fichiers, fiches ignorées)}
        '502': {description: Dépôt injoignable ou refusé, l'ancienne copie est conservée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/exposed-variables:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Variables exposées aux scripts par les plugins du catalogue (ADR 0025) : pour chaque exposition,
        le plugin fournisseur (`provider`), son contrat (`exposes` : espace de noms, version, variables et
        chemin lu dans `mediaInfo`), `active` (lue par les scripts sans dépendance explicite : à espace de noms
        égal, la première l'emporte ; un script qui la désigne dans `requires` la lit quel que soit cet état)
        et `conflictsWith` (autres plugins qui déclarent le même espace de noms)
      responses:
        '200': {description: Expositions, triées par identifiant d'opération}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/{id}/settings:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Champs de réglages d'un plugin ; un secret n'est jamais renvoyé, seulement isSet
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Champs résolus et réglages publics}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Enregistrer les réglages d'un plugin du catalogue. Les secrets saisis sont chiffrés
        (ChaCha20-Poly1305, clé générée dans /config, liée au plugin et au champ) ; un secret laissé vide est conservé.
        Maximum 64 clés et 64 Kio.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Réglages enregistrés, secrets exclus de la réponse}
        '413': {description: Réglages trop volumineux}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/{id}/test:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Tester la connexion réseau et les identifiants d'un plugin API
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Résultat détaillé du test de connexion}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: État des outils du catalogue dans le cache du central (ready ou not_installed)
      responses:
        '200': {description: Outils}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Détail d'un outil (distribution et plugins consommateurs)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Détail de l'outil}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}/distribution:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Contrat de distribution d'un outil, lu dans le dépôt synchronisé
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Contrat distribution.v1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}/install:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Installer un outil du catalogue dans le cache du central : téléchargement https,
        redirections revérifiées, SHA-256 de l'archive et du binaire contrôlés avant exécution.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Outil prêt}
        '502': {description: Archive injoignable}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/tools:
    get:
      security: [{ApiKey: []}]
      summary: Lister les versions d'outils actives dans le catalogue pour la purge du cache worker
      responses:
        '200': {description: Couples (tool_id, version) actifs}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/tools/{id}/distribution:
    get:
      security: [{ApiKey: []}]
      summary: Contrat de distribution d'un outil pour un worker, qui l'installe dans son propre cache
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Contrat distribution.v1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/packs/{id}:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Détail d'un pack (métadonnées, recette installation.json et statut des composants)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Vue détaillée du pack}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/packs/{id}/installation:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Recette brute `installation.json` d'un pack
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Recette d'installation}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/packs/{id}/install:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Installer les outils requis d'un pack et vérifier la présence de ses composants
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Bilan d'installation du pack}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Instantané consolidé de la librairie locale (scripts, ressources, modèles de blocs/flows, packs locaux)
      description: Accessible avec le droit `ViewLibraries` ou `ViewFlows`.
      responses:
        '200':
          description: Instantané local et modèles disponibles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalLibrarySnapshot'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/scripts:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer ou mettre à jour un script local (`stdio` JSON) et générer son opération et son bloc
      description: >-
        Limite HTTP 1 Mio ; code plafonné à 512 Kio. Retourne `409` en cas de collision sans `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpsertLocalScriptRequest'}
      responses:
        '200':
          description: Script enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalScriptSummary'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/resources:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Importer ou remplacer une ressource binaire locale (max 5 Mio décodé, limite HTTP 10 Mio)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadLocalResourceRequest'}
      responses:
        '200':
          description: Ressource importée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalResourceSummary'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/block-templates:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer ou mettre à jour un modèle de blocs (sous-graphe `FlowGraph`, limite HTTP 1 Mio)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBlockTemplateRequest'}
      responses:
        '200':
          description: Modèle de blocs enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalBlockTemplate'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/flow-templates:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer ou mettre à jour un modèle de flow local (limite HTTP 1 Mio)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFlowTemplateRequest'}
      responses:
        '200':
          description: Modèle de flow enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalFlowTemplate'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/packs:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Assembler un pack local depuis des scripts, ressources, flows ou plugins
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLocalPackRequest'}
      responses:
        '200': {description: Entrée de pack créée dans l'index local}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/items/{id}:
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer un élément du catalogue local et reconstruire `index.json`
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Élément supprimé}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/local/items/{id}/file:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Télécharger le fichier d'une ressource locale importée (`nosniff`, `no-store`)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Contenu binaire de la ressource
          headers:
            X-Content-Type-Options:
              schema: {type: string, const: nosniff}
            Cache-Control:
              schema: {type: string, const: no-store}
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    get:
      security: [{WebSession: []}]
      summary: Lire le statut de session et récupérer le jeton CSRF après rechargement
      responses:
        '200':
          description: Session valide et réponse non mise en cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/setup/status:
    get:
      security: []
      summary: Indiquer si le central attend son installation
      responses:
        '200':
          description: État d'installation et nom du central une fois installé
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup]
                properties:
                  needsSetup: {type: boolean}
                  instanceName: {type: [string, 'null']}
                  passwordResetEnabled:
                    type: boolean
                    description: Le central peut envoyer un lien de réinitialisation par courriel (SMTP et WEB_ORIGIN configurés).
  /api/v1/setup/central:
    post:
      security: []
      summary: Installer le central (usage unique) et ouvrir la session de l'administrateur
      description: >-
        Crée le compte administrateur (mot de passe haché en Argon2id), enregistre le nom
        du central et génère le secret de chiffrement. Refusé en 409 `already_configured`
        dès qu'un compte existe. Origin exact requis ; la session est posée comme à la connexion.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password]
              properties:
                name: {type: string}
                username: {type: string, minLength: 3, maxLength: 40}
                password: {type: string, minLength: 8, writeOnly: true}
                email: {type: string, description: Adresse de l'administrateur, facultative (mot de passe oublié)}
      responses:
        '200':
          description: Installation faite et session ouverte
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/setup/worker:
    post:
      security: []
      summary: Transformer une installation vierge en worker (usage unique)
      description: >-
        Enrôle cette installation auprès du central `central_url` avec les identifiants d'un
        administrateur, conserve le rôle et la clé dans `/config`, puis relance le processus en
        worker. 409 `already_configured` si l'installation est déjà configurée ; 502
        `central_unavailable` si le central est injoignable. Origin exact requis.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [central_url, username, password, worker_name]
              properties:
                central_url: {type: string, description: Origine du central, sans chemin}
                username: {type: string}
                password: {type: string, writeOnly: true}
                worker_name: {type: string, maxLength: 80, pattern: '^[A-Za-z0-9._-]+$'}
      responses:
        '202': {description: Enrôlement fait, l'installation redémarre en worker}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/setup/worker-request:
    get:
      security: []
      summary: Consulter l'état d'une demande d'enrôlement par approbation en cours
      responses:
        '200': {description: État de la demande}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: []
      summary: Lancer une demande d'enrôlement par approbation (ADR 0016) depuis une installation vierge
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [central_url, worker_name]
              properties:
                central_url: {type: string}
                worker_name: {type: string}
      responses:
        '202': {description: Demande soumise au central, attente d'approbation administrateur}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: []
      summary: Annuler une demande d'enrôlement en attente côté worker
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      responses:
        '204': {description: Demande annulée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/enrollment-window:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Ouvrir (15 min) ou fermer la fenêtre d'acceptation des demandes d'enrôlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [open]
              properties:
                open: {type: boolean}
      responses:
        '200': {description: État de la fenêtre d'enrôlement}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/requests:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister la fenêtre et les demandes d'enrôlement en attente (administrateur)
      responses:
        '200': {description: Liste des demandes en attente}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: []
      summary: Soumettre une demande d'enrôlement d'un worker lorsque la fenêtre est ouverte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_name, secret_hash]
              properties:
                worker_name: {type: string}
                worker_version: {type: [string, 'null']}
                secret_hash: {type: string}
      responses:
        '201': {description: Demande enregistrée}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/requests/{id}:
    get:
      security: []
      summary: Relever l'état d'une demande et récupérer la clé à usage unique si approuvée
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: État de la demande (avec clé unique si approved)}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/requests/{id}/approve:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Approuver une demande d'enrôlement en attente
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Demande approuvée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/requests/{id}/reject:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Refuser une demande d'enrôlement en attente
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Demande refusée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/enroll:
    post:
      security: []
      summary: Créer la clé d'API d'un worker
      description: >-
        Réservé aux identifiants d'un administrateur (essais limités). Renvoie une clé de rôle
        worker, affichée une seule fois. Sans cookie : appel de machine à machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, worker_name]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
                worker_name: {type: string, maxLength: 80, pattern: '^[A-Za-z0-9._-]+$'}
      responses:
        '200':
          description: Clé du worker
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/instance/status:
    get:
      security: []
      summary: État public de l'installation (central ou worker)
      responses:
        '200':
          description: Type d'installation et version
          content:
            application/json:
              schema:
                type: object
                required: [instanceKind, version]
                properties:
                  instanceKind: {type: string, enum: [central, worker]}
                  version: {type: string}
                  installed: {type: boolean, description: Central seulement}
                  name: {type: string, description: Worker seulement}
                  centralUrl: {type: string, description: Worker seulement}
                  registered: {type: boolean, description: Worker seulement}
                  centralReachable: {type: boolean, description: Worker seulement}
  /api/v1/jobs/{id}/artifacts/{kind}:
    put:
      security: [{ApiKey: []}]
      summary: Déclarer un fichier retenu chez le worker (fichier de travail d'un relais, ou résultat)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: kind, required: true, schema: {type: string, enum: [working, result]}}
        - {$ref: '#/components/parameters/WorkerId'}
        - {$ref: '#/components/parameters/LeaseToken'}
        - {in: header, name: x-lease-epoch, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtifactDeclaration'}
      responses:
        '204': {description: Artefact déclaré ; le preneur le tire chez ce worker avec un billet}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/artifacts/working/received:
    post:
      security: [{ApiKey: []}]
      summary: Confirmer la réception vérifiée du fichier de travail ; son détenteur peut le purger
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/WorkerId'}
        - {$ref: '#/components/parameters/LeaseToken'}
        - {in: header, name: x-lease-epoch, required: true, schema: {type: integer}}
      responses:
        '204': {description: Réception enregistrée}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/retained/{kind}:
    get:
      security: [{ApiKey: []}]
      summary: Indiquer si un fichier retenu est encore nécessaire (purge par son détenteur)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: kind, required: true, schema: {type: string, enum: [working, result]}}
        - {in: query, name: worker_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: lease_epoch, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Le fichier doit être conservé si la réponse vaut true
          content:
            application/json:
              schema: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/result/ready:
    post:
      security: [{ApiKey: []}]
      summary: Annoncer que le résultat déclaré est prêt ; la réponse arrive une fois le résultat appliqué
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/WorkerId'}
        - {$ref: '#/components/parameters/LeaseToken'}
        - {in: header, name: x-lease-epoch, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extension]
              properties:
                extension: {type: string}
                warning: {type: boolean, default: false}
                can_apply_locally: {type: boolean, default: false, description: Le worker sait appliquer lui-même le remplacement sur son montage}
      responses:
        '200':
          description: Sans apply_locally, un autre détenteur a tiré et appliqué le résultat ; avec, le worker l'applique puis confirme par result/applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  apply_locally:
                    type: object
                    required: [policy, root]
                    properties:
                      policy: {type: string, enum: [replace_with_backup, replace_in_place]}
                      root: {type: string, description: Racine du montage inscriptible de la source chez ce worker}
        '503': {description: "publication_pending : intention inscrite en cours de vérification, répéter"}
        '502': {description: "result_undeliverable : aucun détenteur actif ou adresse de transfert pour recevoir le résultat"}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/result/authorize:
    post:
      security: [{ApiKey: []}]
      summary: Dernière vérification du bail juste avant que le worker remplace la source
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/WorkerId'}
        - {$ref: '#/components/parameters/LeaseToken'}
        - {in: header, name: x-lease-epoch, required: true, schema: {type: integer}}
      responses:
        '204': {description: Remplacement autorisé}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/result/applied:
    post:
      security: [{ApiKey: []}]
      summary: Annoncer l'issue du remplacement appliqué par le worker qui traite
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/WorkerId'}
        - {$ref: '#/components/parameters/LeaseToken'}
        - {in: header, name: x-lease-epoch, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: string, enum: [published, source_changed, failed]}
      responses:
        '204': {description: Tâche réussie}
        '409': {description: Source modifiée (aucun remplacement) ou bail perdu}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/software-encoder-probes:
    get:
      security: [{ApiKey: []}]
      summary: Contrats de sondes d'encodeurs logiciels fournis par les plugins
      description: Le worker vérifie l'empreinte du binaire installé dans son cache avant d'exécuter la sonde.
      responses:
        '200':
          description: Sondes et artefacts disponibles par architecture
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [toolId, toolVersion, arch, executable, sha256, args, encoders]
                  properties:
                    toolId: {type: string}
                    toolVersion: {type: string}
                    arch: {type: string}
                    executable: {type: string}
                    sha256: {type: string}
                    args: {type: array, items: {type: string}}
                    encoders:
                      type: array
                      items:
                        type: object
                        required: [encoder, codec]
                        properties:
                          encoder: {type: string}
                          codec: {type: string, enum: [h264, hevc, av1]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/overview:
    get:
      security: [{ApiKey: []}]
      summary: Vue d'ensemble du worker appelant
      description: >-
        Nom, dernière activité et nombre de tâches par statut. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Vue d'ensemble}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/jobs:
    get:
      security: [{ApiKey: []}]
      summary: Tâches traitées par le worker appelant
      description: >-
        Les 100 plus récentes, jamais celles des autres workers. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Tâches du worker}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/plugins:
    get:
      security: [{ApiKey: []}]
      summary: Catalogue de plugins, en lecture seule
      description: >-
        Même catalogue que `GET /api/v1/plugins`. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Entrées du catalogue}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/login:
    post:
      security: [{ApiKey: []}]
      summary: Vérifier les identifiants saisis sur un worker
      description: >-
        Connexion déléguée : mêmes limites d'essais qu'une connexion directe ; renvoie id, identifiant et rôle du compte. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '200': {description: Compte vérifié}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/accounts:
    get:
      security: [{ApiKey: []}]
      summary: Copie des comptes pour la connexion de secours
      description: >-
        Hachés Argon2id et versions ; la copie remplace celle du worker en bloc (un compte absent est supprimé). Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Copie complète des comptes}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      security: []
      summary: Ouvrir une session web avec un compte
      description: >-
        Origin exact requis. Le serveur pose un cookie de session HttpOnly, SameSite=Strict
        (Secure si WEB_ORIGIN est HTTPS) et un cookie CSRF lisible par le frontend. Les échecs
        répétés sont limités : 429 `too_many_attempts`.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '200':
          description: Session créée ; réponse non mise en cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/forgot-password:
    post:
      security: []
      summary: Demander un lien de réinitialisation du mot de passe par courriel
      description: >-
        Répond 202 que l'adresse corresponde à un compte actif ou non (l'envoi se fait en arrière-plan).
        Un jeton à usage unique (30 minutes, haché en base) est envoyé dans un lien `<WEB_ORIGIN>/#reset=<jeton>`.
        Limites : 5 demandes par quart d'heure et par adresse (429 `too_many_attempts`), un courriel par
        minute et par compte. 404 si SMTP ou WEB_ORIGIN n'est pas configuré. Origin exact requis (ADR 0015).
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
      responses:
        '202': {description: Demande prise en compte}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/reset-password:
    post:
      security: []
      summary: Choisir un nouveau mot de passe avec le jeton reçu par courriel
      description: >-
        Consomme le jeton (un seul usage), change le mot de passe et ferme toutes les sessions du compte.
        400 si le jeton est inconnu, expiré ou déjà utilisé, ou si le mot de passe est refusé (le jeton
        n'est alors pas consommé). Origin exact requis.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string}
                new_password: {type: string, minLength: 8, writeOnly: true}
      responses:
        '204': {description: Mot de passe changé}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Identité, rôle, droits et type d'installation de l'appelant
      description: L'interface n'affiche que ce que ces droits permettent ; chaque route les revérifie.
      responses:
        '200':
          description: Profil courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: {type: string, enum: [account, apiKey]}
                  name: {type: string}
                  role: {type: string, enum: [admin, worker]}
                  permissions: {type: array, items: {type: string}}
                  instanceKind: {type: string, enum: [central, worker]}
                  instanceName: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/password:
    put:
      security: [{WebSession: []}]
      summary: Changer le mot de passe du compte connecté
      description: Les autres sessions du compte sont fermées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, writeOnly: true}
                new_password: {type: string, minLength: 8, writeOnly: true}
      responses:
        '204': {description: Mot de passe modifié}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/system/status:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: État du système pour la page Paramètres
      description: >-
        Administrateur seulement. Version, identifiant et origine (`local` ou `external`) de la clé de
        chiffrement, taille de la base SQLite et de son journal (`null` pour une base en mémoire),
        réseau (adresse d'écoute, TLS direct, origine web, durée de session) et stockage (dossiers,
        taille maximale d'un fichier, capacité et espace libre du volume de `dataDir`).
      responses:
        '200':
          description: État du système
          content:
            application/json:
              schema:
                type: object
                required: [version, keyId, keySource, databaseBytes, network, storage]
                properties:
                  version: {type: string}
                  keyId: {type: string}
                  keySource: {type: string, enum: [local, external]}
                  unreachableTimeoutSeconds: {type: integer, minimum: 60, maximum: 86400, description: "Délai d'injoignabilité avant remise en file (aussi accepté, facultatif, par PUT /api/v1/system/settings)."}
                  databaseBytes: {type: [integer, 'null']}
                  network:
                    type: object
                    required: [bind, tls, webOrigin, sessionTtlSeconds]
                    properties:
                      bind: {type: string}
                      tls: {type: boolean}
                      webOrigin: {type: [string, 'null']}
                      sessionTtlSeconds: {type: integer}
                  storage:
                    type: object
                    required: [configDir, dataDir, inputDir, toolsCacheDir, pluginsDir, maxFileBytes, volume]
                    properties:
                      configDir: {type: string}
                      dataDir: {type: string}
                      inputDir: {type: string}
                      toolsCacheDir: {type: string}
                      pluginsDir: {type: [string, 'null']}
                      maxFileBytes: {type: integer}
                      volume:
                        type: [object, 'null']
                        required: [totalBytes, availableBytes]
                        properties:
                          totalBytes: {type: integer}
                          availableBytes: {type: integer}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/system/updates:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Vérifier la dernière version publiée sur GitHub (désactivé par défaut, opt-in réseau)
      responses:
        '200': {description: État de vérification et éventuelle mise à jour disponible}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/system/hardware:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Charge matérielle du central (vue d'ensemble)
      description: >-
        Droit de consulter la vue d'ensemble. Relevé à la demande : cœurs logiques, charge CPU
        (charge sur 1 minute rapportée aux cœurs, 0 à 100), mémoire, périphériques GPU détectés,
        capacité et espace libre du volume de `dataDir` (`null` si illisible). Ne concerne que le
        central, pas les workers distants.
      responses:
        '200':
          description: Relevé matériel
          content:
            application/json:
              schema:
                type: object
                required: [logicalCores, cpuUsagePercent, ramTotalBytes, ramUsedBytes, gpuDevices, volume]
                properties:
                  logicalCores: {type: integer}
                  cpuUsagePercent: {type: number}
                  ramTotalBytes: {type: integer}
                  ramUsedBytes: {type: integer}
                  gpuDevices: {type: array, items: {type: string}}
                  volume:
                    type: [object, 'null']
                    required: [totalBytes, availableBytes]
                    properties:
                      totalBytes: {type: integer}
                      availableBytes: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/accounts:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les comptes (sans haché)
      responses:
        '200': {description: Comptes par identifiant}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer un compte
      description: >-
        Rôles admis : `admin` et `viewer` (le rôle `worker` est réservé aux clés d'API). Identifiant déjà
        pris : 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string, minLength: 3, maxLength: 40}
                password: {type: string, minLength: 8, writeOnly: true}
                role: {type: string, enum: [admin, viewer]}
      responses:
        '201': {description: Compte créé}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}:
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Changer le rôle ou désactiver un compte
      description: >-
        Au moins un champ. Les sessions du compte sont fermées. 409 si l'opération retirerait le dernier
        administrateur actif.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {type: string, enum: [admin, viewer]}
                disabled: {type: boolean}
                email:
                  type: string
                  description: Nouvelle adresse (chaîne vide pour l'effacer) ; ne ferme pas les sessions. 409 si elle est déjà prise.
      responses:
        '200': {description: Compte mis à jour}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/api-keys:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les clés d'API (sans secret ni haché)
      responses:
        '200':
          description: Clés actives d'abord
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer une clé d'API ; sa valeur n'est renvoyée qu'ici
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: {type: string}
                role: {type: string, enum: [admin, worker]}
      responses:
        '200':
          description: Clé créée (format fdf_<id>_<secret>)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiKey'}
                  - type: object
                    properties:
                      key: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/api-keys/{id}:
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Révoquer une clé d'API
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '204': {description: Clé révoquée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/mcp/audit:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Consulter l'historique des appels MCP (administrateur seulement)
      parameters:
        - in: query
          name: limit
          required: false
          schema: {type: integer, minimum: 1, maximum: 200}
        - in: query
          name: keyId
          required: false
          schema: {type: string}
        - in: query
          name: outcome
          required: false
          schema: {type: string, enum: [ok, error, forbidden, rate_limited]}
      responses:
        '200': {description: Liste paginée des événements d'audit MCP}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      security: [{WebSession: []}]
      summary: Révoquer la session en cours
      description: Requiert Origin exact, cookie CSRF et en-tête X-CSRF-Token ; supprime la session côté serveur et expire les cookies.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/OriginHeader'}
      responses:
        '204': {description: Session révoquée et cookies expirés}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les workers enregistrés, maximum 200
      responses:
        '200':
          description: Workers par nom ; last_seen est actualisé à chaque demande de travail
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}]
      summary: Enregistrer un worker ; le même nom conserve son UUID après redémarrage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$'}
                boot_id: {type: string, format: uuid, description: "Démarrage du processus, au premier enregistrement seulement ; nouveau, il reprend les tâches que l'ancien processus exécutait. Ignoré si la clé n'est pas celle de ce worker."}
      responses:
        '200':
          description: Worker enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/{id}/settings:
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Configurer la concurrence maximale (1..16), les places CPU/GPU et la fenêtre horaire d'un worker
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxConcurrency]
              properties:
                maxConcurrency: {type: integer, minimum: 1, maximum: 16}
                maxCpuJobs: {type: [integer, 'null'], minimum: 0, maximum: 16, description: "Places CPU. Absentes avec maxGpuJobs : mode historique (maxConcurrency commun à toutes les tâches)."}
                maxGpuJobs: {type: [integer, 'null'], minimum: 0, maximum: 16, description: "Places GPU ; absentes si maxCpuJobs est renseigné : 0 (aucune tâche GPU). Les deux à 0 sont refusés."}
                schedule: {type: [object, 'null']}
      responses:
        '200':
          description: Réglages worker mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/claims:
    post:
      security: [{ApiKey: []}]
      summary: Réserver atomiquement la prochaine tâche disponible pour ce worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: {type: string, format: uuid}
                lease_protocol: {type: integer, description: "Protocole de bail : 0 ou absent pour un worker antérieur à l'ADR 0027, 1 ensuite."}
                active_jobs: {type: array, items: {type: string, format: uuid}, description: "Tâches réellement tenues (protocole 1, clé de ce worker exigée) ; celles que le central lui attribue, absentes de la liste et sans contact depuis 30 s, sont reprises."}
      responses:
        '200':
          description: Bail (120 s au protocole 0 ; 30 s plus le délai d'injoignabilité au protocole 1), ou null si aucune tâche ; trois tentatives enchaînées au plus
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Claim'}
                  - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/heartbeat:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}]
      summary: Renouveler un bail ; seul un refus 409 de code `lease_lost` prouve qu'il est perdu
      requestBody: {$ref: '#/components/requestBodies/Lease'}
      responses:
        '204':
          description: Bail prolongé ; une tâche injoignable est rétablie
          headers:
            x-unreachable-timeout-seconds:
              description: Délai d'injoignabilité courant, en secondes
              schema: {type: integer}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/release:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}]
      summary: Rendre une tâche à l'arrêt propre du worker, processus déjà terminé (clé de ce worker)
      requestBody: {$ref: '#/components/requestBodies/Lease'}
      responses:
        '204': {description: "Tâche remise en file, ou en échec si la reprise automatique est exclue"}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/irreversible/authorize:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}]
      summary: Demander l'accord du central juste avant une action irréversible (clé de ce worker)
      description: "L'accord est inscrit avant la réponse et redonné au même bail. `lease_lost` : arrêter ; `lease_expired_or_conflict` : le bail vaut, mais l'action est exclue (publication en cours, flux d'échec déjà autorisé)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Lease'}
                - type: object
                  required: [lease_epoch, action, node_id]
                  properties:
                    lease_epoch: {type: integer}
                    action: {type: string, enum: [in_place, http_call, failure_flow]}
                    node_id: {type: string, maxLength: 128, description: "Bloc concerné ; ignoré pour failure_flow."}
                    error_code: {type: string, description: "Code de l'échec, exigé pour failure_flow."}
      responses:
        '204': {description: Accord inscrit}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/failure:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}]
      summary: Marquer une tâche active en échec terminal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Lease'}
                - type: object
                  required: [error_code]
                  properties:
                    error_code: {type: string, enum: [source_integrity, source_changed, remux_failed, transfer_failed]}
      responses:
        '204': {description: Échec enregistré}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ApiKey: {type: http, scheme: bearer, description: "Clé d'API fdf_<id>_<secret> (rôle admin ou worker) ; si Authorization existe elle a priorité sur le cookie, sans repli en cas d'invalidité"}
    WebSession: {type: apiKey, in: cookie, name: flux_session, description: Session web d'un compte avec CSRF sur les méthodes mutantes}
  parameters:
    JobId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    WorkerId:
      in: header
      name: x-worker-id
      required: true
      schema: {type: string, format: uuid}
    LeaseToken:
      in: header
      name: x-lease-token
      required: true
      schema: {type: string, format: uuid}
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: false
      description: Doit correspondre au cookie flux_csrf pour les requêtes authentifiées par session.
      schema: {type: string}
    OriginHeader:
      in: header
      name: Origin
      required: false
      description: Doit correspondre exactement à WEB_ORIGIN.
      schema: {type: string, format: uri}
  requestBodies:
    Lease:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Lease'}
  responses:
    Error:
      description: >-
        Erreur applicative JSON : 400 entrée invalide, 401 clé absente/invalide ou mauvais rôle,
        404 ressource absente, 409 bail perdu (`lease_lost`) ou conflit (`lease_expired_or_conflict`), 413 taille dépassée,
        500 défaillance interne. Les erreurs d'extraction HTTP (JSON/UUID) sont
        également normalisées. x-request-id permet de retrouver la requête dans les journaux.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code]
                properties:
                  code: {type: string}
                  message:
                    type: string
                    description: Cause d'une indisponibilité de dépôt (`repository_unavailable`), sur une ligne, 300 caractères au plus.
  schemas:
    DefaultFailureFlow:
      type: object
      description: Flux d'échec global (ADR 0022). Un flux désigne le sien par la clé `failureFlowId` de sa définition.
      properties:
        flowId: {type: [string, "null"]}
    SourcePublicationTask:
      type: object
      required: [request_id, worker_id, root, source_name, source_sha256, source_bytes, result_sha256, result_bytes, extension, policy]
      properties:
        request_id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        root: {type: string}
        source_name: {type: string}
        source_sha256: {type: string}
        source_bytes: {type: integer, minimum: 1}
        result_sha256: {type: string}
        result_bytes: {type: integer, minimum: 1}
        extension: {type: string}
        policy: {type: string, enum: [replace_with_backup, replace_in_place]}
    ArtifactDeclaration:
      type: object
      required: [root, name, sha256, bytes]
      properties:
        root: {type: string, description: Dossier du détenteur}
        name: {type: string, description: Fichier sous cette racine}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes: {type: integer, minimum: 1}
    HandoffArtifact:
      type: object
      required: [name, sha256, bytes]
      properties:
        name: {type: string, description: Nom du fichier de travail}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes: {type: integer, minimum: 1}
    ApiKey:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, worker]}
        createdAt: {type: string}
        lastUsedAt: {type: [string, 'null']}
        revokedAt: {type: [string, 'null']}
    WebSession:
      type: object
      required: [csrf_token, expires_at]
      properties:
        csrf_token: {type: string, description: CSRF cookie echo for frontend bootstrap}
        expires_at: {type: string, format: date-time}
    Lease:
      type: object
      required: [worker_id, lease_token]
      properties:
        worker_id: {type: string, format: uuid}
        lease_token: {type: string, format: uuid, writeOnly: true}
    Worker:
      type: object
      required: [id, name, last_seen, max_concurrency]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        last_seen: {type: string, format: date-time}
        max_concurrency: {type: integer, minimum: 1, maximum: 16}
        max_cpu_jobs: {type: integer, minimum: 0, maximum: 16, description: "Absent avec max_gpu_jobs : max_concurrency places communes. Sinon places CPU (défaut max_concurrency)."}
        max_gpu_jobs: {type: integer, minimum: 0, maximum: 16, description: "Places GPU (défaut 0 dès que max_cpu_jobs est renseigné). Total = CPU + GPU."}
        schedule: {type: [object, 'null']}
    JobLeaseInfo:
      type: object
      required: [job_id, reachability]
      properties:
        job_id: {type: string, format: uuid}
        reachability: {type: string, enum: [reachable, unreachable, awaiting_worker]}
        unreachable_since: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Reprise de la tâche si son titulaire ne revient pas.}
    JobResourceInfo:
      type: object
      required: [job_id, resource_class]
      properties:
        job_id: {type: string, format: uuid}
        resource_class: {type: string, enum: [cpu, gpu]}
    LibraryWorkerPath:
      type: object
      required: [worker_id, local_path, access]
      properties:
        source_key: {type: [string, 'null'], maxLength: 80, description: "Identifiant commun aux montages d’une source physique."}
        worker_id: {type: string, format: uuid, description: "UUID nul pour un dossier de la centrale."}
        local_path: {type: string, minLength: 1, maxLength: 512}
        access: {type: string, enum: [read, read_write]}
    LibraryWrite:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        flow_id: {type: [string, 'null']}
        workers:
          type: array
          items: {$ref: '#/components/schemas/LibraryWorkerPath'}
        scan_interval_minutes: {type: integer, minimum: 0, maximum: 10080}
        include_extensions:
          type: array
          items: {type: string}
        exclude_patterns:
          type: array
          items: {type: string}
        min_file_bytes: {type: integer, minimum: 0}
        output_policy: {type: string, enum: [output_dir, replace_with_backup, replace_in_place]}
        default_priority: {type: integer, minimum: -100, maximum: 100, default: 0, description: "Priorité des tâches créées sans priorité explicite."}
    Library:
      type: object
      required: [id, name, flow_id, workers, scan_interval_minutes, include_extensions, exclude_patterns, min_file_bytes, output_policy, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        flow_id: {type: [string, 'null']}
        workers:
          type: array
          items: {$ref: '#/components/schemas/LibraryWorkerPath'}
        scan_interval_minutes: {type: integer, minimum: 0, maximum: 10080}
        last_scanned_at: {type: [string, 'null'], format: date-time}
        include_extensions:
          type: array
          items: {type: string}
        exclude_patterns:
          type: array
          items: {type: string}
        min_file_bytes: {type: integer, minimum: 0}
        output_policy: {type: string, enum: [output_dir, replace_with_backup, replace_in_place]}
        default_priority: {type: integer, minimum: -100, maximum: 100, default: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Claim:
      type: object
      required: [job_id, lease_token, source_name, source_sha256, source_bytes]
      properties:
        job_id: {type: string, format: uuid}
        lease_token: {type: string, format: uuid}
        source_name: {type: string}
        source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        source_bytes: {type: integer, minimum: 1}
        local_source_root: {type: string, description: "Dossier local au worker pour une source sur son montage."}
        resume_node_id: {type: string, description: Identifiant du nœud où reprendre le flux figé.}
        resumed_outputs:
          type: object
          description: "Sorties des nœuds exécutés avant le relais (`message`, `nextPort`), lues par `{$nodes.<id>.…}` à la reprise (ADR 0026)."
          additionalProperties:
            type: object
            properties:
              message: {type: string, nullable: true}
              nextPort: {type: string, nullable: true}
        lease_terms:
          type: object
          description: Règles du bail ; absentes d'un central antérieur à l'ADR 0027.
          properties:
            unreachable_timeout_seconds: {type: integer}
        prior_warning: {type: boolean, default: false, description: Avertissement accumulé avant la remise.}
        linked_flows:
          type: array
          description: Versions figées du flux d'échec et des sous-flux de la tâche (ADR 0022).
          items:
            type: object
            required: [role, flow]
            properties:
              role: {type: string, enum: [failure, sub_flow]}
              flow: {type: object, description: Flux figé (FlowRecord).}
        handoff_input:
          type: object
          description: Fichier de travail vérifié et conservé par le repreneur.
          required: [sourceLeaseEpoch, artifact]
          properties:
            sourceLeaseEpoch: {type: integer}
            artifact: {$ref: '#/components/schemas/HandoffArtifact'}
    Job:
      type: object
      required: [id, source_name, status, attempts, warning, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        source_name: {type: string}
        source_sha256: {type: [string, 'null']}
        source_bytes: {type: [integer, 'null']}
        target_worker_id: {type: [string, 'null'], format: uuid}
        worker_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed, canceled]}
        attempts: {type: integer, minimum: 0, maximum: 3}
        priority: {type: integer, minimum: -100, maximum: 100}
        leased_until: {type: [string, 'null'], format: date-time}
        output_name: {type: [string, 'null']}
        output_sha256: {type: [string, 'null']}
        output_bytes: {type: [integer, 'null']}
        warning: {type: boolean}
        error_code: {type: [string, 'null']}
        flow_id:
          type: [string, 'null']
          description: Flow par défaut retenu à la création de la tâche.
        flow_version:
          type: [integer, 'null']
          description: Version figée du flow ; modifier le flow ensuite ne change pas la tâche.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ScriptInterpreter:
      type: string
      enum: [bash, sh, python3, node, deno, bun, pwsh]
    LocalScriptSummary:
      type: object
      required: [id, slug, name, interpreter, entrypoint, code]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        interpreter: {$ref: '#/components/schemas/ScriptInterpreter'}
        entrypoint: {type: string}
        code: {type: string}
        category: {type: [string, 'null'], enum: [media, data, io, other, null]}
        tags: {type: array, items: {type: string}}
        variables: {type: array, items: {$ref: '#/components/schemas/ScriptVariable'}}
        requires: {type: array, items: {$ref: '#/components/schemas/ScriptRequirement'}}
        dependenciesUnverified: {type: boolean}
    ScriptRequirement:
      type: object
      description: Variable exposée par un plugin que le script consomme (ADR 0025) ; dépendance dure par défaut
      required: [variable, provider]
      properties:
        variable: {type: string, description: 'Référence complète : espace.nom'}
        provider: {type: string, description: Identifiant du plugin fournisseur dans le catalogue}
        contractMajor: {type: integer, minimum: 0, default: 1}
        repository:
          type: object
          description: Dépôt qui publie le fournisseur, jamais ajouté automatiquement
          required: [id, indexUrl]
          properties:
            id: {type: string}
            indexUrl: {type: string, format: uri}
    ScriptVariable:
      type: object
      description: Variable d'un script déclarée dans `runtime.variables` (ADR 0025)
      required: [name]
      properties:
        name: {type: string, maxLength: 64, pattern: '^[a-z][a-z0-9_]*$'}
        label: {type: string}
        description: {type: [string, 'null']}
        type: {type: string, enum: [text, multiline, number, boolean, choice, secret], default: text}
        default: {description: "Valeur du type de la variable ; interdite pour un secret"}
        required: {type: boolean}
        options: {type: array, items: {type: string}, description: Options d'un choix (obligatoires pour ce type seulement)}
        min: {type: number}
        max: {type: number}
    UpsertLocalScriptRequest:
      type: object
      required: [name, interpreter, code]
      properties:
        id: {type: [string, 'null']}
        name: {type: string}
        description: {type: [string, 'null']}
        interpreter: {$ref: '#/components/schemas/ScriptInterpreter'}
        code: {type: string}
        filename: {type: [string, 'null']}
        category: {type: [string, 'null'], enum: [media, data, io, other, null]}
        tags: {type: array, items: {type: string}}
        variables: {type: array, items: {$ref: '#/components/schemas/ScriptVariable'}, description: Schéma validé à l'écriture ; `400` s'il est invalide}
        requires: {type: array, items: {$ref: '#/components/schemas/ScriptRequirement'}, description: Dépendances validées à l'écriture (références espace.nom uniques, un fournisseur et une version majeure par espace de noms) ; `400` si elles sont invalides}
        dependenciesUnverified: {type: boolean, description: Script intégré sans ses dépendances ; elles ne sont ni contrôlées ni installées}
    LocalResourceSummary:
      type: object
      required: [id, slug, name, entryType, filename, sizeBytes]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        entryType: {type: string}
        filename: {type: string}
        sizeBytes: {type: integer, minimum: 0}
        description: {type: [string, 'null']}
    UploadLocalResourceRequest:
      type: object
      required: [name, entryType, filename, contentBase64]
      properties:
        id: {type: [string, 'null']}
        name: {type: string}
        entryType: {type: string}
        filename: {type: string}
        contentBase64: {type: string, format: byte}
        description: {type: [string, 'null']}
    LocalBlockTemplate:
      type: object
      required: [id, name, definition, isLocal]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        definition: {type: object}
        tags: {type: array, items: {type: string}}
        isLocal: {type: boolean}
    CreateBlockTemplateRequest:
      type: object
      required: [name, definition]
      properties:
        id: {type: [string, 'null']}
        name: {type: string}
        description: {type: [string, 'null']}
        definition: {type: object}
        tags: {type: array, items: {type: string}}
    LocalFlowTemplate:
      type: object
      required: [id, name, fileMask, version, definition, isLocal]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        fileMask: {type: string}
        version: {type: string}
        definition: {type: object}
        isLocal: {type: boolean}
    CreateFlowTemplateRequest:
      type: object
      required: [name, definition]
      properties:
        id: {type: [string, 'null']}
        name: {type: string}
        description: {type: [string, 'null']}
        fileMask: {type: [string, 'null']}
        definition: {type: object}
    CreateLocalPackRequest:
      type: object
      required: [name, components]
      properties:
        id: {type: [string, 'null']}
        name: {type: string}
        description: {type: [string, 'null']}
        components: {type: array, items: {type: object}}
        entrypoint: {type: [object, 'null']}
    LocalLibrarySnapshot:
      type: object
      required: [scripts, resources, blockTemplates, flowTemplates, packs]
      properties:
        scripts: {type: array, items: {$ref: '#/components/schemas/LocalScriptSummary'}}
        resources: {type: array, items: {$ref: '#/components/schemas/LocalResourceSummary'}}
        blockTemplates: {type: array, items: {$ref: '#/components/schemas/LocalBlockTemplate'}}
        flowTemplates: {type: array, items: {$ref: '#/components/schemas/LocalFlowTemplate'}}
        packs: {type: array, items: {type: object}}
