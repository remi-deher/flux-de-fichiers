[package]
name = "flux-client"
version = "0.15.0"
edition = "2024"
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flux-shared = { path = "../shared" }
leptos = { version = "0.8.23", default-features = false, features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
gloo-net = { version = "0.6.0", default-features = false, features = ["http", "json"] }
web-sys = { version = "0.3.107", features = ["EventSource", "MessageEvent"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
js-sys = "0.3.107"
uuid = { version = "1.18", default-features = false, features = ["serde", "std"] }
console_error_panic_hook = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
