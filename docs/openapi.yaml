openapi: 3.1.0
info:
  title: Flux de Fichiers — API de remuxage
  version: 0.1.0
  description: >-
    Coordinateur centralisé, workers MKVToolNix et frontend Leptos.
    Les noms de fichiers sont des noms MKV simples présents dans INPUT_DIR.
    Les clés administrateur et agent sont distinctes. Le bail est un secret
    temporaire transmis dans le corps des renouvellements ou dans un en-tête,
    jamais dans une URL. L'API accepte les clés Bearer et, pour le navigateur,
    une session cookie avec CSRF/origine. Tous les échanges distants nécessitent HTTPS.
servers:
  - url: https://localhost:3443
security:
  - AdminKey: []
paths:
  /:
    get:
      security: []
      summary: Informations publiques minimales du service
      responses:
        '200':
          description: Service et absence d'interface
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: {type: string}
                  interface: {type: boolean, const: false}
  /health:
    get:
      security: []
      summary: Disponibilité du coordinateur et de PostgreSQL
      responses:
        '204': {description: PostgreSQL joignable}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/files:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Lister les entrées MKV admissibles, triées par nom, maximum 500
      responses:
        '200':
          description: Fichiers non vides sous la limite de taille, sans liens symboliques
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, bytes]
                  properties:
                    name: {type: string}
                    bytes: {type: integer, minimum: 1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Lister les bibliothèques déclarées, triées par nom
      responses:
        '200':
          description: Chaque bibliothèque porte au plus un flux et un chemin par nœud
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Library'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Déclarer une bibliothèque
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryWrite'}
      responses:
        '201':
          description: Bibliothèque créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Lire une bibliothèque
      responses:
        '200':
          description: Bibliothèque
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Remplacer le nom, le flux et les chemins de nœuds
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryWrite'}
      responses:
        '200':
          description: Bibliothèque mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Supprimer une bibliothèque et ses chemins de nœuds
      responses:
        '204': {description: Supprimée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Lister les tâches par ordre de création décroissant
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: before
          description: UUID de la dernière tâche de la page précédente
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Page, tableau vide en fin de liste ou si le curseur est inconnu
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Créer une tâche et figer l'empreinte de la source
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - in: header
          name: Origin
          required: false
          description: Requis et égal à WEB_ORIGIN pour l'authentification par cookie ; Bearer reste indépendant.
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_name]
              properties:
                source_name: {type: string, maxLength: 240, example: exemple.mkv}
                target_worker_id: {type: [string, 'null'], format: uuid}
      responses:
        '201':
          description: Tâche créée ; les soumissions répétées créent des tâches distinctes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Consulter l'état d'une tâche sans exposer son jeton de bail
      responses:
        '200':
          description: Tâche
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/output:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Télécharger le résultat d'une tâche réussie
      responses:
        '200':
          description: Résultat immuable, téléchargement attachment en flux avec Cache-Control no-store
          headers:
            Content-Length:
              description: Taille exacte du fichier
              schema: {type: integer, minimum: 1}
            Cache-Control:
              description: Le média ne doit pas être mis en cache.
              schema: {type: string, const: no-store}
            Content-Disposition:
              description: Téléchargement direct, sans mise en mémoire du média.
              schema: {type: string}
          content:
            video/x-matroska:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Catalogue lu dans les dépôts de plugins synchronisés (vide tant qu'aucun dépôt n'est synchronisé)
      responses:
        '200':
          description: Fiches du catalogue ; une fiche inconnue du coordinateur est ignorée
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Lister les dépôts de plugins
      responses:
        '200': {description: Dépôts, officiel en premier}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Ajouter un dépôt ; l'URL d'index doit être http(s) et finir par /catalogue/index.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, indexUrl]
              properties:
                id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$', description: Nom du dossier local du dépôt}
                name: {type: string, minLength: 1}
                indexUrl: {type: string, format: uri}
      responses:
        '200': {description: Dépôt ajouté}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}:
    delete:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Supprimer un dépôt tiers (le dépôt officiel est protégé)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Dépôt supprimé}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/toggle:
    put:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Activer ou désactiver un dépôt
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Nouvel état}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/sync:
    post:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: >-
        Synchroniser un dépôt : copie atomique de l'index, des manifestes et des contrats de
        distribution dans /config/plugins/{id}. Sans redirection, adresses privées refusées
        (sauf PLUGIN_ALLOW_PRIVATE_HOSTS=1), taille et nombre de fichiers bornés.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Bilan (entrées, fichiers, fiches ignorées)}
        '502': {description: Dépôt injoignable ou refusé, l'ancienne copie est conservée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/{id}/settings:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Champs de réglages d'un plugin ; un secret n'est jamais renvoyé, seulement isSet
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Champs résolus et réglages publics}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: >-
        Enregistrer les réglages d'un plugin du catalogue. Les secrets saisis sont chiffrés
        (ChaCha20-Poly1305, clé /config/secret_key) ; un secret laissé vide est conservé.
        Maximum 64 clés et 64 Kio.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Réglages enregistrés, secrets exclus de la réponse}
        '413': {description: Réglages trop volumineux}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: État des outils du catalogue dans le cache du coordinateur (ready ou not_installed)
      responses:
        '200': {description: Outils}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}/distribution:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Contrat de distribution d'un outil, lu dans le dépôt synchronisé
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Contrat distribution.v1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}/install:
    post:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: >-
        Installer un outil du catalogue dans le cache du coordinateur : téléchargement https,
        redirections revérifiées, SHA-256 de l'archive et du binaire contrôlés avant exécution.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Outil prêt}
        '502': {description: Archive injoignable}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/tools/{id}/distribution:
    get:
      security: [{WorkerKey: []}]
      summary: Contrat de distribution d'un outil pour un worker, qui l'installe dans son propre cache
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Contrat distribution.v1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    get:
      security: [{WebSession: []}]
      summary: Lire le statut de session et récupérer le jeton CSRF après rechargement
      responses:
        '200':
          description: Session valide et réponse non mise en cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: []
      summary: Ouvrir une session web avec la clé administrateur
      description: >-
        Origin doit correspondre exactement à WEB_ORIGIN. La clé est transmise
        dans un corps JSON, jamais dans une URL. Le serveur pose un cookie de
        session HttpOnly, SameSite=Strict, Secure lorsque WEB_ORIGIN est HTTPS,
        et un cookie CSRF lisible par le frontend. Durée par défaut 8 h.
      parameters:
        - in: header
          name: Origin
          required: true
          description: Doit correspondre exactement à WEB_ORIGIN.
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_key]
              properties:
                admin_key: {type: string, writeOnly: true}
      responses:
        '200':
          description: Session créée ; les deux cookies sont posés et la réponse n'est pas mise en cache
          headers:
            Set-Cookie:
              description: flux_session (HttpOnly) et flux_csrf (lisible par le client), Path=/, SameSite=Strict
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      security: [{WebSession: []}]
      summary: Révoquer la session en cours
      description: Requiert Origin exact, cookie CSRF et en-tête X-CSRF-Token ; supprime la session côté serveur et expire les cookies.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/OriginHeader'}
      responses:
        '204': {description: Session révoquée et cookies expirés}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers:
    get:
      security: [{AdminKey: []}, {WebSession: []}]
      summary: Lister les agents enregistrés, maximum 200
      responses:
        '200':
          description: Agents par nom ; last_seen est actualisé à chaque demande de travail
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{WorkerKey: []}]
      summary: Enregistrer un agent ; le même nom conserve son UUID après redémarrage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$'}
      responses:
        '200':
          description: Agent enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/claims:
    post:
      security: [{WorkerKey: []}]
      summary: Réserver atomiquement la prochaine tâche disponible pour cet agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: {type: string, format: uuid}
      responses:
        '200':
          description: Bail de 120 secondes, ou null si aucune tâche ; trois tentatives maximum
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Claim'}
                  - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/heartbeat:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{WorkerKey: []}]
      summary: Renouveler un bail actif ; agent configuré à un renouvellement toutes les 20 s
      requestBody: {$ref: '#/components/requestBodies/Lease'}
      responses:
        '204': {description: Bail prolongé de 120 secondes}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/failure:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{WorkerKey: []}]
      summary: Marquer une tâche active en échec terminal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Lease'}
                - type: object
                  required: [error_code]
                  properties:
                    error_code: {type: string, enum: [source_integrity, remux_failed, transfer_failed]}
      responses:
        '204': {description: Échec enregistré}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/source:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - {$ref: '#/components/parameters/WorkerId'}
      - {$ref: '#/components/parameters/LeaseToken'}
    get:
      security: [{WorkerKey: []}]
      summary: Télécharger la source pour un bail actif ; l'agent vérifie son empreinte
      responses:
        '200':
          description: Fichier source, Content-Length fourni
          content:
            video/x-matroska:
              schema: {type: string, format: binary}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/result:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - {$ref: '#/components/parameters/WorkerId'}
      - {$ref: '#/components/parameters/LeaseToken'}
    put:
      security: [{WorkerKey: []}]
      summary: Téléverser puis valider et publier le résultat atomiquement
      parameters:
        - in: header
          name: x-remux-warning
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          video/x-matroska:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Résultat publié, bail consommé}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AdminKey: {type: http, scheme: bearer, description: Clé administrateur ; si Authorization existe elle a priorité sur le cookie, sans repli en cas d'invalidité}
    WebSession: {type: apiKey, in: cookie, name: flux_session, description: Session web administrateur avec CSRF sur les méthodes mutantes}
    WorkerKey: {type: http, scheme: bearer, description: Clé du groupe d'agents de confiance}
  parameters:
    JobId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    WorkerId:
      in: header
      name: x-worker-id
      required: true
      schema: {type: string, format: uuid}
    LeaseToken:
      in: header
      name: x-lease-token
      required: true
      schema: {type: string, format: uuid}
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: false
      description: Doit correspondre au cookie flux_csrf pour les requêtes authentifiées par session.
      schema: {type: string}
    OriginHeader:
      in: header
      name: Origin
      required: false
      description: Doit correspondre exactement à WEB_ORIGIN.
      schema: {type: string, format: uri}
  requestBodies:
    Lease:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Lease'}
  responses:
    Error:
      description: >-
        Erreur applicative JSON : 400 entrée invalide, 401 clé absente/invalide ou mauvais rôle,
        404 ressource absente, 409 bail expiré ou conflit, 413 taille dépassée,
        500 défaillance interne. Les erreurs d'extraction HTTP (JSON/UUID) sont
        également normalisées. x-request-id permet de retrouver la requête dans les journaux.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code]
                properties:
                  code: {type: string}
  schemas:
    WebSession:
      type: object
      required: [csrf_token, expires_at]
      properties:
        csrf_token: {type: string, description: CSRF cookie echo for frontend bootstrap}
        expires_at: {type: string, format: date-time}
    Lease:
      type: object
      required: [worker_id, lease_token]
      properties:
        worker_id: {type: string, format: uuid}
        lease_token: {type: string, format: uuid, writeOnly: true}
    Worker:
      type: object
      required: [id, name, last_seen]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        last_seen: {type: string, format: date-time}
    LibraryNode:
      type: object
      required: [worker_id, local_path, access]
      properties:
        worker_id: {type: string, format: uuid}
        local_path: {type: string, minLength: 1, maxLength: 512}
        access: {type: string, enum: [read, read_write]}
    LibraryWrite:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        flow_id: {type: [string, 'null']}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/LibraryNode'}
    Library:
      type: object
      required: [id, name, flow_id, nodes, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        flow_id: {type: [string, 'null']}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/LibraryNode'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Claim:
      type: object
      required: [job_id, lease_token, source_name, source_sha256, source_bytes]
      properties:
        job_id: {type: string, format: uuid}
        lease_token: {type: string, format: uuid}
        source_name: {type: string}
        source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        source_bytes: {type: integer, minimum: 1}
    Job:
      type: object
      required: [id, source_name, status, attempts, warning, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        source_name: {type: string}
        source_sha256: {type: [string, 'null']}
        source_bytes: {type: [integer, 'null']}
        target_worker_id: {type: [string, 'null'], format: uuid}
        worker_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        attempts: {type: integer, minimum: 0, maximum: 3}
        leased_until: {type: [string, 'null'], format: date-time}
        output_name: {type: [string, 'null']}
        output_sha256: {type: [string, 'null']}
        output_bytes: {type: [integer, 'null']}
        warning: {type: boolean}
        error_code: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
