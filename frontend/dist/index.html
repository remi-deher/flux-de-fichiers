<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#151416" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f2ef" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forgearr">
  <meta name="application-name" content="Forgearr">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Forgearr, le moteur de traitement média pour les stacks *arr.">
  <link rel="icon" type="image/svg+xml" href="/forgearr.svg">
  <title>Forgearr — Pilotage et supervision</title>
  <style>

:root {
  /* --- Safe Area Insets (Apple HIG & WebKit) --- */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);

  /* --- Cibles tactiles minimales (Google M3 48px & Apple HIG 44px) --- */
  --touch-target-min: 48px;
  --touch-target-compact: 44px;
  /* Plancher WCAG 2.5.8 d'une cible au pointeur fin, et taille des cases à cocher. */
  --touch-target-pointer: 24px;
  --control-check-size: 16px;

  /* --- Échelle d'espacement (mise en page aérée) --- */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;

  /* --- Échelle typographique (12 px au minimum) --- */
  --font-size-xs: 0.857143rem;
  --font-size-sm: 0.928571rem;
  --font-size-md: 1rem;
  --font-size-lg: 1.142857rem;
  --font-size-xl: 1.285714rem;
  --font-size-2xl: 1.428571rem;
  --font-size-display: 2rem;

  /* --- Rayons, courbes et typographie --- */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* --- Surfaces & Couleurs Thème Sombre --- */
  --bg-app: #151416;
  --bg-card: #242326;
  --bg-elevated: #1c1b1e;
  --bg-subtle: #302e32;
  --bg-glass: rgba(28, 27, 30, 0.82);
  --border-color: #403d42;
  --border-subtle: rgba(240, 246, 252, 0.07);
  --border-highlight: rgba(240, 173, 128, 0.55);
  --border-control: #817b83;
  --text-main: #f3f6fc;
  --text-dim: #94a3b8;
  --text-muted: #a09aa1;
  --primary: #f0ad80;
  --primary-fill: #994823;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(240, 173, 128, 0.16);
  --accent: #22d3ee;
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.14);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --danger: #f87171;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --danger-text: #f87171;
  --danger-fill: #dc2626;
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.15);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-glow: 0 0 0 1px rgba(240, 173, 128, 0.35), 0 8px 24px rgba(240, 173, 128, 0.2);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
  --bg-app: #f5f2ef;
  --bg-card: #ffffff;
  --bg-elevated: #fbf8f6;
  --bg-subtle: #f5f2ef;
  --bg-glass: rgba(251, 248, 246, 0.88);
  --border-color: #e6ded9;
  --border-subtle: rgba(15, 23, 42, 0.07);
  --border-highlight: rgba(153, 72, 35, 0.45);
  --border-control: #7c8a9c;
  --text-main: #0f172a;
  --text-dim: #475569;
  --text-muted: #5b6b80;
  --primary: #994823;
  --primary-fill: #994823;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(153, 72, 35, 0.10);
  --accent: #0e7490;
  --success: #047857;
  --success-bg: rgba(5, 150, 105, 0.10);
  --warning: #b45309;
  --warning-bg: rgba(217, 119, 6, 0.10);
  --danger: #b91c1c;
  --danger-bg: rgba(220, 38, 38, 0.10);
  --danger-text: #b91c1c;
  --danger-fill: #b91c1c;
  --info: #0369a1;
  --info-bg: rgba(2, 132, 199, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 0 0 1px rgba(9, 105, 218, 0.25), 0 8px 20px rgba(9, 105, 218, 0.12);
  }
}

[data-theme="light"] {
  --bg-app: #f5f2ef;
  --bg-card: #ffffff;
  --bg-elevated: #fbf8f6;
  --bg-subtle: #f5f2ef;
  --bg-glass: rgba(251, 248, 246, 0.88);
  --border-color: #e6ded9;
  --border-subtle: rgba(15, 23, 42, 0.07);
  --border-highlight: rgba(153, 72, 35, 0.45);
  --border-control: #7c8a9c;
  --text-main: #0f172a;
  --text-dim: #475569;
  --text-muted: #5b6b80;
  --primary: #994823;
  --primary-fill: #994823;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(153, 72, 35, 0.10);
  --accent: #0e7490;
  --success: #047857;
  --success-bg: rgba(5, 150, 105, 0.10);
  --warning: #b45309;
  --warning-bg: rgba(217, 119, 6, 0.10);
  --danger: #b91c1c;
  --danger-bg: rgba(220, 38, 38, 0.10);
  --danger-text: #b91c1c;
  --danger-fill: #b91c1c;
  --info: #0369a1;
  --info-bg: rgba(2, 132, 199, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 0 0 1px rgba(9, 105, 218, 0.25), 0 8px 20px rgba(9, 105, 218, 0.12);
}

[data-theme="dark"] {
  --bg-app: #151416;
  --bg-card: #242326;
  --bg-elevated: #1c1b1e;
  --bg-subtle: #302e32;
  --bg-glass: rgba(28, 27, 30, 0.82);
  --border-color: #403d42;
  --border-subtle: rgba(240, 246, 252, 0.07);
  --border-highlight: rgba(240, 173, 128, 0.55);
  --border-control: #817b83;
  --text-main: #f3f6fc;
  --text-dim: #94a3b8;
  --text-muted: #a09aa1;
  --primary: #f0ad80;
  --primary-fill: #994823;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(240, 173, 128, 0.16);
  --accent: #22d3ee;
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.14);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --danger: #f87171;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --danger-text: #f87171;
  --danger-fill: #dc2626;
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.15);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-glow: 0 0 0 1px rgba(240, 173, 128, 0.35), 0 8px 24px rgba(240, 173, 128, 0.2);
}


*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 87.5%;
}

html, body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  text-rendering: optimizeLegibility;
}

/* Le corps prend sa taille de l'échelle ; `html` garde la racine en pourcentage (sinon `1rem`
   y vaudrait la préférence du navigateur entière). */
body {
  font-size: var(--font-size-md);
}

/* --- Rendu tactile mobile & suppression des reflets parasites (Apple/Google) --- */
button, a, select, input {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* --- Focus Ring Accessible W3C (WCAG AAA) --- */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* --- Respect des préférences de réduction de mouvement (Apple HIG & Google M3) --- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* --- Texte réservé aux technologies d'assistance (titre de page, libellés) --- */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* --- Skip Link (Accessibilité Clavier W3C) --- */
.skip-link {
  position: absolute;
  top: -100px;
  left: 1rem;
  background: var(--primary-fill);
  color: var(--primary-contrast);
  padding: 0.5rem 1rem;
  border-radius: var(--radius-sm);
  z-index: 9999;
  text-decoration: none;
  font-weight: 600;
  transition: top 0.2s ease;
}

.skip-link:focus {
  top: 1rem;
}

/* --- Structure globale du shell (Sidebar Rail + Zone de contenu) --- */
.application-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-app);
  color: var(--text-main);
  box-sizing: border-box;
}

.application-navigation-layout {
  display: flex;
  flex: 1;
  min-height: 100vh;
  padding: 0.5rem;
  gap: 0.5rem;
  background-color: var(--bg-app);
  box-sizing: border-box;
}

/* --- Barre latérale de navigation (App Frame style Linear / Raycast) --- */
.application-sidebar {
  width: 244px;
  background-color: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.22s var(--ease-out);
  position: sticky;
  top: 0.5rem;
  height: calc(100vh - 1rem);
  overflow-x: hidden;
  overflow-y: auto;
  z-index: 50;
  box-sizing: border-box;
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
}

.application-sidebar.is-collapsed {
  width: 76px;
}

.application-sidebar.is-collapsed .brand-info,
.application-sidebar.is-collapsed .tab-btn-label,
.application-sidebar.is-collapsed .tab-btn-badge,
.application-sidebar.is-collapsed .nav-group-label,
.application-sidebar.is-collapsed .sidebar-user-meta {
  display: none;
}

.application-sidebar.is-collapsed .application-sidebar.is-collapsed .sidebar-user-card {
  flex-direction: column;
  padding: 0.4rem;
}

.application-sidebar.is-collapsed .tab-btn {
  justify-content: center;
  padding: 0.75rem 0.5rem;
}

.application-sidebar.is-collapsed .brand {
  justify-content: center;
}

.application-sidebar.is-collapsed .sidebar-footer {
  padding: 0.75rem 0.5rem;
  align-items: center;
}

.application-sidebar.is-collapsed .sidebar-collapse-btn {
  width: 40px;
  height: 40px;
  padding: 0;
  margin: 0 auto;
  border-radius: var(--radius-sm);
  justify-content: center;
}

.application-sidebar.is-collapsed .sidebar-collapse-btn .collapse-icon {
  transform: rotate(180deg);
}

.application-sidebar.is-collapsed .sidebar-footer-tools {
  width: 100%;
  justify-content: center;
}

/* Replié : le thème se règle barre dépliée, la déconnexion reste accessible. */
.application-sidebar.is-collapsed .theme-segmented {
  display: none;
}

/* En-tête de la marque */
.sidebar-header {
  padding: 1.25rem 1rem;
  border-bottom: 1px solid var(--border-color);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: var(--text-main);
}

.brand-mark {
  width: var(--space-4);
  height: var(--space-4);
  flex-shrink: 0;
}

.brand-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.brand-name {
  font-weight: 700;
  font-size: var(--font-size-sm);
  white-space: nowrap;
}

.brand-meta {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.15rem;
}

.brand-node-badge {
  display: inline-flex;
  align-items: center;
  padding: 0.08rem 0.42rem;
  border-radius: var(--radius-pill);
  background: var(--primary-bg);
  color: var(--primary);
  font-size: var(--font-size-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.brand-version {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
}

/* Groupes et boutons de navigation */
.tab-navigation {
  flex: 1;
  padding: 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.tab-list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.nav-group-label {
  font-size: var(--font-size-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  padding: 0.75rem 0.5rem 0.25rem 0.5rem;
  user-select: none;
}

.tab-btn {
  display: flex;
  text-decoration: none;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  min-height: var(--touch-target-compact);
  padding: 0.625rem 0.75rem;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-size: var(--font-size-sm);
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  user-select: none;
  touch-action: manipulation;
  transition: all 0.16s var(--ease-out);
}

.tab-btn:hover {
  background-color: var(--bg-subtle);
  color: var(--text-main);
}

.tab-btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}

.tab-btn[aria-current="page"] {
  background-color: var(--primary-bg);
  color: var(--primary);
  font-weight: 600;
  border-color: color-mix(in srgb, var(--primary) 35%, transparent);
  box-shadow: inset 3px 0 0 var(--primary);
}

.tab-role-icon {
  font-size: var(--font-size-lg);
  flex-shrink: 0;
}

.tab-btn-label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tab-btn-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.35rem;
  height: 1.2rem;
  padding: 0 0.4rem;
  border-radius: var(--radius-pill);
  font-size: var(--font-size-xs);
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  background: var(--bg-subtle);
  color: var(--text-dim);
  flex-shrink: 0;
}

.tab-btn-badge[data-tone="primary"] {
  background: var(--primary-bg);
  color: var(--primary);
}

.tab-btn-badge[data-tone="success"] {
  background: var(--success-bg);
  color: var(--success);
}

.tab-btn-badge[data-tone="warning"] {
  background: var(--warning-bg);
  color: var(--warning);
}

.tab-btn-badge[data-tone="danger"] {
  background: var(--danger-bg);
  color: var(--danger);
}

/* Pied de la barre latérale */
.sidebar-footer-nav {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.sidebar-footer {
  padding: 0.75rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.sidebar-user-card {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.45rem 0.55rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
}

.sidebar-user-avatar {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-pill);
  background: var(--primary-bg);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-size-xs);
  font-weight: 700;
  flex-shrink: 0;
}

.sidebar-user-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.sidebar-user-name {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-user-role {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Boutons carrés du pied : replier la barre et se déconnecter. */
.sidebar-collapse-btn,
.sidebar-logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s ease-in-out;
}

.sidebar-collapse-btn:hover,
.sidebar-logout-btn:hover {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--primary);
}

.collapse-icon {
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.sidebar-footer-tools {
  display: flex;
  gap: 0.5rem;
}

/* Thème : trois boutons exclusifs. */
.theme-segmented {
  display: flex;
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.theme-segmented__btn {
  flex: 1;
  padding: 0.4rem 0.25rem;
  white-space: nowrap;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: var(--font-size-xs);
  cursor: pointer;
}

.theme-segmented__btn:hover {
  color: var(--text-main);
}

.theme-segmented__btn[aria-pressed="true"] {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  font-weight: 600;
}

/* Déconnexion : un bouton discret à côté du thème, toujours accessible. */
.sidebar-footer-tools {
  align-items: center;
}

/* --- Zone de transition & contenu principal --- */
.page-transition-region {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: clip;
}

/* --- Barre de commande intégrée dans le panneau principal --- */
.app-topbar {
  position: sticky;
  top: max(0px, var(--sat));
  z-index: 40;
  margin: 0;
  background-color: var(--bg-glass);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
  transition: opacity 0.22s var(--ease-out),
              transform 0.22s var(--ease-out),
              box-shadow 0.2s var(--ease-out),
              border-color 0.2s var(--ease-out);
  box-sizing: border-box;
}

.app-topbar:focus-within {
  border-bottom-color: var(--border-highlight);
}

/* Élévation quand la page est défilée */
.app-topbar.is-elevated {
  border-bottom-color: var(--border-highlight);
  box-shadow: var(--shadow-sm);
}

/* Auto-masquage intelligent au défilement (disparaît vers le haut) */
.app-topbar.is-hidden:not(:focus-within) {
  opacity: 0;
  transform: translateY(calc(-100% - 20px));
  pointer-events: none;
}

/* Trois zones : les colonnes latérales sont égales, la recherche garde donc la même place
   sur tous les écrans, quel que soit le contenu de la zone d'actions. */
.topbar-container {
  --topbar-search-width: 34rem;
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, var(--topbar-search-width)) minmax(0, 1fr);
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 1rem;
  min-height: 52px;
  box-sizing: border-box;
}

.topbar-lead {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-width: 0;
}

/* Style des icônes vectorielles Lucide */
.lucide-icon {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

/* Capsule de recherche : saisie, actions de la page, bouton Filtres.
   La feuille est un enfant du champ : elle en sort par le bas, à la même largeur. */
/* Bouton du tiroir de navigation : visible seulement sur écran étroit. */
.topbar-menu-btn {
  display: none;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  cursor: pointer;
}

.sidebar-scrim {
  display: none;
}

.topbar-search {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
  padding: 0 0.5rem 0 0.65rem;
  min-height: 36px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-control);
  border-radius: var(--radius-md);
  color: var(--text-dim);
  box-sizing: border-box;
  transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
}

.topbar-search:focus-within,
body[data-filter-sheet] .topbar-search {
  color: var(--text-main);
  border-color: var(--primary);
  background: var(--bg-card);
}

/* Champs sans bordure propre (recherche, palette, ajout rapide) : l'anneau de focus est porté par
   leur conteneur, pour rester visible au clavier (WCAG 2.4.7). */
.topbar-search:focus-within,
.cmd-palette__header:focus-within,
.flow-quick-add__search:focus-within {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}

.topbar-search .search-icon {
  flex-shrink: 0;
  color: var(--text-muted);
}

.topbar-search-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: var(--font-size-xs);
  font-family: inherit;
  padding: 0.1rem 0;
}

.topbar-search-input::placeholder {
  color: var(--text-muted);
  font-style: italic;
  transition: color 0.15s ease-in-out;
}

.topbar-search-input::-webkit-search-cancel-button,
.topbar-search-input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}

/* Compteur de correspondances réactif (ex: 3 sur 12) */
.search-match-count {
  font-size: var(--font-size-xs);
  font-weight: 600;
  padding: 0.15rem 0.45rem;
  border-radius: 12px;
  background-color: rgba(88, 166, 255, 0.15);
  color: var(--primary);
  white-space: nowrap;
  user-select: none;
}

.search-match-count:empty {
  display: none;
}

.topbar-search-clear {
  background: transparent;
  border: none;
  padding: 0.1rem;
  cursor: pointer;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease-in-out;
}

.topbar-search-clear:hover {
  color: var(--text-main);
}

.filter-sheet {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 30;
  padding: 0.75rem;
  background: var(--bg-card);
  border: 1px solid var(--primary);
  border-top: 0;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.filter-sheet__head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.65rem;
}

.filter-sheet__title {
  font-weight: 700;
  color: var(--text-main);
  margin-right: auto;
}

.filter-sheet__text-btn {
  border: 0;
  background: transparent;
  color: var(--primary);
  font: inherit;
  font-size: var(--font-size-xs);
  font-weight: 700;
  cursor: pointer;
}

.filter-sheet__label {
  margin: 0 0 0.4rem;
  font-size: var(--font-size-xs);
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.filter-sheet .filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

/* Actions et statuts de la TopBar alignés à droite dans le flux flex. */
.topbar-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.4rem;
  min-width: 0;
}

.topbar-actions__sep {
  width: 1px;
  height: 20px;
  margin-inline: 0.15rem;
  background: var(--border-color);
}

/* Titre de l'écran : le `h1` de la page, avec le groupe de la navigation en fil d'Ariane. */
.topbar-heading {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar-crumb {
  min-height: 1.2em;
  font-size: var(--font-size-xs);
  line-height: 1.2;
  color: var(--text-dim);
  white-space: nowrap;
}

.topbar-title {
  margin: 0;
  font-size: var(--font-size-md);
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Filtre de période, dans la capsule de recherche. */
.topbar-search-filter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
}

.topbar-search-filter:hover {
  background: var(--bg-elevated);
  color: var(--text-main);
}

/* Menus du header : icône de taille fixe, panneau ancré à droite. */
.header-menu {
  position: relative;
}

.header-menu__scrim {
  position: fixed;
  inset: 0;
  z-index: 44;
  border: 0;
  padding: 0;
  background: transparent;
}

.header-menu__panel {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 45;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  min-width: 13rem;
  margin-top: 0.35rem;
  padding: 0.35rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
}

.header-menu__scrim[hidden],
.header-menu__panel[hidden] {
  display: none;
}

.header-menu__item {
  display: block;
  padding: 0.5rem 0.65rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-main);
  font: inherit;
  font-size: var(--font-size-sm);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

.header-menu__item:hover {
  background: var(--bg-subtle);
}

.header-menu__note {
  padding: 0.5rem 0.65rem;
  font-size: var(--font-size-sm);
  color: var(--text-dim);
}

.header-icon-btn__dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 2px solid var(--bg-card);
  background: var(--success);
}

.header-icon-btn__dot[data-tone="warning"] {
  background: var(--warning);
}

.header-icon-btn__dot[data-tone="danger"] {
  background: var(--danger);
}

.header-icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  user-select: none;
  touch-action: manipulation;
}

.header-icon-btn:hover {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--border-color);
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.is-spinning svg,
.is-spinning .lucide-icon {
  animation: spin 0.8s linear infinite;
}







.header-status {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Zone de contenu principale */
.main-content {
  /* Conteneur de requête : les grilles du contenu s'adaptent à la place réellement disponible
     (barre latérale ouverte, repliée ou tiroir), pas à la largeur de la fenêtre. */
  container-type: inline-size;
  flex: 1;
  padding: 1.5rem;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}

.application-shell.is-workbench .app-topbar {
  display: none;
}

.main-content.is-workbench {
  padding: 0;
  max-width: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: calc(100dvh - 1rem);
  min-height: 540px;
}

@keyframes pageFadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.tab-panel {
  animation: pageFadeIn 0.22s var(--ease-out);
}

/* --- Bandeau de KPIs (StatStrip) --- */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}

.stat-pill {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 0.35rem;
  padding: 0.7rem 0.95rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  text-align: left;
  font: inherit;
  color: inherit;
  transition: border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
}

.stat-pill.is-interactive {
  cursor: pointer;
  user-select: none;
}

.stat-pill.is-interactive:hover {
  border-color: var(--border-highlight);
  background: color-mix(in srgb, var(--primary) 6%, var(--bg-card));
}

.stat-pill.is-interactive.is-active {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 12%, var(--bg-card));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent), var(--shadow-sm);
}

.stat-pill__top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}

.stat-pill[data-tone="success"] {
  border-color: color-mix(in srgb, var(--success) 40%, var(--border-color));
}

.stat-pill[data-tone="warning"] {
  border-color: color-mix(in srgb, var(--warning) 45%, var(--border-color));
}

.stat-pill[data-tone="danger"] {
  border-color: color-mix(in srgb, var(--danger) 45%, var(--border-color));
}

.stat-pill__label {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-dim);
}

.stat-pill__value {
  font-size: var(--font-size-xl);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  color: var(--text-main);
}

.stat-pill[data-tone="success"] .stat-pill__value {
  color: var(--success);
}

.stat-pill[data-tone="warning"] .stat-pill__value {
  color: var(--warning);
}

.stat-pill[data-tone="danger"] .stat-pill__value {
  color: var(--danger);
}

.stat-pill__detail {
  font-size: var(--font-size-xs);
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}

.kbd-shortcut {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
}

.kbd-shortcut:hover {
  border-color: var(--border-highlight);
  color: var(--text-main);
  background: var(--bg-elevated);
}

/* --- Barre d'état compacte : Vue d'ensemble --- */
.overview-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.overview-toolbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  width: fit-content;
  padding: 0.25rem 0.75rem;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  color: var(--text-dim);
  font-size: var(--font-size-xs);
  font-weight: 600;
  border: 1px solid var(--border-color);
}

.hero-badge[data-tone="success"] {
  background-color: var(--success-bg);
  color: var(--success);
  border-color: color-mix(in srgb, var(--success) 35%, transparent);
}

.hero-badge[data-tone="warning"] {
  background-color: var(--warning-bg);
  color: var(--warning);
  border-color: color-mix(in srgb, var(--warning) 35%, transparent);
}

.hero-badge[data-tone="danger"] {
  background-color: var(--danger-bg);
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 35%, transparent);
}

/* Panneau repliable de la barre d'actions (widgets, filtres) */
.popover {
  position: relative;
}

.popover > summary {
  list-style: none;
  cursor: pointer;
}

.popover__panel {
  position: absolute;
  right: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-1);
  padding: var(--space-3);
  min-width: 200px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
}

/* Grille de métriques et KPIs statistiques */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

/* Grille bi-colonne pour la vue d'ensemble */
.overview-grid-2col {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.overview-grid-2col > .section-panel {
  margin-bottom: 0;
}

@container (max-width: 720px) {
  .overview-grid-2col {
    grid-template-columns: 1fr;
  }
}

/* Distribution des formats de médias & Stockage */
.media-insights-wrapper {
  display: flex;
  flex-direction: column;
}

.insights-section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  margin-bottom: 0.35rem;
}

.insights-total {
  font-weight: 600;
  color: var(--text-main);
}

.segmented-distribution-bar {
  height: 12px;
  border-radius: 6px;
  background-color: var(--bg-subtle);
  display: flex;
  overflow: hidden;
  margin: var(--space-1) 0 var(--space-2) 0;
  border: 1px solid var(--border-color);
}

.segment-fill {
  height: 100%;
  transition: width 0.3s ease;
}

.segment-fill.mkv { background-color: var(--primary); }
.segment-fill.mp4 { background-color: var(--accent); }
.segment-fill.other { background-color: var(--warning); }
.segment-fill.default-segment { background-color: var(--border-color); width: 100%; }

.distribution-legend {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  margin-bottom: var(--space-3);
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.legend-dot.mkv { background-color: var(--primary); }
.legend-dot.mp4 { background-color: var(--accent); }
.legend-dot.other { background-color: var(--warning); }

.storage-breakdown {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--border-color);
}

.storage-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--font-size-xs);
}

.storage-label {
  color: var(--text-dim);
}

.storage-val {
  font-weight: 600;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

/* L'attribut hidden doit masquer l'élément même si un composant fixe display. */
[hidden] {
  display: none !important;
}

/* Pied de page du shell */
.shell-footer {
  margin-top: auto;
  text-align: center;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  border-top: 1px solid var(--border-color);
  padding: 1.25rem 1rem;
  background-color: var(--bg-card);
}

/* --- Adaptations Responsives Mobile (< 768px) --- */
@media (max-width: 768px) {
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
  }

  .application-shell {
    overflow-x: hidden;
    max-width: 100vw;
  }

  .application-navigation-layout {
    overflow-x: hidden;
    max-width: 100vw;
    min-width: 0;
    padding: 0;
    gap: 0;
  }

  /* Étroit : la barre latérale devient un tiroir, ouvert par le bouton de la barre du haut. */
  .application-sidebar,
  .application-sidebar.is-collapsed {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    height: 100dvh;
    width: min(18rem, 85vw);
    max-width: 85vw;
    border-radius: 0;
    border: 0;
    border-right: 1px solid var(--border-color);
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.2s ease-in-out, visibility 0.2s;
    z-index: 80;
    box-shadow: var(--shadow-md);
  }

  .application-sidebar.is-open {
    transform: translateX(0);
    visibility: visible;
  }

  .application-sidebar.is-collapsed .brand-info,
  .application-sidebar.is-collapsed .tab-btn-label,
  .application-sidebar.is-collapsed .tab-btn-badge,
  .application-sidebar.is-collapsed .nav-group-label,
      .application-sidebar.is-collapsed .sidebar-user-meta {
    display: revert;
  }

  .application-sidebar.is-collapsed .sidebar-user-card {
    flex-direction: row;
    padding: 0.45rem 0.55rem;
  }


  .sidebar-scrim {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 70;
    border: 0;
    padding: 0;
    background: rgba(0, 0, 0, 0.45);
  }

  .sidebar-scrim[hidden] {
    display: none;
  }

  .topbar-menu-btn {
    display: inline-flex;
  }

  .sidebar-header {
    padding: 0.75rem 1rem;
    box-sizing: border-box;
  }

  .tab-navigation {
    padding: 0.5rem;
    min-width: 0;
    overflow-y: auto;
    box-sizing: border-box;
  }

  .tab-btn {
    width: 100%;
    min-height: 44px;
    white-space: nowrap;
  }

  .sidebar-collapse-btn {
    display: none;
  }

  .page-transition-region {
    max-width: 100vw;
    min-width: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .app-topbar {
    margin: 0;
  }

  .topbar-container {
    padding: 0.35rem 0.5rem;
  }

  .main-content {
    padding: 1rem;
    max-width: 100vw;
    box-sizing: border-box;
  }

  .main-content.is-workbench {
    padding: 0;
    height: 100dvh;
  }
}

/* --- Header compact (< 640px) : la recherche passe sur sa propre ligne, pleine largeur. --- */
@media (max-width: 640px) {
  .topbar-container {
    grid-template-columns: minmax(0, 1fr) auto;
    row-gap: 0.35rem;
  }

  .topbar-search {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .topbar-crumb {
    display: none;
  }
}


/* --- Boutons d'action --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: var(--touch-target-compact);
  padding: 0.5rem 1rem;
  font-size: var(--font-size-sm);
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  text-decoration: none;
  line-height: 1.25;
  white-space: nowrap;
  user-select: none;
  touch-action: manipulation;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background-color: var(--primary-fill);
  color: var(--primary-contrast);
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover:not(:disabled) {
  opacity: 0.9;
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--border-color);
}

.btn-secondary:hover:not(:disabled) {
  background-color: var(--bg-card);
  border-color: var(--primary);
}

/* Paramètres : lignes « à surveiller » et visibilité conditionnelle par recherche. */
.settings-section[hidden] {
  display: none;
}

.settings-alert {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-top: 1px solid var(--border-color);
  font-size: var(--font-size-sm);
}

.settings-alert:first-child {
  border-top: 0;
}

.settings-alert__dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--success);
}

.settings-alert__icon {
  flex: none;
  display: inline-flex;
  align-items: center;
  color: var(--warning);
}

.settings-alert[data-tone="warning"] .settings-alert__dot {
  background-color: var(--warning);
}

.settings-alert__text {
  flex: 1;
  min-width: 0;
}

/* Retour visuel d'une copie réussie : le bouton reste en « Copié ✓ » un instant. */
.btn[data-copied="true"] {
  background-color: var(--success-bg);
  color: var(--success);
  border-color: var(--success);
}

/* Zone de texte hors champ utilisée pour copier en HTTP simple (jamais visible). */
.clipboard-proxy {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.btn-danger {
  background-color: var(--danger-bg);
  color: var(--danger);
  border-color: var(--danger);
}

.btn-danger:hover:not(:disabled) {
  background-color: var(--danger-fill);
  color: var(--primary-contrast);
}

.btn-sm {
  padding: 0.3rem 0.65rem;
  font-size: var(--font-size-xs);
}

/* --- Badges et Pilules d'état (Status Pills) --- */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-pill);
  font-size: var(--font-size-xs);
  font-weight: 600;
  line-height: 1;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: currentColor;
}

@keyframes statusPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(1.25); }
}

.status-dot.pulse,
.status-dot--pulse {
  animation: statusPulse 1.8s ease-in-out infinite;
}

.status-pill.online,
.status-pill.success {
  background-color: var(--success-bg);
  color: var(--success);
}

.status-pill.warning {
  background-color: var(--warning-bg);
  color: var(--warning);
}

.status-pill.offline,
.status-pill.error,
.status-pill.danger {
  background-color: var(--danger-bg);
  color: var(--danger);
}

.status-pill.info {
  background-color: var(--info-bg);
  color: var(--info);
}

/* --- Tableaux de données accessibles --- */
.table-wrapper {
  overflow-x: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background-color: var(--bg-card);
  margin-top: 1rem;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: var(--font-size-sm);
}

.data-table th,
.data-table td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border-color);
  transition: background-color 0.14s ease;
}

.data-table th {
  background-color: var(--bg-subtle);
  font-weight: 600;
  color: var(--text-dim);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td,
.data-table tr.is-open td {
  background-color: var(--bg-subtle);
}

.registre {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.registre > .table-wrapper {
  margin-top: 0;
}

.inspection-drawer__actions {
  position: sticky;
  bottom: -1.35rem;
  z-index: 5;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.6rem;
  flex: none;
  margin: 0.5rem -1.35rem -1.35rem;
  padding: 0.95rem 1.35rem;
  background: var(--bg-card);
  border-top: 1px solid var(--border-color);
}

.inspection-drawer__actions .btn-danger-quiet,
.inspection-drawer__actions .btn-danger {
  margin-left: auto;
}

.library-worker-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.library-worker-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 0.6rem 0.75rem;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
}

.library-worker-path {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--text-dim);
}

.form-input--key {
  flex: 1;
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
}

.inspection-drawer {
  position: fixed;
  inset: 0;
  z-index: 60;
  visibility: hidden;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.22s ease, visibility 0s linear 0.22s;
}

.inspection-drawer.is-open {
  visibility: visible;
  pointer-events: auto;
  opacity: 1;
  transition: opacity 0.22s ease, visibility 0s;
}

.inspection-drawer__scrim {
  position: absolute;
  inset: 0;
  border: 0;
  padding: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  cursor: pointer;
}

.inspection-drawer__panel {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  bottom: 0.5rem;
  display: flex;
  flex-direction: column;
  width: min(calc(100vw - 1rem), 60rem);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateX(calc(100% + 1rem));
  transition: transform 0.25s var(--ease-out);
  outline: none;
}

.inspection-drawer.is-open .inspection-drawer__panel {
  transform: none;
}

@media (max-width: 640px) {
  .inspection-drawer__panel {
    top: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    border: 0;
    border-radius: 0;
    transform: translateX(100%);
  }
}

.inspection-drawer__header {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.35rem;
  background: linear-gradient(180deg, var(--bg-subtle) 0%, var(--bg-card) 100%);
  border-bottom: 1px solid var(--border-color);
}

.inspection-drawer__identity {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex: 1;
  min-width: 0;
}

.inspection-drawer__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  flex: none;
}

.inspection-drawer__title-group {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  flex-wrap: wrap;
}

.inspection-drawer__eyebrow {
  display: inline-flex;
  align-items: center;
  margin: 0;
  padding: 0.15rem 0.55rem;
  border-radius: var(--radius-pill);
  background: var(--primary-bg);
  font-size: var(--font-size-xs);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--primary);
}

.inspection-drawer__header .inspection-panel__title {
  overflow-wrap: anywhere;
}

.inspection-drawer__header-actions {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  flex: none;
}

.inspection-drawer__close {
  flex: none;
}

.inspection-drawer__subnav {
  display: flex;
  justify-content: flex-start;
  gap: 0.25rem;
  padding: 0 1.35rem;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-subtle);
  overflow-x: auto;
}

.page-subnav {
  display: flex;
  margin-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-color);
}

.inspection-drawer__tab {
  flex: none;
  appearance: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0.75rem 1rem;
  text-align: center;
  white-space: nowrap;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: var(--font-size-xs);
  font-weight: 700;
  cursor: pointer;
}

.page-subnav__tab {
  flex: 1;
  appearance: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0.8rem 0.7rem;
  text-align: center;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: var(--font-size-xs);
  font-weight: 700;
  cursor: pointer;
}

.inspection-drawer__tab:hover,
.page-subnav__tab:hover {
  color: var(--text-main);
}

.inspection-drawer__tab.is-active,
.page-subnav__tab.is-active {
  color: var(--text-main);
  border-bottom-color: var(--primary);
}

.inspection-drawer__tab:focus-visible,
.page-subnav__tab:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}

.inspection-drawer__body {
  /* Conteneur de requête : fiches et grilles se replient selon la largeur du tiroir. */
  container-type: inline-size;
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 1.35rem;
}

.inspection-drawer__pane {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.inspection-panel {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
}

.inspection-panel__section {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.inspection-panel .form-group {
  margin-bottom: 0.85rem;
}

.inspection-panel .form-group:last-child {
  margin-bottom: 0;
}

.inspection-panel__title {
  margin: 0;
  font-size: var(--font-size-lg);
  line-height: 1.3;
  font-weight: 700;
  color: var(--text-main);
}

.inspection-panel .inspection-panel__title {
  font-size: var(--font-size-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border-subtle);
}

.inspection-panel__facts {
  margin: 0;
  font-size: var(--font-size-sm);
  line-height: 1.5;
  color: var(--text-dim);
}

.inspection-panel__action {
  align-self: stretch;
}

.empty-state-text {
  text-align: center;
  padding: 2rem 1rem !important;
  color: var(--text-dim);
}

/* --- Cartes de métriques et panneaux d'information --- */
.metric-card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background: radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--tone, var(--primary)) 8%, transparent) 0%, transparent 60%), var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
}

.metric-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-highlight);
}

.metric-card[data-tone="success"] { --tone: var(--success); --tone-bg: var(--success-bg); }
.metric-card[data-tone="warning"] { --tone: var(--warning); --tone-bg: var(--warning-bg); }
.metric-card[data-tone="danger"] { --tone: var(--danger); --tone-bg: var(--danger-bg); }

.metric-head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.metric-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: var(--radius-sm);
  background-color: var(--tone-bg, var(--primary-bg));
  color: var(--tone, var(--primary));
}

.metric-label {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-dim);
}

.metric-value {
  font-size: var(--font-size-display);
  font-weight: 700;
  line-height: 1.1;
  color: var(--text-main);
  font-family: var(--font-mono);
}

.metric-card[data-tone="success"] .metric-value,
.metric-card[data-tone="warning"] .metric-value,
.metric-card[data-tone="danger"] .metric-value {
  color: var(--tone);
}

.metric-meter {
  width: 100%;
  height: 5px;
  margin-top: 0.25rem;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}

.metric-meter__fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background-color: var(--tone, var(--primary));
  transition: width 0.35s var(--ease-out);
}

.metric-subtitle {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

.card-caption {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  margin-top: 0.5rem;
  line-height: 1.45;
}

.workers-info-grid,
.metrics-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
  margin-top: 1.25rem;
}

/* --- Panneaux de section (Sections structurées) --- */
.section-panel {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  margin-bottom: 1.5rem;
}

.section-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.25rem;
  gap: 1rem;
}

.section-panel-header__actions {
  flex: none;
}

.section-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--text-main);
}

.section-subtitle {
  font-size: var(--font-size-sm);
  color: var(--text-dim);
  margin-top: 0.25rem;
  line-height: 1.45;
}

/* --- Formulaires et Champs de saisie --- */
.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 0.35rem;
}

.form-help {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  margin-top: 0.35rem;
}

.form-input,
.form-select {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-control);
  background-color: var(--bg-subtle);
  color: var(--text-main);
  font-size: var(--font-size-sm);
  transition: border-color 0.15s ease-in-out;
  box-sizing: border-box;
}

/* Anneau de focus complet (WCAG 2.4.7 / 1.4.11) : la seule couleur de bordure ne suffit pas. */
.form-input:focus-visible,
.form-select:focus-visible,
.form-input:focus,
.form-select:focus {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
  border-color: var(--primary);
  background-color: var(--bg-card);
}

.copy-input-row {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

/* --- Blocs de code & Détails techniques --- */
.code-block-wrapper {
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 0.875rem;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.code-snippet {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  padding: 0.2rem 0.4rem;
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
}

.detail-grid {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0.75rem 1.5rem;
  font-size: var(--font-size-sm);
}

.detail-grid:has(> .detail-row) {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.detail-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--border-subtle);
}

.detail-row:last-child {
  border-bottom: none;
}

@container (max-width: 560px) {
  .detail-grid {
    grid-template-columns: 1fr;
    gap: 0.25rem;
  }

  .detail-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.15rem;
  }
}

.detail-term {
  color: var(--text-dim);
  font-weight: 500;
}

.detail-val {
  color: var(--text-main);
  font-weight: 600;
}

.detail-row .detail-val {
  text-align: right;
  word-break: break-word;
}

@container (max-width: 560px) {
  .detail-row .detail-val {
    text-align: left;
  }
}

.inspection-drawer .detail-grid {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  overflow: hidden;
  gap: 0;
  grid-template-columns: minmax(140px, 210px) 1fr;
}

.inspection-drawer .detail-grid > .detail-term,
.inspection-drawer .detail-grid > .detail-val {
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
}

.inspection-drawer .detail-grid > .detail-val {
  justify-content: flex-end;
  text-align: right;
  word-break: break-word;
}

.inspection-drawer .detail-grid > .detail-term:nth-last-child(2),
.inspection-drawer .detail-grid > .detail-val:last-child {
  border-bottom: none;
}

.inspection-drawer .detail-grid > .detail-row {
  padding: 0.7rem 1rem;
}

@container (max-width: 560px) {
  .inspection-drawer .detail-grid {
    grid-template-columns: 1fr;
  }

  .inspection-drawer .detail-grid > .detail-term {
    padding-bottom: 0.15rem;
    border-bottom: none;
  }

  .inspection-drawer .detail-grid > .detail-val {
    justify-content: flex-start;
    text-align: left;
    padding-top: 0;
  }
}

.stack-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* --- Modales natives (<dialog>) --- */
dialog.app-dialog {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background-color: var(--bg-card);
  color: var(--text-main);
  padding: 1.5rem;
  max-width: 600px;
  width: 90%;
  margin: auto;
  box-shadow: var(--shadow-md);
}

dialog.app-dialog::backdrop {
  background-color: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(3px);
}

.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
}

.dialog-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
}

.dialog-body {
  margin-bottom: 1.5rem;
}

.dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
}

.dialog-footer-ruled {
  padding-top: 1rem;
  border-top: 1px solid var(--border-color);
  margin-top: 1rem;
}

.text-danger { color: var(--danger-text); }
.text-strong { font-weight: 600; color: var(--text-main); }
.text-dim { color: var(--text-dim); }
.text-primary { color: var(--primary); }
.text-mono { font-family: var(--font-mono); }
.text-mono-strong { font-family: var(--font-mono); font-weight: 600; }
.text-sm { font-size: var(--font-size-xs); }
.text-xs { font-size: var(--font-size-xs); color: var(--text-dim); }
.cell-end { text-align: right; }
.inline-actions { display: inline-flex; gap: 0.4rem; }
.cluster { display: flex; align-items: center; gap: 0.5rem; }
.cluster-wrap { flex-wrap: wrap; }
.cluster-end { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem; }
.cluster-spread { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.cluster-center { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
.truncate {
  font-size: var(--font-size-xs);
  font-family: var(--font-mono);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.empty-state-panel {
  grid-column: 1 / -1;
  text-align: center;
  padding: 2.5rem 1rem;
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-card);
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.empty-state-icon {
  width: 48px;
  height: 48px;
  margin-bottom: 0.75rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.empty-state-title { margin: 0 0 0.5rem 0; font-size: var(--font-size-lg); font-weight: 600; color: var(--text-main); }
.empty-state-message { margin: 0 auto 1.25rem auto; max-width: 500px; font-size: var(--font-size-sm); color: var(--text-muted); }
.empty-state__action { display: flex; justify-content: center; gap: 0.5rem; }
dialog.app-dialog.dialog-narrow { max-width: 540px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.btn-danger-quiet { background: transparent; color: var(--danger-text); padding: 0.4rem 0.65rem; font-size: var(--font-size-xs); margin-left: 0.5rem; }
.btn-danger-quiet:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger); }
.is-filtered-out { display: none !important; }
.no-margin-top { margin-top: 0; }

/* --- Toasts & Notifications flottantes --- */
.toast-notice {
  padding: 0.75rem 1rem;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-sm);
  margin: 1rem 1.5rem 0 1.5rem;
  display: none;
}

.toast-notice.info {
  background-color: var(--info-bg);
  border: 1px solid var(--info);
  color: var(--info);
}

.toast-notice.success {
  background-color: var(--success-bg);
  border: 1px solid var(--success);
  color: var(--success);
}

.toast-notice.error {
  background-color: var(--danger-bg);
  border: 1px solid var(--danger);
  color: var(--danger);
}

/* --- Barre de progression temps réel (tableaux et fiches) --- */
.live-progress {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 112px;
}

.live-progress__track {
  flex: 1;
  min-width: 64px;
  height: 6px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}

.live-progress__bar {
  height: 100%;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.28s var(--ease-out);
}

.live-progress__bar.is-indeterminate {
  width: 40%;
  animation: liveProgressSlide 1.4s ease-in-out infinite;
}

.live-progress[data-tone="success"] .live-progress__bar { background: var(--success); }
.live-progress[data-tone="warning"] .live-progress__bar { background: var(--warning); }
.live-progress[data-tone="danger"] .live-progress__bar { background: var(--danger); }

.live-progress__label {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-dim);
  min-width: 2.5rem;
  text-align: right;
}

@keyframes liveProgressSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(260%); }
}

/* --- Pile de notifications Toast flottantes --- */
.toast-stack {
  position: fixed;
  right: max(1.25rem, var(--sar));
  bottom: max(1.25rem, var(--sab));
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-width: min(92vw, 380px);
  pointer-events: none;
}

.toast-item {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.75rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
  color: var(--text-main);
  font-size: var(--font-size-xs);
  line-height: 1.4;
  animation: toastSlideIn 0.22s var(--ease-out);
}

.toast-item--info { border-left: 3px solid var(--info); }
.toast-item--success { border-left: 3px solid var(--success); }
.toast-item--danger { border-left: 3px solid var(--danger); }

.toast-item__icon {
  flex: none;
  display: inline-flex;
  color: var(--info);
}

.toast-item--success .toast-item__icon { color: var(--success); }
.toast-item--danger .toast-item__icon { color: var(--danger); }

.toast-item__message {
  flex: 1;
  min-width: 0;
}

.toast-item__close {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.toast-item__close:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}

@keyframes toastSlideIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* --- Palette de commandes clavier (Ctrl+K) --- */
.cmd-palette {
  position: fixed;
  inset: 0;
  z-index: 95;
  display: grid;
  place-items: start center;
  padding: 12vh 1rem 1rem;
}

.cmd-palette[hidden] {
  display: none;
}

.cmd-palette__scrim {
  position: fixed;
  inset: 0;
  border: 0;
  padding: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.cmd-palette__dialog {
  position: relative;
  z-index: 1;
  width: min(92vw, 560px);
  background: var(--bg-card);
  border: 1px solid var(--border-highlight);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: cmdPaletteIn 0.16s var(--ease-out);
}

@keyframes cmdPaletteIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.cmd-palette__header {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-dim);
}

.cmd-palette__input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text-main);
  font: inherit;
  font-size: var(--font-size-sm);
}

.cmd-palette__input::placeholder {
  color: var(--text-muted);
}

.cmd-palette__list {
  max-height: 52vh;
  overflow-y: auto;
  padding: 0.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.cmd-palette__empty {
  padding: 1.5rem 1rem;
  text-align: center;
  color: var(--text-muted);
  font-size: var(--font-size-xs);
}

.cmd-palette__item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  width: 100%;
  padding: 0.55rem 0.75rem;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-main);
  font: inherit;
  font-size: var(--font-size-xs);
  text-align: left;
  cursor: pointer;
  transition: background-color 0.12s ease, border-color 0.12s ease;
}

.cmd-palette__item:hover,
.cmd-palette__item.is-active {
  background: var(--primary-bg);
  border-color: var(--border-highlight);
}

.cmd-palette__item-main {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
}

.cmd-palette__label {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cmd-palette__hint {
  color: var(--text-dim);
  font-size: var(--font-size-xs);
  white-space: nowrap;
}

.cmd-palette__badge {
  flex: none;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  color: var(--text-dim);
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.cmd-palette__footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 1rem;
  border-top: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-muted);
  font-size: var(--font-size-xs);
}

/* --- Sections ouvertes et tuiles de ressources unifiées --- */
.page-section {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-bottom: 1.75rem;
}

.resource-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr));
  gap: 1rem;
  margin-top: 0.25rem;
}

.resource-grid--list {
  grid-template-columns: 1fr;
}

.resource-card {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  padding: 1.05rem 1.15rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--border-highlight);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}

.resource-card[data-tone="success"] {
  border-left-color: var(--success);
}

.resource-card[data-tone="warning"] {
  border-left-color: var(--warning);
}

.resource-card[data-tone="danger"] {
  border-left-color: var(--danger);
}

.resource-card.is-clickable {
  cursor: pointer;
}

.resource-card:hover,
.resource-card.is-open {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

.resource-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
}

.resource-card__icon {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.resource-card__titles {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  min-width: 0;
  flex: 1;
}

.resource-card__title {
  margin: 0;
  font-size: var(--font-size-md);
  font-weight: 700;
  color: var(--text-main);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.resource-card__subtitle {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  line-height: 1.35;
}

.resource-card__badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex-shrink: 0;
}

.resource-card__body {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  flex: 1;
}

.resource-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding-top: 0.75rem;
  margin-top: auto;
  border-top: 1px solid var(--border-subtle);
}

.resource-card__meta {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.resource-card__actions {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}

/* --- Étiquette unifiée (`Tag`) --- */
.ui-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  max-width: 100%;
  padding: 0.2rem 0.5rem;
  border-radius: var(--radius-sm);
  font-size: var(--font-size-xs);
  font-weight: 600;
  line-height: 1.25;
  border: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  color: var(--text-dim);
}

.ui-tag[data-tone="primary"] {
  background: var(--primary-bg);
  border-color: color-mix(in srgb, var(--primary) 35%, transparent);
  color: var(--primary);
}

.ui-tag[data-tone="success"] {
  background: var(--success-bg);
  border-color: color-mix(in srgb, var(--success) 35%, transparent);
  color: var(--success);
}

.ui-tag[data-tone="warning"] {
  background: var(--warning-bg);
  border-color: color-mix(in srgb, var(--warning) 35%, transparent);
  color: var(--warning);
}

.ui-tag[data-tone="danger"] {
  background: var(--danger-bg);
  border-color: color-mix(in srgb, var(--danger) 35%, transparent);
  color: var(--danger);
}

.ui-tag[data-tone="mono"] {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--text-main);
}

.code-badge {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  max-width: 100%;
}

/* --- Inspection & Diagnostic --- */
.inspection-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.65rem 0.85rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  margin-bottom: 1rem;
}

.diagnostic-box {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.75rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--danger-bg);
  border: 1px solid var(--danger);
  color: var(--danger-text);
  margin-bottom: 1rem;
}

.diagnostic-box__title {
  font-size: var(--font-size-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.diagnostic-box__message {
  font-size: var(--font-size-xs);
  margin-top: 0.15rem;
}

.registre-row.is-clickable {
  cursor: pointer;
  transition: background-color 0.14s ease;
}

/* Lignes et cartes cliquables atteintes au clavier (tabindex="0") : anneau intérieur, pour ne pas
   être rogné par le débordement du tableau ou de la grille. */
.registre-row.is-clickable:focus-visible,
.resource-card.is-clickable:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}

.registre-row.is-clickable:hover {
  background: var(--bg-subtle);
}

.system-volume-meter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1rem;
  padding-top: 0.85rem;
  border-top: 1px solid var(--border-color);
}

/* --- Grille Bento des Paramètres --- */
.settings-bento-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

.settings-bento-grid > .section-panel {
  margin-bottom: 0;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

@container (max-width: 720px) {
  .settings-bento-grid {
    grid-template-columns: 1fr;
  }
}

.settings-help-details {
  margin-top: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  overflow: hidden;
}

.settings-help-details__summary {
  padding: 0.6rem 0.85rem;
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  user-select: none;
}

.settings-help-details__summary:hover {
  color: var(--primary);
}

.settings-help-details__body {
  padding: 0.25rem 0.85rem 0.75rem;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

/* --- Packs déclaratifs & étapes d'exécution --- */
.pack-components {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-top: 0.5rem;
}

.step-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.step-item {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  padding: 0.65rem 0.8rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.step-item__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
}

.step-item__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.step-item__msg {
  margin: 0;
  color: var(--text-main);
}

.step-excerpt {
  margin: 0.25rem 0 0;
  padding: 0.5rem 0.65rem;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-dim);
  font-size: var(--font-size-xs);
  overflow-x: auto;
  max-height: 10rem;
  white-space: pre-wrap;
  word-break: break-word;
}

.jobs-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}

.jobs-toolbar .form-label {
  margin-bottom: 0;
}

.jobs-library-select {
  width: auto;
  min-width: 14rem;
}

.settings-form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: 0.75rem;
}

.settings-fieldset {
  margin: 0;
  padding: 0.85rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.settings-fieldset__legend {
  padding: 0 0.35rem;
  font-size: var(--font-size-xs);
  font-weight: 700;
  color: var(--text-main);
}

.worker-card-telemetry {
  margin-top: 0.35rem;
}

.worker-telemetry-card {
  padding-top: 0.35rem;
  border-top: 1px solid var(--border-subtle);
}

.worker-telemetry-bars {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.worker-telemetry-metric {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.worker-telemetry-metric__head {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: var(--font-size-xs);
}

.inspection-drawer__panel:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}

/* --- Sélecteur d'arborescence de bibliothèques --- */
.library-worker-row__controls {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.library-worker-access-select {
  width: auto;
  min-width: 10rem;
  padding: 0.3rem 0.55rem;
  font-size: var(--font-size-xs);
}

.library-worker-editor {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 0.95rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
}

.library-access-warning {
  color: var(--warning);
}

.folder-picker {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  padding: 0.75rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
}

.folder-picker__roots {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.folder-picker__root-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.65rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-main);
  font-size: var(--font-size-xs);
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.14s ease, background-color 0.14s ease;
}

.folder-picker__root-btn:hover {
  border-color: var(--primary);
}

.folder-picker__root-btn.is-active {
  background: var(--primary-bg);
  border-color: var(--primary);
  color: var(--primary);
}

.folder-picker__ro-pill {
  font-size: var(--font-size-xs);
  font-weight: 700;
  padding: 0.05rem 0.3rem;
  border-radius: var(--radius-sm);
  background: var(--warning-bg);
  color: var(--warning);
}

.folder-picker__toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 0.35rem 0.5rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
}

.folder-picker__breadcrumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.2rem;
  min-width: 0;
  flex: 1;
}

.folder-picker__crumb-sep {
  color: var(--text-muted);
  font-size: var(--font-size-xs);
}

.folder-picker__crumb {
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  padding: 0.15rem 0.35rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.folder-picker__crumb:hover {
  background: var(--bg-card);
  color: var(--text-main);
}

.folder-picker__crumb.is-current {
  color: var(--text-main);
  font-weight: 700;
}

.folder-picker__toolbar-actions {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.folder-picker__error {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.65rem;
  border-radius: var(--radius-sm);
  background: var(--warning-bg);
  border: 1px solid var(--warning);
  color: var(--warning);
  font-size: var(--font-size-xs);
}

.folder-picker__error-text {
  flex: 1;
  min-width: 0;
}

.folder-picker__tree {
  display: flex;
  flex-direction: column;
  max-height: 18rem;
  overflow-y: auto;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}

.folder-picker__empty {
  padding: 0.9rem;
  text-align: center;
  color: var(--text-dim);
  font-size: var(--font-size-xs);
}

.folder-picker__row {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.5rem;
  padding-left: calc(0.45rem + var(--tree-depth, 0) * 1.1rem);
  border-bottom: 1px solid var(--border-subtle);
  transition: background-color 0.12s ease;
}

.folder-picker__row:last-child {
  border-bottom: none;
}

.folder-picker__row:hover {
  background: var(--bg-subtle);
}

.folder-picker__row.is-selected {
  background: var(--primary-bg);
}

.folder-picker__chevron {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.4rem;
  height: 1.4rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: transform 0.15s var(--ease-out), color 0.12s ease;
}

.folder-picker__chevron:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}

.folder-picker__row.is-expanded .folder-picker__chevron svg {
  transform: rotate(90deg);
}

.folder-picker__chevron.is-hidden {
  visibility: hidden;
  pointer-events: none;
}

.folder-picker__item-btn {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  border: 0;
  background: transparent;
  color: var(--text-main);
  text-align: left;
  padding: 0.25rem 0.2rem;
  cursor: pointer;
  font-size: var(--font-size-xs);
}

.folder-picker__icon {
  flex: none;
  display: inline-flex;
  align-items: center;
  color: var(--primary);
}

.folder-picker__icon--file {
  color: var(--text-dim);
}

.folder-picker__name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}

.folder-picker__file {
  padding-top: 0.35rem;
  padding-bottom: 0.35rem;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
}

.folder-picker__meta {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex: none;
}

.folder-picker__badge {
  font-size: var(--font-size-xs);
  font-weight: 600;
  padding: 0.1rem 0.4rem;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  color: var(--text-dim);
  border: 1px solid var(--border-subtle);
}

.folder-picker__badge--media {
  background: var(--info-bg);
  color: var(--info);
  border-color: transparent;
}

.folder-picker__badge--ro {
  background: var(--warning-bg);
  color: var(--warning);
  border-color: transparent;
}

.folder-picker__ext {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  padding: 0.08rem 0.35rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
}

.folder-picker__size {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

/* Assistant IA intégré : tiroir conversationnel */
.ai-chat {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  min-height: 100%;
}

.ai-chat__status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.65rem 0.8rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
}

.ai-chat__status-info {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
}

.ai-chat__prompts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.ai-chat__chip {
  appearance: none;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  color: var(--text-main);
  border-radius: var(--radius-pill);
  padding: 0.35rem 0.7rem;
  font-size: var(--font-size-xs);
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.ai-chat__chip:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--primary);
}

.ai-chat__chip:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.ai-chat__messages {
  flex: 1;
  min-height: 14rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
