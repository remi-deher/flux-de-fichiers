# Branche test : seules les PR depuis dev sont acceptées.
# Vérifications → image poussée sous pr-<sha> → fusion automatique → l'image
# validée est renommée :test et :test-<sha du merge>, sans recompiler.
# La fusion et la publication se font dans ce même workflow : un push effectué
# avec GITHUB_TOKEN ne déclenche aucun autre workflow.
# Les vérifications requises par la protection de branche s'exécutent toujours ;
# quand la PR ne touche pas au code, leurs étapes lourdes sont simplement sautées.
name: test

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: flux-de-fichiers
  CARGO_JOBS: 4

jobs:
  guard:
    name: source-is-dev
    runs-on: ubuntu-latest
    steps:
      - name: Refuser toute PR qui ne vient pas de dev
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::La branche test n'accepte que les PR depuis dev (reçu : $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi

  changes:
    name: detect-code-changes
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Le code ou le build ont-ils changé ?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Chemins qui influencent le binaire, l'image ou les scénarios Docker.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -qE '^(src/|migrations/|tests/|scripts/|deploy/|Cargo\.toml$|Cargo\.lock$|Dockerfile$|\.dockerignore$|compose\.yaml$|package\.json$|rust-toolchain\.toml$|\.github/workflows/test\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement de code : vérifications lourdes sautées."
          fi

  checks:
    name: fmt-clippy-tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        name: Installer la toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.code == 'true'
        run: cargo fmt --check
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --locked

  image-build:
    name: docker-build
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Calculer le tag et la version
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "tag=pr-${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [ -f Cargo.toml ]; then
            echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
          fi
      - if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: needs.changes.outputs.code == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: needs.changes.outputs.code == 'true'
        name: Construire et pousser l'image de la PR (pr-<sha>)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.event.pull_request.head.sha }}
            CARGO_JOBS=${{ env.CARGO_JOBS }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  scenarios:
    # Nom stable : destiné aux checks requis du ruleset de test.
    # ubuntu-24.04 : Playwright (chromium) ne prend pas encore en charge ubuntu-26.04.
    name: docker-scenarios
    needs: [changes, image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: flux-ci
      IMAGE_TAG: ${{ needs.image-build.outputs.tag }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - if: needs.changes.outputs.code == 'true'
        name: Vérifier le rapport de succès et d'échec
        run: python3 -m unittest discover -s scripts/tests -v
      - if: needs.changes.outputs.code == 'true'
        name: Préparer les secrets et démarrer l'image de la PR sans reconstruction
        env:
          PR_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.image-build.outputs.tag }}
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from dev import prepare; prepare()'
          docker pull "$PR_IMAGE"
          docker tag "$PR_IMAGE" "flux-de-fichiers:$IMAGE_TAG"
          docker compose up --detach --no-build --wait --wait-timeout 120 --scale worker=3 coordinator worker
      - if: needs.changes.outputs.code == 'true'
        name: Exécuter les scénarios et mesurer leur durée
        run: |
          started=$SECONDS
          set +e
          npm run scenarios
          result=$?
          set -e
          echo "Scénarios Docker : $((SECONDS - started)) s (code de sortie : $result)." >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - if: needs.changes.outputs.code == 'true'
        name: Exécuter les tests navigateur Playwright
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          pip install 'playwright==1.55.0'
          playwright install --with-deps chromium
          npm run test:browser
      - if: always() && needs.changes.outputs.code == 'true'
        name: Publier le rapport des scénarios, y compris en cas d'échec
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-report
          path: var/scenario-report.json
          if-no-files-found: error
          retention-days: 14
      - if: always() && needs.changes.outputs.code == 'true'
        name: Arrêter le laboratoire éphémère
        run: docker compose down --volumes --remove-orphans

  merge:
    name: auto-merge
    needs: [guard, checks, image-build, scenarios]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Fusionner la PR (merge commit)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    name: docker-publish
    needs: [changes, image-build, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Renommer l'image validée en :test et :test-<sha du merge>
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/flux-de-fichiers
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          PR_TAG: ${{ needs.image-build.outputs.tag }}
          MERGE_SHA: ${{ needs.merge.outputs.sha }}
        run: |
          # Sans changement de code, l'image est celle déjà publiée sous :test.
          if [ "$CODE_CHANGED" = "true" ]; then source="$PR_TAG"; else source="test"; fi
          docker buildx imagetools inspect "$REPO:$source" > /dev/null \
            || { echo "::error::Image $REPO:$source introuvable."; exit 1; }
          docker buildx imagetools create \
            --tag "$REPO:test" --tag "$REPO:test-${MERGE_SHA:0:12}" \
            "$REPO:$source"
