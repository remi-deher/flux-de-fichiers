events {}
http {
  # HTTP is published on host loopback only; proxy-to-coordinator traffic uses TLS.
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 8080;
    client_max_body_size 512m;
    location / {
      proxy_pass https://coordinator:3443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /run/secrets/ca_cert;
      proxy_ssl_server_name on;
      proxy_ssl_name coordinator;
      proxy_read_timeout 3600s;
      proxy_request_buffering off;
      proxy_buffering off;
    }
  }
}
