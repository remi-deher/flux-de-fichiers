# Construit l'image Forgearr (une seule définition des arguments de build).
# L'appelant a déjà récupéré le dépôt au commit à construire (`actions/checkout`).
name: Construire l'image
description: Construit l'image, la charge localement ou la pousse sur Docker Hub.

inputs:
  sha:
    description: Commit construit (révision de l'image).
    required: true
  tags:
    description: Étiquettes de l'image, séparées par des retours à la ligne ; vide pour ne pas étiqueter.
    default: ""
  push:
    description: Pousser l'image sur Docker Hub.
    default: "false"
  load:
    description: Charger l'image dans le démon Docker local.
    default: "false"
  cargo-jobs:
    description: Parallélisme de compilation dans le Dockerfile.
    default: "4"

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        build-args: |
          APP_VERSION=${{ steps.version.outputs.value }}
          VCS_REF=${{ inputs.sha }}
          CARGO_JOBS=${{ inputs.cargo-jobs }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha,scope=image
        cache-to: type=gha,scope=image,mode=max
