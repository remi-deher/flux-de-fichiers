# Worker-only deployment on an additional Docker host.
services:
  worker:
    image: ${FLUX_IMAGE:?Provide an immutable Flux image tag or digest}
    command: [worker]
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    environment:
      COORDINATOR_URL: ${COORDINATOR_URL:?Provide the HTTP or HTTPS coordinator origin}
      WORKER_NAME: ${WORKER_NAME:?Provide a unique worker name}
      WORKER_KEY: ${WORKER_KEY:-}
      WORKER_KEY_FILE: ${WORKER_KEY_FILE:-/run/secrets/worker_key}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-536870912}
    volumes: [work:/work, logs:/logs]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
volumes:
  work:
  logs:
