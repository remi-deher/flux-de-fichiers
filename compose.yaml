x-app: &app
  image: forgearr:${IMAGE_TAG:-local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128

services:
  central:
    <<: *app
    build:
      context: .
      target: runtime
    environment:
      BIND: 0.0.0.0:3000
      CONFIG_DIR: /config
      DATA_DIR: /data
      INPUT_DIR: /input
      LOG_DIR: /logs
      STATIC_DIR: /usr/share/forgearr/frontend
      # The scenario lab controls worker availability explicitly.
      LOCAL_WORKER: "false"
    volumes:
      - ./var/config:/config
      - data:/data
      - central_logs:/logs
      - ./var/input:/input:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/health]
      interval: 3s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    pull_policy: never
    command: [worker]
    # Enrôlement depuis http://localhost:3001 (voir .github/workflows/main-checks.yml) : le nom et la
    # clé du worker sont gardés dans son propre /config, distinct de celui du central.
    volumes:
      - worker_config:/config
      - work:/work
      - logs:/logs
    ports: ["127.0.0.1:3001:3000"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/health]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      central: {condition: service_healthy}

  # Outils réservés aux scénarios : jamais inclus dans les services de traitement.
  fixtures:
    profiles: [test]
    build:
      context: .
      dockerfile: deploy/fixtures.Dockerfile
    image: forgearr-fixtures:local
    volumes:
      - ./var/input:/fixtures
    entrypoint: [ffmpeg]

volumes:
  data:
  central_logs:
  worker_config:
  work:
  logs:
