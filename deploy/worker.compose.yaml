# Worker-only deployment on an additional Docker host.
# Au premier démarrage, ouvrez http://<hôte>:${WORKER_PORT:-3001} pour l'enrôler (ADR 0016) : son nom et sa
# clé sont gardés dans le volume /config, à conserver. Aucune clé ni adresse à renseigner ici.
services:
  worker:
    image: ${FLUX_IMAGE:?Provide an immutable Forgearr image tag or digest}
    command: [worker]
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    environment:
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-536870912}
    ports: ["${WORKER_PORT:-3001}:3000"]
    volumes: [config:/config, work:/work, logs:/logs]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
volumes:
  config:
  work:
  logs:
