openapi: 3.1.0
info:
  title: Flux de Fichiers — API de remuxage
  version: 0.1.0
  description: >-
    Central unique, workers MKVToolNix et frontend Leptos.
    Les noms de fichiers sont des noms MKV simples présents dans INPUT_DIR.
    Les humains ouvrent une session par compte (identifiant et mot de passe) ; les
    machines utilisent des clés d'API nommées et révocables (ADR 0011). Le bail est un secret
    temporaire transmis dans le corps des renouvellements ou dans un en-tête,
    jamais dans une URL. L'API accepte les clés Bearer et, pour le navigateur,
    une session cookie avec CSRF/origine. Tous les échanges distants nécessitent HTTPS.
servers:
  - url: https://localhost:3443
security:
  - ApiKey: []
paths:
  /:
    get:
      security: []
      summary: Informations publiques minimales du service
      responses:
        '200':
          description: Service et absence d'interface
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: {type: string}
                  interface: {type: boolean, const: false}
  /health:
    get:
      security: []
      summary: Disponibilité du central et de PostgreSQL
      responses:
        '204': {description: PostgreSQL joignable}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/files:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les entrées MKV admissibles, triées par nom, maximum 500
      responses:
        '200':
          description: Fichiers non vides sous la limite de taille, sans liens symboliques
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, bytes]
                  properties:
                    name: {type: string}
                    bytes: {type: integer, minimum: 1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les bibliothèques déclarées, triées par nom
      responses:
        '200':
          description: Chaque bibliothèque porte au plus un flux et un chemin par worker
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Library'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Déclarer une bibliothèque
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryWrite'}
      responses:
        '201':
          description: Bibliothèque créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/libraries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lire une bibliothèque
      responses:
        '200':
          description: Bibliothèque
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Remplacer le nom, le flux et les chemins de workers
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryWrite'}
      responses:
        '200':
          description: Bibliothèque mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer une bibliothèque et ses chemins de workers
      responses:
        '204': {description: Supprimée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les tâches par ordre de création décroissant
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: before
          description: UUID de la dernière tâche de la page précédente
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Page, tableau vide en fin de liste ou si le curseur est inconnu
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer une tâche et figer l'empreinte de la source
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - in: header
          name: Origin
          required: false
          description: Requis et égal à WEB_ORIGIN pour l'authentification par cookie ; Bearer reste indépendant.
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_name]
              properties:
                source_name: {type: string, maxLength: 240, example: exemple.mkv}
                target_worker_id: {type: [string, 'null'], format: uuid}
      responses:
        '201':
          description: Tâche créée ; les soumissions répétées créent des tâches distinctes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Consulter l'état d'une tâche sans exposer son jeton de bail
      responses:
        '200':
          description: Tâche
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/retry:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Relancer à la main une tâche échouée après perte de bail (`lease_expired`).
        Un bail expiré n'est jamais remis en file automatiquement ; la relance est
        refusée (409) pour un autre échec ou après trois tentatives.
      responses:
        '200':
          description: Tâche remise en file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/output:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Télécharger le résultat d'une tâche réussie
      responses:
        '200':
          description: Résultat immuable, téléchargement attachment en flux avec Cache-Control no-store
          headers:
            Content-Length:
              description: Taille exacte du fichier
              schema: {type: integer, minimum: 1}
            Cache-Control:
              description: Le média ne doit pas être mis en cache.
              schema: {type: string, const: no-store}
            Content-Disposition:
              description: Téléchargement direct, sans mise en mémoire du média.
              schema: {type: string}
          content:
            video/x-matroska:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Catalogue lu dans les dépôts de plugins synchronisés (vide tant qu'aucun dépôt n'est synchronisé)
      responses:
        '200':
          description: Fiches du catalogue ; une fiche inconnue du central est ignorée
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les dépôts de plugins
      responses:
        '200': {description: Dépôts, officiel en premier}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Ajouter un dépôt ; l'URL d'index doit être http(s) et finir par /catalogue/index.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, indexUrl]
              properties:
                id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$', description: Nom du dossier local du dépôt}
                name: {type: string, minLength: 1}
                indexUrl: {type: string, format: uri}
      responses:
        '200': {description: Dépôt ajouté}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}:
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Supprimer un dépôt tiers (le dépôt officiel est protégé)
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Dépôt supprimé}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/toggle:
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Activer ou désactiver un dépôt
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Nouvel état}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/repositories/{id}/sync:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Synchroniser un dépôt : copie atomique de l'index, des manifestes et des contrats de
        distribution dans /config/plugins/{id}. Sans redirection, adresses privées refusées
        (sauf PLUGIN_ALLOW_PRIVATE_HOSTS=1), taille et nombre de fichiers bornés.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Bilan (entrées, fichiers, fiches ignorées)}
        '502': {description: Dépôt injoignable ou refusé, l'ancienne copie est conservée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plugins/{id}/settings:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Champs de réglages d'un plugin ; un secret n'est jamais renvoyé, seulement isSet
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Champs résolus et réglages publics}
        default: {$ref: '#/components/responses/Error'}
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Enregistrer les réglages d'un plugin du catalogue. Les secrets saisis sont chiffrés
        (ChaCha20-Poly1305, clé générée dans /config, liée au plugin et au champ) ; un secret laissé vide est conservé.
        Maximum 64 clés et 64 Kio.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Réglages enregistrés, secrets exclus de la réponse}
        '413': {description: Réglages trop volumineux}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: État des outils du catalogue dans le cache du central (ready ou not_installed)
      responses:
        '200': {description: Outils}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}/distribution:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Contrat de distribution d'un outil, lu dans le dépôt synchronisé
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Contrat distribution.v1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tools/{id}/install:
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: >-
        Installer un outil du catalogue dans le cache du central : téléchargement https,
        redirections revérifiées, SHA-256 de l'archive et du binaire contrôlés avant exécution.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Outil prêt}
        '502': {description: Archive injoignable}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/tools/{id}/distribution:
    get:
      security: [{ApiKey: []}]
      summary: Contrat de distribution d'un outil pour un worker, qui l'installe dans son propre cache
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Contrat distribution.v1}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    get:
      security: [{WebSession: []}]
      summary: Lire le statut de session et récupérer le jeton CSRF après rechargement
      responses:
        '200':
          description: Session valide et réponse non mise en cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/setup/status:
    get:
      security: []
      summary: Indiquer si le central attend son installation
      responses:
        '200':
          description: État d'installation et nom du central une fois installé
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup]
                properties:
                  needsSetup: {type: boolean}
                  instanceName: {type: [string, 'null']}
                  passwordResetEnabled:
                    type: boolean
                    description: Le central peut envoyer un lien de réinitialisation par courriel (SMTP et WEB_ORIGIN configurés).
  /api/v1/setup/central:
    post:
      security: []
      summary: Installer le central (usage unique) et ouvrir la session de l'administrateur
      description: >-
        Crée le compte administrateur (mot de passe haché en Argon2id), enregistre le nom
        du central et génère le secret de chiffrement. Refusé en 409 `already_configured`
        dès qu'un compte existe. Origin exact requis ; la session est posée comme à la connexion.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password]
              properties:
                name: {type: string}
                username: {type: string, minLength: 3, maxLength: 40}
                password: {type: string, minLength: 8, writeOnly: true}
                email: {type: string, description: Adresse de l'administrateur, facultative (mot de passe oublié)}
      responses:
        '200':
          description: Installation faite et session ouverte
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/setup/worker:
    post:
      security: []
      summary: Transformer une installation vierge en worker (usage unique)
      description: >-
        Enrôle cette installation auprès du central `central_url` avec les identifiants d'un
        administrateur, conserve le rôle et la clé dans `/config`, puis relance le processus en
        worker. 409 `already_configured` si l'installation est déjà configurée ; 502
        `central_unavailable` si le central est injoignable. Origin exact requis.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [central_url, username, password, worker_name]
              properties:
                central_url: {type: string, description: Origine du central, sans chemin}
                username: {type: string}
                password: {type: string, writeOnly: true}
                worker_name: {type: string, maxLength: 80, pattern: '^[A-Za-z0-9._-]+$'}
      responses:
        '202': {description: Enrôlement fait, l'installation redémarre en worker}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers/enroll:
    post:
      security: []
      summary: Créer la clé d'API d'un worker
      description: >-
        Réservé aux identifiants d'un administrateur (essais limités). Renvoie une clé de rôle
        worker, affichée une seule fois. Sans cookie : appel de machine à machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, worker_name]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
                worker_name: {type: string, maxLength: 80, pattern: '^[A-Za-z0-9._-]+$'}
      responses:
        '200':
          description: Clé du worker
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/instance/status:
    get:
      security: []
      summary: État public de l'installation (central ou worker)
      responses:
        '200':
          description: Type d'installation et version
          content:
            application/json:
              schema:
                type: object
                required: [instanceKind, version]
                properties:
                  instanceKind: {type: string, enum: [central, worker]}
                  version: {type: string}
                  installed: {type: boolean, description: Central seulement}
                  name: {type: string, description: Worker seulement}
                  centralUrl: {type: string, description: Worker seulement}
                  registered: {type: boolean, description: Worker seulement}
                  centralReachable: {type: boolean, description: Worker seulement}
  /api/v1/worker/overview:
    get:
      security: [{ApiKey: []}]
      summary: Vue d'ensemble du worker appelant
      description: >-
        Nom, dernière activité et nombre de tâches par statut. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Vue d'ensemble}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/jobs:
    get:
      security: [{ApiKey: []}]
      summary: Tâches traitées par le worker appelant
      description: >-
        Les 100 plus récentes, jamais celles des autres workers. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Tâches du worker}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/plugins:
    get:
      security: [{ApiKey: []}]
      summary: Catalogue de plugins, en lecture seule
      description: >-
        Même catalogue que `GET /api/v1/plugins`. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Entrées du catalogue}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/login:
    post:
      security: [{ApiKey: []}]
      summary: Vérifier les identifiants saisis sur un worker
      description: >-
        Connexion déléguée : mêmes limites d'essais qu'une connexion directe ; renvoie id, identifiant et rôle du compte. Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '200': {description: Compte vérifié}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/worker/accounts:
    get:
      security: [{ApiKey: []}]
      summary: Copie des comptes pour la connexion de secours
      description: >-
        Hachés Argon2id et versions ; la copie remplace celle du worker en bloc (un compte absent est supprimé). Réservé à la clé d'un worker (rôle worker) ; limité à ce worker.
      responses:
        '200': {description: Copie complète des comptes}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      security: []
      summary: Ouvrir une session web avec un compte
      description: >-
        Origin exact requis. Le serveur pose un cookie de session HttpOnly, SameSite=Strict
        (Secure si WEB_ORIGIN est HTTPS) et un cookie CSRF lisible par le frontend. Les échecs
        répétés sont limités : 429 `too_many_attempts`.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '200':
          description: Session créée ; réponse non mise en cache
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSession'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/forgot-password:
    post:
      security: []
      summary: Demander un lien de réinitialisation du mot de passe par courriel
      description: >-
        Répond 202 que l'adresse corresponde à un compte actif ou non (l'envoi se fait en arrière-plan).
        Un jeton à usage unique (30 minutes, haché en base) est envoyé dans un lien `<WEB_ORIGIN>/#reset=<jeton>`.
        Limites : 5 demandes par quart d'heure et par adresse (429 `too_many_attempts`), un courriel par
        minute et par compte. 404 si SMTP ou WEB_ORIGIN n'est pas configuré. Origin exact requis (ADR 0015).
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
      responses:
        '202': {description: Demande prise en compte}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/reset-password:
    post:
      security: []
      summary: Choisir un nouveau mot de passe avec le jeton reçu par courriel
      description: >-
        Consomme le jeton (un seul usage), change le mot de passe et ferme toutes les sessions du compte.
        400 si le jeton est inconnu, expiré ou déjà utilisé, ou si le mot de passe est refusé (le jeton
        n'est alors pas consommé). Origin exact requis.
      parameters: [{$ref: '#/components/parameters/OriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string}
                new_password: {type: string, minLength: 8, writeOnly: true}
      responses:
        '204': {description: Mot de passe changé}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Identité, rôle, droits et type d'installation de l'appelant
      description: L'interface n'affiche que ce que ces droits permettent ; chaque route les revérifie.
      responses:
        '200':
          description: Profil courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: {type: string, enum: [account, apiKey]}
                  name: {type: string}
                  role: {type: string, enum: [admin, worker]}
                  permissions: {type: array, items: {type: string}}
                  instanceKind: {type: string, enum: [central, worker]}
                  instanceName: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/account/password:
    put:
      security: [{WebSession: []}]
      summary: Changer le mot de passe du compte connecté
      description: Les autres sessions du compte sont fermées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, writeOnly: true}
                new_password: {type: string, minLength: 8, writeOnly: true}
      responses:
        '204': {description: Mot de passe modifié}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/system/status:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: État du système pour la page Paramètres
      description: >-
        Administrateur seulement. Version, identifiant et origine (`local` ou `external`) de la clé de
        chiffrement, taille de la base SQLite et de son journal (`null` pour une base en mémoire),
        réseau (adresse d'écoute, TLS direct, origine web, durée de session) et stockage (dossiers,
        taille maximale d'un fichier, capacité et espace libre du volume de `dataDir`).
      responses:
        '200':
          description: État du système
          content:
            application/json:
              schema:
                type: object
                required: [version, keyId, keySource, databaseBytes, network, storage]
                properties:
                  version: {type: string}
                  keyId: {type: string}
                  keySource: {type: string, enum: [local, external]}
                  databaseBytes: {type: [integer, 'null']}
                  network:
                    type: object
                    required: [bind, tls, webOrigin, sessionTtlSeconds]
                    properties:
                      bind: {type: string}
                      tls: {type: boolean}
                      webOrigin: {type: [string, 'null']}
                      sessionTtlSeconds: {type: integer}
                  storage:
                    type: object
                    required: [configDir, dataDir, inputDir, toolsCacheDir, pluginsDir, maxFileBytes, volume]
                    properties:
                      configDir: {type: string}
                      dataDir: {type: string}
                      inputDir: {type: string}
                      toolsCacheDir: {type: string}
                      pluginsDir: {type: [string, 'null']}
                      maxFileBytes: {type: integer}
                      volume:
                        type: [object, 'null']
                        required: [totalBytes, availableBytes]
                        properties:
                          totalBytes: {type: integer}
                          availableBytes: {type: integer}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/system/hardware:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Charge matérielle du central (vue d'ensemble)
      description: >-
        Droit de consulter la vue d'ensemble. Relevé à la demande : cœurs logiques, charge CPU
        (charge sur 1 minute rapportée aux cœurs, 0 à 100), mémoire, périphériques GPU détectés,
        capacité et espace libre du volume de `dataDir` (`null` si illisible). Ne concerne que le
        central, pas les workers distants.
      responses:
        '200':
          description: Relevé matériel
          content:
            application/json:
              schema:
                type: object
                required: [logicalCores, cpuUsagePercent, ramTotalBytes, ramUsedBytes, gpuDevices, volume]
                properties:
                  logicalCores: {type: integer}
                  cpuUsagePercent: {type: number}
                  ramTotalBytes: {type: integer}
                  ramUsedBytes: {type: integer}
                  gpuDevices: {type: array, items: {type: string}}
                  volume:
                    type: [object, 'null']
                    required: [totalBytes, availableBytes]
                    properties:
                      totalBytes: {type: integer}
                      availableBytes: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/accounts:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les comptes (sans haché)
      responses:
        '200': {description: Comptes par identifiant}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer un compte
      description: >-
        Rôles admis : `admin` et `viewer` (le rôle `worker` est réservé aux clés d'API). Identifiant déjà
        pris : 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string, minLength: 3, maxLength: 40}
                password: {type: string, minLength: 8, writeOnly: true}
                role: {type: string, enum: [admin, viewer]}
      responses:
        '201': {description: Compte créé}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}:
    put:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Changer le rôle ou désactiver un compte
      description: >-
        Au moins un champ. Les sessions du compte sont fermées. 409 si l'opération retirerait le dernier
        administrateur actif.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {type: string, enum: [admin, viewer]}
                disabled: {type: boolean}
                email:
                  type: string
                  description: Nouvelle adresse (chaîne vide pour l'effacer) ; ne ferme pas les sessions. 409 si elle est déjà prise.
      responses:
        '200': {description: Compte mis à jour}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/api-keys:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les clés d'API (sans secret ni haché)
      responses:
        '200':
          description: Clés actives d'abord
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Créer une clé d'API ; sa valeur n'est renvoyée qu'ici
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: {type: string}
                role: {type: string, enum: [admin, worker]}
      responses:
        '200':
          description: Clé créée (format fdf_<id>_<secret>)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiKey'}
                  - type: object
                    properties:
                      key: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/api-keys/{id}:
    delete:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Révoquer une clé d'API
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '204': {description: Clé révoquée}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      security: [{WebSession: []}]
      summary: Révoquer la session en cours
      description: Requiert Origin exact, cookie CSRF et en-tête X-CSRF-Token ; supprime la session côté serveur et expire les cookies.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/OriginHeader'}
      responses:
        '204': {description: Session révoquée et cookies expirés}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workers:
    get:
      security: [{ApiKey: []}, {WebSession: []}]
      summary: Lister les workers enregistrés, maximum 200
      responses:
        '200':
          description: Workers par nom ; last_seen est actualisé à chaque demande de travail
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
    post:
      security: [{ApiKey: []}]
      summary: Enregistrer un worker ; le même nom conserve son UUID après redémarrage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$'}
      responses:
        '200':
          description: Worker enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Worker'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/claims:
    post:
      security: [{ApiKey: []}]
      summary: Réserver atomiquement la prochaine tâche disponible pour ce worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: {type: string, format: uuid}
      responses:
        '200':
          description: Bail de 120 secondes, ou null si aucune tâche ; trois tentatives maximum
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Claim'}
                  - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/heartbeat:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}]
      summary: Renouveler un bail actif ; worker configuré à un renouvellement toutes les 20 s
      requestBody: {$ref: '#/components/requestBodies/Lease'}
      responses:
        '204': {description: Bail prolongé de 120 secondes}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/failure:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      security: [{ApiKey: []}]
      summary: Marquer une tâche active en échec terminal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Lease'}
                - type: object
                  required: [error_code]
                  properties:
                    error_code: {type: string, enum: [source_integrity, remux_failed, transfer_failed]}
      responses:
        '204': {description: Échec enregistré}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/source:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - {$ref: '#/components/parameters/WorkerId'}
      - {$ref: '#/components/parameters/LeaseToken'}
    get:
      security: [{ApiKey: []}]
      summary: Télécharger la source pour un bail actif ; le worker vérifie son empreinte
      responses:
        '200':
          description: Fichier source, Content-Length fourni
          content:
            video/x-matroska:
              schema: {type: string, format: binary}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/result:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - {$ref: '#/components/parameters/WorkerId'}
      - {$ref: '#/components/parameters/LeaseToken'}
    put:
      security: [{ApiKey: []}]
      summary: Téléverser puis valider et publier le résultat atomiquement
      parameters:
        - in: header
          name: x-remux-warning
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          video/x-matroska:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Résultat publié, bail consommé}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ApiKey: {type: http, scheme: bearer, description: "Clé d'API fdf_<id>_<secret> (rôle admin ou worker) ; si Authorization existe elle a priorité sur le cookie, sans repli en cas d'invalidité"}
    WebSession: {type: apiKey, in: cookie, name: flux_session, description: Session web d'un compte avec CSRF sur les méthodes mutantes}
  parameters:
    JobId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    WorkerId:
      in: header
      name: x-worker-id
      required: true
      schema: {type: string, format: uuid}
    LeaseToken:
      in: header
      name: x-lease-token
      required: true
      schema: {type: string, format: uuid}
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: false
      description: Doit correspondre au cookie flux_csrf pour les requêtes authentifiées par session.
      schema: {type: string}
    OriginHeader:
      in: header
      name: Origin
      required: false
      description: Doit correspondre exactement à WEB_ORIGIN.
      schema: {type: string, format: uri}
  requestBodies:
    Lease:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Lease'}
  responses:
    Error:
      description: >-
        Erreur applicative JSON : 400 entrée invalide, 401 clé absente/invalide ou mauvais rôle,
        404 ressource absente, 409 bail expiré ou conflit, 413 taille dépassée,
        500 défaillance interne. Les erreurs d'extraction HTTP (JSON/UUID) sont
        également normalisées. x-request-id permet de retrouver la requête dans les journaux.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code]
                properties:
                  code: {type: string}
  schemas:
    ApiKey:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, worker]}
        createdAt: {type: string}
        lastUsedAt: {type: [string, 'null']}
        revokedAt: {type: [string, 'null']}
    WebSession:
      type: object
      required: [csrf_token, expires_at]
      properties:
        csrf_token: {type: string, description: CSRF cookie echo for frontend bootstrap}
        expires_at: {type: string, format: date-time}
    Lease:
      type: object
      required: [worker_id, lease_token]
      properties:
        worker_id: {type: string, format: uuid}
        lease_token: {type: string, format: uuid, writeOnly: true}
    Worker:
      type: object
      required: [id, name, last_seen]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        last_seen: {type: string, format: date-time}
    LibraryWorkerPath:
      type: object
      required: [worker_id, local_path, access]
      properties:
        worker_id: {type: string, format: uuid}
        local_path: {type: string, minLength: 1, maxLength: 512}
        access: {type: string, enum: [read, read_write]}
    LibraryWrite:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        flow_id: {type: [string, 'null']}
        workers:
          type: array
          items: {$ref: '#/components/schemas/LibraryWorkerPath'}
    Library:
      type: object
      required: [id, name, flow_id, workers, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        flow_id: {type: [string, 'null']}
        workers:
          type: array
          items: {$ref: '#/components/schemas/LibraryWorkerPath'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Claim:
      type: object
      required: [job_id, lease_token, source_name, source_sha256, source_bytes]
      properties:
        job_id: {type: string, format: uuid}
        lease_token: {type: string, format: uuid}
        source_name: {type: string}
        source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        source_bytes: {type: integer, minimum: 1}
    Job:
      type: object
      required: [id, source_name, status, attempts, warning, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        source_name: {type: string}
        source_sha256: {type: [string, 'null']}
        source_bytes: {type: [integer, 'null']}
        target_worker_id: {type: [string, 'null'], format: uuid}
        worker_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        attempts: {type: integer, minimum: 0, maximum: 3}
        leased_until: {type: [string, 'null'], format: date-time}
        output_name: {type: [string, 'null']}
        output_sha256: {type: [string, 'null']}
        output_bytes: {type: [integer, 'null']}
        warning: {type: boolean}
        error_code: {type: [string, 'null']}
        flow_id:
          type: [string, 'null']
          description: Flow par défaut retenu à la création de la tâche.
        flow_version:
          type: [integer, 'null']
          description: Version figée du flow ; modifier le flow ensuite ne change pas la tâche.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
