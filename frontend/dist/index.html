<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flux de Fichiers">
  <meta name="application-name" content="Flux de Fichiers">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Console de pilotage et supervision de remuxage Flux de Fichiers.">
  <title>Flux de Fichiers — Pilotage et supervision</title>
  <style>

:root {
  /* --- Safe Area Insets (Apple HIG & WebKit) --- */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);

  /* --- Cibles tactiles minimales (Google M3 48px & Apple HIG 44px) --- */
  --touch-target-min: 48px;
  --touch-target-compact: 44px;

  /* --- Échelle d'espacement (mise en page aérée) --- */
  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;

  /* --- Rayons, courbes et typographie --- */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* --- Surfaces & Couleurs Thème Sombre --- */
  --bg-app: #090b10;
  --bg-card: #151922;
  --bg-elevated: #0e1117;
  --bg-subtle: #1c212c;
  --bg-glass: rgba(14, 17, 23, 0.82);
  --border-color: #262c3a;
  --border-subtle: rgba(240, 246, 252, 0.07);
  --border-highlight: rgba(99, 102, 241, 0.55);
  --text-main: #f3f6fc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --primary: #6366f1;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(99, 102, 241, 0.16);
  --accent: #22d3ee;
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.14);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --danger-text: #f87171;
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.15);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-glow: 0 0 0 1px rgba(99, 102, 241, 0.35), 0 8px 24px rgba(99, 102, 241, 0.2);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
  --bg-app: #f1f5f9;
  --bg-card: #ffffff;
  --bg-elevated: #f8fafc;
  --bg-subtle: #f1f5f9;
  --bg-glass: rgba(248, 250, 252, 0.88);
  --border-color: #e2e8f0;
  --border-subtle: rgba(15, 23, 42, 0.07);
  --border-highlight: rgba(79, 70, 229, 0.45);
  --text-main: #0f172a;
  --text-dim: #475569;
  --text-muted: #64748b;
  --primary: #4f46e5;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(79, 70, 229, 0.10);
  --accent: #0891b2;
  --success: #059669;
  --success-bg: rgba(5, 150, 105, 0.10);
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.10);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.10);
  --danger-text: #b91c1c;
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 0 0 1px rgba(9, 105, 218, 0.25), 0 8px 20px rgba(9, 105, 218, 0.12);
  }
}

[data-theme="light"] {
  --bg-app: #f1f5f9;
  --bg-card: #ffffff;
  --bg-elevated: #f8fafc;
  --bg-subtle: #f1f5f9;
  --bg-glass: rgba(248, 250, 252, 0.88);
  --border-color: #e2e8f0;
  --border-subtle: rgba(15, 23, 42, 0.07);
  --border-highlight: rgba(79, 70, 229, 0.45);
  --text-main: #0f172a;
  --text-dim: #475569;
  --text-muted: #64748b;
  --primary: #4f46e5;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(79, 70, 229, 0.10);
  --accent: #0891b2;
  --success: #059669;
  --success-bg: rgba(5, 150, 105, 0.10);
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.10);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.10);
  --danger-text: #b91c1c;
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 0 0 1px rgba(9, 105, 218, 0.25), 0 8px 20px rgba(9, 105, 218, 0.12);
}

[data-theme="dark"] {
  --bg-app: #090b10;
  --bg-card: #151922;
  --bg-elevated: #0e1117;
  --bg-subtle: #1c212c;
  --bg-glass: rgba(14, 17, 23, 0.82);
  --border-color: #262c3a;
  --border-subtle: rgba(240, 246, 252, 0.07);
  --border-highlight: rgba(99, 102, 241, 0.55);
  --text-main: #f3f6fc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --primary: #6366f1;
  --primary-contrast: #ffffff;
  --primary-bg: rgba(99, 102, 241, 0.16);
  --accent: #22d3ee;
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.14);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --danger-text: #f87171;
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.15);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-glow: 0 0 0 1px rgba(99, 102, 241, 0.35), 0 8px 24px rgba(99, 102, 241, 0.2);
}


*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  text-rendering: optimizeLegibility;
}

/* --- Rendu tactile mobile & suppression des reflets parasites (Apple/Google) --- */
button, a, select, input {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* --- Focus Ring Accessible W3C (WCAG AAA) --- */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* --- Respect des préférences de réduction de mouvement (Apple HIG & Google M3) --- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* --- Skip Link (Accessibilité Clavier W3C) --- */
.skip-link {
  position: absolute;
  top: -100px;
  left: 1rem;
  background: var(--primary);
  color: var(--primary-contrast);
  padding: 0.5rem 1rem;
  border-radius: var(--radius-sm);
  z-index: 9999;
  text-decoration: none;
  font-weight: 600;
  transition: top 0.2s ease;
}

.skip-link:focus {
  top: 1rem;
}

/* --- Structure globale du shell (Sidebar Rail + Zone de contenu) --- */
.application-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-app);
  color: var(--text-main);
  box-sizing: border-box;
}

.application-navigation-layout {
  display: flex;
  flex: 1;
  min-height: 100vh;
  padding: 0.5rem;
  gap: 0.5rem;
  background-color: var(--bg-app);
  box-sizing: border-box;
}

/* --- Barre latérale de navigation (App Frame style Linear / Raycast) --- */
.application-sidebar {
  width: 244px;
  background-color: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.22s var(--ease-out);
  position: sticky;
  top: 0.5rem;
  height: calc(100vh - 1rem);
  overflow-y: auto;
  z-index: 50;
  box-sizing: border-box;
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
}

.application-sidebar.is-collapsed {
  width: 76px;
}

.application-sidebar.is-collapsed .brand-info,
.application-sidebar.is-collapsed .tab-btn-label,
.application-sidebar.is-collapsed .tab-btn-badge,
.application-sidebar.is-collapsed .nav-group-label,
.application-sidebar.is-collapsed .collapse-label,
.application-sidebar.is-collapsed .sidebar-cmd-btn__label,
.application-sidebar.is-collapsed .sidebar-cmd-btn__kbd,
.application-sidebar.is-collapsed .sidebar-user-meta {
  display: none;
}

.application-sidebar.is-collapsed .sidebar-cmd-btn {
  justify-content: center;
  padding: 0.5rem;
}

.application-sidebar.is-collapsed .sidebar-user-card {
  flex-direction: column;
  padding: 0.4rem;
}

.application-sidebar.is-collapsed .tab-btn {
  justify-content: center;
  padding: 0.75rem 0.5rem;
}

.application-sidebar.is-collapsed .brand {
  justify-content: center;
}

.application-sidebar.is-collapsed .sidebar-footer {
  padding: 0.75rem 0.5rem;
  align-items: center;
}

.application-sidebar.is-collapsed .sidebar-collapse-btn {
  width: 40px;
  height: 40px;
  padding: 0;
  margin: 0 auto;
  border-radius: var(--radius-sm);
  justify-content: center;
}

.application-sidebar.is-collapsed .sidebar-collapse-btn .collapse-icon {
  transform: rotate(180deg);
}

.application-sidebar.is-collapsed .sidebar-footer-tools {
  width: 100%;
  justify-content: center;
}

/* Replié : le thème se règle barre dépliée, la déconnexion reste accessible. */
.application-sidebar.is-collapsed .theme-segmented {
  display: none;
}

/* En-tête de la marque */
.sidebar-header {
  padding: 1.25rem 1rem;
  border-bottom: 1px solid var(--border-color);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: var(--text-main);
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--primary-contrast);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.8125rem;
  letter-spacing: 0.5px;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.brand-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.brand-name {
  font-weight: 700;
  font-size: 0.95rem;
  white-space: nowrap;
}

.brand-meta {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.15rem;
}

.brand-node-badge {
  display: inline-flex;
  align-items: center;
  padding: 0.08rem 0.42rem;
  border-radius: var(--radius-pill);
  background: var(--primary-bg);
  color: var(--primary);
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.brand-version {
  font-size: 0.72rem;
  color: var(--text-dim);
}

.sidebar-cmd-btn {
  margin-top: 0.75rem;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.6rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-dim);
  font-size: 0.8125rem;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.sidebar-cmd-btn:hover {
  border-color: var(--primary);
  color: var(--text-main);
}

.sidebar-cmd-btn__label {
  flex: 1;
  text-align: left;
  white-space: nowrap;
}

.sidebar-cmd-btn__kbd {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  padding: 0.05rem 0.35rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-muted);
}

/* Groupes et boutons de navigation */
.tab-navigation {
  flex: 1;
  padding: 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.tab-list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.nav-group-label {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  padding: 0.75rem 0.5rem 0.25rem 0.5rem;
  user-select: none;
}

.tab-btn {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  min-height: var(--touch-target-compact);
  padding: 0.625rem 0.75rem;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  user-select: none;
  touch-action: manipulation;
  transition: all 0.16s var(--ease-out);
}

.tab-btn:hover {
  background-color: var(--bg-subtle);
  color: var(--text-main);
}

.tab-btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}

.tab-btn[aria-selected="true"] {
  background-color: var(--primary-bg);
  color: var(--primary);
  font-weight: 600;
  border-color: color-mix(in srgb, var(--primary) 35%, transparent);
  box-shadow: inset 3px 0 0 var(--primary);
}

.tab-role-icon {
  font-size: 1.125rem;
  flex-shrink: 0;
}

.tab-btn-label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tab-btn-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.35rem;
  height: 1.2rem;
  padding: 0 0.4rem;
  border-radius: var(--radius-pill);
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  background: var(--bg-subtle);
  color: var(--text-dim);
  flex-shrink: 0;
}

.tab-btn-badge[data-tone="primary"] {
  background: var(--primary-bg);
  color: var(--primary);
}

.tab-btn-badge[data-tone="success"] {
  background: var(--success-bg);
  color: var(--success);
}

.tab-btn-badge[data-tone="warning"] {
  background: var(--warning-bg);
  color: var(--warning);
}

.tab-btn-badge[data-tone="danger"] {
  background: var(--danger-bg);
  color: var(--danger);
}

/* Pied de la barre latérale */
.sidebar-footer {
  padding: 0.75rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.sidebar-user-card {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.45rem 0.55rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
}

.sidebar-user-avatar {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-pill);
  background: var(--primary-bg);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  flex-shrink: 0;
}

.sidebar-user-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.sidebar-user-name {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-user-role {
  font-size: 0.6875rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-collapse-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.45rem 0.6rem;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-dim);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s ease-in-out;
}

.sidebar-collapse-btn:hover {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--primary);
}

.collapse-icon {
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.sidebar-footer-tools {
  display: flex;
  gap: 0.5rem;
}

/* Thème : trois boutons exclusifs. */
.theme-segmented {
  display: flex;
  width: 100%;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.theme-segmented__btn {
  flex: 1;
  padding: 0.4rem 0.25rem;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.75rem;
  cursor: pointer;
}

.theme-segmented__btn:hover {
  color: var(--text-main);
}

.theme-segmented__btn[aria-pressed="true"] {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  font-weight: 600;
}

/* Déconnexion : un bouton discret à côté du thème, toujours accessible. */
.sidebar-footer-tools {
  align-items: center;
}

.sidebar-logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
}

.sidebar-logout-btn:hover {
  border-color: var(--primary);
  color: var(--text-main);
}

/* --- Zone de transition & contenu principal --- */
.page-transition-region {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: clip;
}

/* --- Barre de commande intégrée dans le panneau principal --- */
.app-topbar {
  position: sticky;
  top: max(0px, var(--sat));
  z-index: 40;
  margin: 0;
  background-color: var(--bg-glass);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border-subtle);
  transition: opacity 0.22s var(--ease-out),
              transform 0.22s var(--ease-out),
              box-shadow 0.2s var(--ease-out),
              border-color 0.2s var(--ease-out);
  box-sizing: border-box;
}

.app-topbar:focus-within {
  border-bottom-color: var(--border-highlight);
}

/* Élévation quand la page est défilée */
.app-topbar.is-elevated {
  border-bottom-color: var(--border-highlight);
  box-shadow: var(--shadow-sm);
}

/* Auto-masquage intelligent au défilement (disparaît vers le haut) */
.app-topbar.is-hidden:not(:focus-within) {
  opacity: 0;
  transform: translateY(calc(-100% - 20px));
  pointer-events: none;
}

.topbar-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.5rem 1rem;
  min-height: 52px;
  box-sizing: border-box;
}

.topbar-lead {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-width: 0;
}

.topbar-breadcrumb {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.8125rem;
  min-width: 0;
  white-space: nowrap;
}

.topbar-breadcrumb__group {
  color: var(--text-dim);
  font-weight: 500;
}

.topbar-breadcrumb__sep {
  color: var(--text-muted);
}

.topbar-breadcrumb__page {
  color: var(--text-main);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Style des icônes vectorielles Lucide */
.lucide-icon {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

/* Capsule de recherche : saisie, actions de la page, bouton Filtres.
   La feuille est un enfant du champ : elle en sort par le bas, à la même largeur. */
/* Bouton du tiroir de navigation : visible seulement sur écran étroit. */
.topbar-menu-btn {
  display: none;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  cursor: pointer;
}

.sidebar-scrim {
  display: none;
}

.topbar-search-anchor {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  max-width: 720px;
  margin-inline: auto;
}

.topbar-search {
  display: flex;
  align-items: stretch;
  min-height: 36px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-dim);
  box-sizing: border-box;
  transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
}

.topbar-search:focus-within,
body[data-filter-sheet] .topbar-search {
  color: var(--text-main);
  border-color: var(--primary);
  background: var(--bg-card);
}

.search-capsule__query {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
  padding: 0 0.65rem;
}

.topbar-search .search-icon {
  flex-shrink: 0;
  color: var(--text-muted);
}

.topbar-search-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: 0.8125rem;
  font-family: inherit;
  padding: 0.1rem 0;
}

.topbar-search-input::placeholder {
  color: var(--text-muted);
  font-style: italic;
  transition: color 0.15s ease-in-out;
}

.topbar-search-input::-webkit-search-cancel-button,
.topbar-search-input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}

/* Compteur de correspondances réactif (ex: 3 sur 12) */
.search-match-count {
  font-size: 0.6875rem;
  font-weight: 600;
  padding: 0.15rem 0.45rem;
  border-radius: 12px;
  background-color: rgba(88, 166, 255, 0.15);
  color: var(--primary);
  white-space: nowrap;
  user-select: none;
}

.search-match-count:empty {
  display: none;
}

.topbar-search-clear {
  background: transparent;
  border: none;
  padding: 0.1rem;
  cursor: pointer;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease-in-out;
}

.topbar-search-clear:hover {
  color: var(--text-main);
}

.filter-sheet {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 30;
  padding: 0.75rem;
  background: var(--bg-card);
  border: 1px solid var(--primary);
  border-top: 0;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.filter-sheet__head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.65rem;
}

.filter-sheet__title {
  font-weight: 700;
  color: var(--text-main);
  margin-right: auto;
}

.filter-sheet__text-btn {
  border: 0;
  background: transparent;
  color: var(--primary);
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 700;
  cursor: pointer;
}

.filter-sheet__label {
  margin: 0 0 0.4rem;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.filter-sheet .filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

/* Actions et statuts de la TopBar alignés à droite dans le flux flex. */
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-shrink: 0;
}

.status-pill-link {
  display: inline-flex;
  text-decoration: none;
}

.status-pill-link:hover .status-pill {
  filter: brightness(1.08);
}

.header-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  user-select: none;
  touch-action: manipulation;
}

.header-icon-btn:hover {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--border-color);
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.is-spinning svg,
.is-spinning .lucide-icon {
  animation: spin 0.8s linear infinite;
}







.header-status {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Zone de contenu principale */
.main-content {
  flex: 1;
  padding: 1.5rem;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
}

.application-shell.is-workbench .app-topbar {
  display: none;
}

.main-content.is-workbench {
  padding: 0;
  max-width: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: calc(100dvh - 1rem);
  min-height: 540px;
}

@keyframes pageFadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.tab-panel {
  animation: pageFadeIn 0.22s var(--ease-out);
}

/* --- Bandeau de KPIs (StatStrip) --- */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}

.stat-pill {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 0.35rem;
  padding: 0.7rem 0.95rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  text-align: left;
  font: inherit;
  color: inherit;
  transition: border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
}

.stat-pill.is-interactive {
  cursor: pointer;
  user-select: none;
}

.stat-pill.is-interactive:hover {
  border-color: var(--border-highlight);
  background: color-mix(in srgb, var(--primary) 6%, var(--bg-card));
}

.stat-pill.is-interactive.is-active {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 12%, var(--bg-card));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent), var(--shadow-sm);
}

.stat-pill__top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}

.stat-pill[data-tone="success"] {
  border-color: color-mix(in srgb, var(--success) 40%, var(--border-color));
}

.stat-pill[data-tone="warning"] {
  border-color: color-mix(in srgb, var(--warning) 45%, var(--border-color));
}

.stat-pill[data-tone="danger"] {
  border-color: color-mix(in srgb, var(--danger) 45%, var(--border-color));
}

.stat-pill__label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-dim);
}

.stat-pill__value {
  font-size: 1.25rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  color: var(--text-main);
}

.stat-pill[data-tone="success"] .stat-pill__value {
  color: var(--success);
}

.stat-pill[data-tone="warning"] .stat-pill__value {
  color: var(--warning);
}

.stat-pill[data-tone="danger"] .stat-pill__value {
  color: var(--danger);
}

.stat-pill__detail {
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}

.kbd-shortcut {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
}

.kbd-shortcut:hover {
  border-color: var(--border-highlight);
  color: var(--text-main);
  background: var(--bg-elevated);
}

/* --- Barre d'état compacte : Vue d'ensemble --- */
.overview-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.overview-toolbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  width: fit-content;
  padding: 0.25rem 0.75rem;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  color: var(--text-dim);
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid var(--border-color);
}

.hero-badge[data-tone="success"] {
  background-color: var(--success-bg);
  color: var(--success);
  border-color: color-mix(in srgb, var(--success) 35%, transparent);
}

.hero-badge[data-tone="warning"] {
  background-color: var(--warning-bg);
  color: var(--warning);
  border-color: color-mix(in srgb, var(--warning) 35%, transparent);
}

.hero-badge[data-tone="danger"] {
  background-color: var(--danger-bg);
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 35%, transparent);
}

/* Panneau repliable de la barre d'actions (widgets, filtres) */
.popover {
  position: relative;
}

.popover > summary {
  list-style: none;
  cursor: pointer;
}

.popover__panel {
  position: absolute;
  right: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-1);
  padding: var(--space-3);
  min-width: 200px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
}

/* Grille de métriques et KPIs statistiques */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

/* Grille bi-colonne pour la vue d'ensemble */
.overview-grid-2col {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.overview-grid-2col > .section-panel {
  margin-bottom: 0;
}

@media (max-width: 960px) {
  .overview-grid-2col {
    grid-template-columns: 1fr;
  }
}

/* Distribution des formats de médias & Stockage */
.media-insights-wrapper {
  display: flex;
  flex-direction: column;
}

.insights-section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.8125rem;
  color: var(--text-dim);
  margin-bottom: 0.35rem;
}

.insights-total {
  font-weight: 600;
  color: var(--text-main);
}

.segmented-distribution-bar {
  height: 12px;
  border-radius: 6px;
  background-color: var(--bg-subtle);
  display: flex;
  overflow: hidden;
  margin: var(--space-1) 0 var(--space-2) 0;
  border: 1px solid var(--border-color);
}

.segment-fill {
  height: 100%;
  transition: width 0.3s ease;
}

.segment-fill.mkv { background-color: var(--primary); }
.segment-fill.mp4 { background-color: var(--accent); }
.segment-fill.other { background-color: var(--warning); }
.segment-fill.default-segment { background-color: var(--border-color); width: 100%; }

.distribution-legend {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  font-size: 0.8125rem;
  color: var(--text-dim);
  margin-bottom: var(--space-3);
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.legend-dot.mkv { background-color: var(--primary); }
.legend-dot.mp4 { background-color: var(--accent); }
.legend-dot.other { background-color: var(--warning); }

.storage-breakdown {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--border-color);
}

.storage-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8125rem;
}

.storage-label {
  color: var(--text-dim);
}

.storage-val {
  font-weight: 600;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

/* L'attribut hidden doit masquer l'élément même si un composant fixe display. */
[hidden] {
  display: none !important;
}

/* Pied de page du shell */
.shell-footer {
  margin-top: auto;
  text-align: center;
  font-size: 0.8125rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border-color);
  padding: 1.25rem 1rem;
  background-color: var(--bg-card);
}

/* --- Adaptations Responsives Mobile (< 768px) --- */
@media (max-width: 768px) {
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
  }

  .application-shell {
    overflow-x: hidden;
    max-width: 100vw;
  }

  .application-navigation-layout {
    overflow-x: hidden;
    max-width: 100vw;
    min-width: 0;
    padding: 0;
    gap: 0;
  }

  /* Étroit : la barre latérale devient un tiroir, ouvert par le bouton de la barre du haut. */
  .application-sidebar,
  .application-sidebar.is-collapsed {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    height: 100dvh;
    width: min(18rem, 85vw);
    max-width: 85vw;
    border-radius: 0;
    border: 0;
    border-right: 1px solid var(--border-color);
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.2s ease-in-out, visibility 0.2s;
    z-index: 80;
    box-shadow: var(--shadow-md);
  }

  .application-sidebar.is-open {
    transform: translateX(0);
    visibility: visible;
  }

  .application-sidebar.is-collapsed .brand-info,
  .application-sidebar.is-collapsed .tab-btn-label,
  .application-sidebar.is-collapsed .tab-btn-badge,
  .application-sidebar.is-collapsed .nav-group-label,
  .application-sidebar.is-collapsed .sidebar-cmd-btn__label,
  .application-sidebar.is-collapsed .sidebar-cmd-btn__kbd,
  .application-sidebar.is-collapsed .sidebar-user-meta {
    display: revert;
  }

  .application-sidebar.is-collapsed .sidebar-user-card {
    flex-direction: row;
    padding: 0.45rem 0.55rem;
  }

  .application-sidebar.is-collapsed .sidebar-cmd-btn {
    justify-content: flex-start;
    padding: 0.45rem 0.6rem;
  }

  .sidebar-scrim {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 70;
    border: 0;
    padding: 0;
    background: rgba(0, 0, 0, 0.45);
  }

  .sidebar-scrim[hidden] {
    display: none;
  }

  .topbar-menu-btn {
    display: inline-flex;
  }

  .sidebar-header {
    padding: 0.75rem 1rem;
    box-sizing: border-box;
  }

  .tab-navigation {
    padding: 0.5rem;
    min-width: 0;
    overflow-y: auto;
    box-sizing: border-box;
  }

  .tab-btn {
    width: 100%;
    min-height: 44px;
    white-space: nowrap;
  }

  .sidebar-collapse-btn {
    display: none;
  }

  .page-transition-region {
    max-width: 100vw;
    min-width: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .app-topbar {
    margin: 0;
  }

  .topbar-breadcrumb {
    display: none;
  }

  .topbar-container {
    padding: 0.35rem 0.5rem;
  }

  .topbar-search-anchor {
    max-width: none;
  }

  .main-content {
    padding: 1rem;
    max-width: 100vw;
    box-sizing: border-box;
  }

  .main-content.is-workbench {
    padding: 0;
    height: 100dvh;
  }
}


/* --- Boutons d'action --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: var(--touch-target-compact);
  padding: 0.5rem 1rem;
  font-size: 0.875rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  text-decoration: none;
  line-height: 1.25;
  white-space: nowrap;
  user-select: none;
  touch-action: manipulation;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background-color: var(--primary);
  color: var(--primary-contrast);
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover:not(:disabled) {
  opacity: 0.9;
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background-color: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--border-color);
}

.btn-secondary:hover:not(:disabled) {
  background-color: var(--bg-card);
  border-color: var(--primary);
}

/* Paramètres : lignes « à surveiller » et visibilité conditionnelle par recherche. */
.settings-section[hidden] {
  display: none;
}

.settings-alert {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-top: 1px solid var(--border-color);
  font-size: 0.875rem;
}

.settings-alert:first-child {
  border-top: 0;
}

.settings-alert__dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--success);
}

.settings-alert__icon {
  flex: none;
  display: inline-flex;
  align-items: center;
  color: var(--warning);
}

.settings-alert[data-tone="warning"] .settings-alert__dot {
  background-color: var(--warning);
}

.settings-alert__text {
  flex: 1;
  min-width: 0;
}

/* Retour visuel d'une copie réussie : le bouton reste en « Copié ✓ » un instant. */
.btn[data-copied="true"] {
  background-color: var(--success-bg);
  color: var(--success);
  border-color: var(--success);
}

/* Zone de texte hors champ utilisée pour copier en HTTP simple (jamais visible). */
.clipboard-proxy {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.btn-danger {
  background-color: var(--danger-bg);
  color: var(--danger);
  border-color: var(--danger);
}

.btn-danger:hover:not(:disabled) {
  background-color: var(--danger);
  color: #ffffff;
}

.btn-sm {
  padding: 0.3rem 0.65rem;
  font-size: 0.75rem;
}

/* --- Badges et Pilules d'état (Status Pills) --- */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-pill);
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: currentColor;
}

@keyframes statusPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(1.25); }
}

.status-dot.pulse,
.status-dot--pulse {
  animation: statusPulse 1.8s ease-in-out infinite;
}

.status-pill.online,
.status-pill.success {
  background-color: var(--success-bg);
  color: var(--success);
}

.status-pill.warning {
  background-color: var(--warning-bg);
  color: var(--warning);
}

.status-pill.offline,
.status-pill.error,
.status-pill.danger {
  background-color: var(--danger-bg);
  color: var(--danger);
}

.status-pill.info {
  background-color: var(--info-bg);
  color: var(--info);
}

/* --- Tableaux de données accessibles --- */
.table-wrapper {
  overflow-x: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background-color: var(--bg-card);
  margin-top: 1rem;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.875rem;
}

.data-table th,
.data-table td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border-color);
  transition: background-color 0.14s ease;
}

.data-table th {
  background-color: var(--bg-subtle);
  font-weight: 600;
  color: var(--text-dim);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td,
.data-table tr.is-open td {
  background-color: var(--bg-subtle);
}

.registre {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.registre > .table-wrapper {
  margin-top: 0;
}

.inspection-drawer__actions {
  display: flex;
  gap: 0.5rem;
  flex: none;
}

.library-worker-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.library-worker-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 0.6rem 0.75rem;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
}

.library-worker-path {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  color: var(--text-dim);
}

.form-input--key {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 0.875rem;
}

.inspection-drawer {
  position: fixed;
  inset: 0;
  z-index: 60;
  visibility: hidden;
  pointer-events: none;
}

.inspection-drawer.is-open {
  visibility: visible;
  pointer-events: auto;
}

.inspection-drawer__scrim {
  position: absolute;
  inset: 0;
  border: 0;
  padding: 0;
  background: rgba(0, 0, 0, 0.45);
  cursor: pointer;
}

.inspection-drawer__panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(100%, max(24rem, 66.666%));
  background: var(--bg-card);
  border-left: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);
  transition: transform 0.22s var(--ease-out);
  outline: none;
}

.inspection-drawer.is-open .inspection-drawer__panel {
  transform: none;
}

.inspection-drawer__header {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 1rem 1rem 0.85rem;
  border-bottom: 1px solid var(--border-color);
}

.inspection-drawer__identity {
  flex: 1;
  min-width: 0;
}

.inspection-drawer__eyebrow {
  margin: 0 0 0.2rem;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.inspection-drawer__header .header-icon-btn {
  flex: none;
}

.inspection-drawer__subnav {
  display: flex;
  border-bottom: 1px solid var(--border-color);
}

.inspection-drawer__tab {
  flex: 1;
  appearance: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0.8rem 0.7rem;
  text-align: center;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 700;
  cursor: pointer;
}

.inspection-drawer__tab.is-active {
  color: var(--text-main);
  border-bottom-color: var(--primary);
}

.inspection-drawer__tab:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}

.inspection-drawer__body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 1rem;
}

.inspection-drawer__pane {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.inspection-panel__title {
  margin: 0;
  font-size: 1.125rem;
  line-height: 1.3;
  font-weight: 700;
  color: var(--text-main);
}

.inspection-panel__facts {
  margin: 0;
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--text-dim);
}

.inspection-panel__action {
  align-self: stretch;
}

.empty-state-text {
  text-align: center;
  padding: 2rem 1rem !important;
  color: var(--text-dim);
}

/* --- Cartes de métriques et panneaux d'information --- */
.metric-card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background: radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--tone, var(--primary)) 8%, transparent) 0%, transparent 60%), var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
}

.metric-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-highlight);
}

.metric-card[data-tone="success"] { --tone: var(--success); --tone-bg: var(--success-bg); }
.metric-card[data-tone="warning"] { --tone: var(--warning); --tone-bg: var(--warning-bg); }
.metric-card[data-tone="danger"] { --tone: var(--danger); --tone-bg: var(--danger-bg); }

.metric-head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.metric-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: var(--radius-sm);
  background-color: var(--tone-bg, var(--primary-bg));
  color: var(--tone, var(--primary));
}

.metric-label {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-dim);
}

.metric-value {
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.1;
  color: var(--text-main);
  font-family: var(--font-mono);
}

.metric-card[data-tone="success"] .metric-value,
.metric-card[data-tone="warning"] .metric-value,
.metric-card[data-tone="danger"] .metric-value {
  color: var(--tone);
}

.metric-meter {
  width: 100%;
  height: 5px;
  margin-top: 0.25rem;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}

.metric-meter__fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background-color: var(--tone, var(--primary));
  transition: width 0.35s var(--ease-out);
}

.metric-subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.card-caption {
  font-size: 0.8125rem;
  color: var(--text-dim);
  margin-top: 0.5rem;
  line-height: 1.45;
}

.workers-info-grid,
.metrics-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
  margin-top: 1.25rem;
}

/* --- Panneaux de section (Sections structurées) --- */
.section-panel {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  margin-bottom: 1.5rem;
}

.section-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.25rem;
  gap: 1rem;
}

.section-panel-header__actions {
  flex: none;
}

.section-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-main);
}

.section-subtitle {
  font-size: 0.875rem;
  color: var(--text-dim);
  margin-top: 0.25rem;
  line-height: 1.45;
}

/* --- Formulaires et Champs de saisie --- */
.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 0.35rem;
}

.form-help {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 0.35rem;
}

.form-input,
.form-select {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background-color: var(--bg-subtle);
  color: var(--text-main);
  font-size: 0.875rem;
  transition: border-color 0.15s ease-in-out;
  box-sizing: border-box;
}

.form-input:focus,
.form-select:focus {
  outline: none;
  border-color: var(--primary);
  background-color: var(--bg-card);
}

.copy-input-row {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

/* --- Blocs de code & Détails techniques --- */
.code-block-wrapper {
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 0.875rem;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
}

.code-snippet {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  padding: 0.2rem 0.4rem;
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
}

.detail-grid {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0.75rem 1.5rem;
  font-size: 0.875rem;
}

.detail-grid:has(> .detail-row) {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.detail-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--border-subtle);
}

.detail-row:last-child {
  border-bottom: none;
}

@media (max-width: 640px) {
  .detail-grid {
    grid-template-columns: 1fr;
    gap: 0.25rem;
  }

  .detail-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.15rem;
  }
}

.detail-term {
  color: var(--text-dim);
  font-weight: 500;
}

.detail-val {
  color: var(--text-main);
  font-weight: 600;
}

.detail-row .detail-val {
  text-align: right;
  word-break: break-word;
}

@media (max-width: 640px) {
  .detail-row .detail-val {
    text-align: left;
  }
}

.stack-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* --- Modales natives (<dialog>) --- */
dialog.app-dialog {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background-color: var(--bg-card);
  color: var(--text-main);
  padding: 1.5rem;
  max-width: 600px;
  width: 90%;
  margin: auto;
  box-shadow: var(--shadow-md);
}

dialog.app-dialog::backdrop {
  background-color: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(3px);
}

.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
}

.dialog-title {
  font-size: 1.25rem;
  font-weight: 700;
}

.dialog-body {
  margin-bottom: 1.5rem;
}

.dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
}

.dialog-footer-ruled {
  padding-top: 1rem;
  border-top: 1px solid var(--border-color);
  margin-top: 1rem;
}

.text-danger { color: var(--danger-text); }
.text-strong { font-weight: 600; color: var(--text-main); }
.text-dim { color: var(--text-dim); }
.text-primary { color: var(--primary); }
.text-mono { font-family: var(--font-mono); }
.text-mono-strong { font-family: var(--font-mono); font-weight: 600; }
.text-sm { font-size: 0.8125rem; }
.text-xs { font-size: 0.75rem; color: var(--text-dim); }
.cell-end { text-align: right; }
.inline-actions { display: inline-flex; gap: 0.4rem; }
.cluster { display: flex; align-items: center; gap: 0.5rem; }
.cluster-wrap { flex-wrap: wrap; }
.cluster-end { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem; }
.cluster-spread { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.cluster-center { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
.truncate {
  font-size: 0.8125rem;
  font-family: var(--font-mono);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.empty-state-panel {
  grid-column: 1 / -1;
  text-align: center;
  padding: 2.5rem 1rem;
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-card);
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.empty-state-icon {
  width: 48px;
  height: 48px;
  margin-bottom: 0.75rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.empty-state-title { margin: 0 0 0.5rem 0; font-size: 1.125rem; font-weight: 600; color: var(--text-main); }
.empty-state-message { margin: 0 auto 1.25rem auto; max-width: 500px; font-size: 0.875rem; color: var(--text-muted); }
.empty-state__action { display: flex; justify-content: center; gap: 0.5rem; }
dialog.app-dialog.dialog-narrow { max-width: 540px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.btn-danger-quiet { color: var(--danger-text); padding: 0.2rem 0.5rem; font-size: 0.75rem; margin-left: 0.5rem; }
.is-filtered-out { display: none !important; }
.no-margin-top { margin-top: 0; }

/* --- Toasts & Notifications flottantes --- */
.toast-notice {
  padding: 0.75rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  margin: 1rem 1.5rem 0 1.5rem;
  display: none;
}

.toast-notice.info {
  background-color: var(--info-bg);
  border: 1px solid var(--info);
  color: var(--info);
}

.toast-notice.success {
  background-color: var(--success-bg);
  border: 1px solid var(--success);
  color: var(--success);
}

.toast-notice.error {
  background-color: var(--danger-bg);
  border: 1px solid var(--danger);
  color: var(--danger);
}

/* --- Barre de progression temps réel (tableaux et fiches) --- */
.live-progress {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 112px;
}

.live-progress__track {
  flex: 1;
  min-width: 64px;
  height: 6px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}

.live-progress__bar {
  height: 100%;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.28s var(--ease-out);
}

.live-progress__bar.is-indeterminate {
  width: 40%;
  animation: liveProgressSlide 1.4s ease-in-out infinite;
}

.live-progress[data-tone="success"] .live-progress__bar { background: var(--success); }
.live-progress[data-tone="warning"] .live-progress__bar { background: var(--warning); }
.live-progress[data-tone="danger"] .live-progress__bar { background: var(--danger); }

.live-progress__label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-dim);
  min-width: 2.5rem;
  text-align: right;
}

@keyframes liveProgressSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(260%); }
}

/* --- Pile de notifications Toast flottantes --- */
.toast-stack {
  position: fixed;
  right: max(1.25rem, var(--sar));
  bottom: max(1.25rem, var(--sab));
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-width: min(92vw, 380px);
  pointer-events: none;
}

.toast-item {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.75rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
  color: var(--text-main);
  font-size: 0.8125rem;
  line-height: 1.4;
  animation: toastSlideIn 0.22s var(--ease-out);
}

.toast-item--info { border-left: 3px solid var(--info); }
.toast-item--success { border-left: 3px solid var(--success); }
.toast-item--danger { border-left: 3px solid var(--danger); }

.toast-item__icon {
  flex: none;
  display: inline-flex;
  color: var(--info);
}

.toast-item--success .toast-item__icon { color: var(--success); }
.toast-item--danger .toast-item__icon { color: var(--danger); }

.toast-item__message {
  flex: 1;
  min-width: 0;
}

.toast-item__close {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.toast-item__close:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}

@keyframes toastSlideIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* --- Palette de commandes clavier (Ctrl+K) --- */
.cmd-palette {
  position: fixed;
  inset: 0;
  z-index: 95;
  display: grid;
  place-items: start center;
  padding: 12vh 1rem 1rem;
}

.cmd-palette[hidden] {
  display: none;
}

.cmd-palette__scrim {
  position: fixed;
  inset: 0;
  border: 0;
  padding: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.cmd-palette__dialog {
  position: relative;
  z-index: 1;
  width: min(92vw, 560px);
  background: var(--bg-card);
  border: 1px solid var(--border-highlight);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: cmdPaletteIn 0.16s var(--ease-out);
}

@keyframes cmdPaletteIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.cmd-palette__header {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-dim);
}

.cmd-palette__input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text-main);
  font: inherit;
  font-size: 0.9375rem;
}

.cmd-palette__input::placeholder {
  color: var(--text-muted);
}

.cmd-palette__list {
  max-height: 52vh;
  overflow-y: auto;
  padding: 0.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.cmd-palette__empty {
  padding: 1.5rem 1rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8125rem;
}

.cmd-palette__item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  width: 100%;
  padding: 0.55rem 0.75rem;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-main);
  font: inherit;
  font-size: 0.8125rem;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.12s ease, border-color 0.12s ease;
}

.cmd-palette__item:hover,
.cmd-palette__item.is-active {
  background: var(--primary-bg);
  border-color: var(--border-highlight);
}

.cmd-palette__item-main {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
}

.cmd-palette__label {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cmd-palette__hint {
  color: var(--text-dim);
  font-size: 0.75rem;
  white-space: nowrap;
}

.cmd-palette__badge {
  flex: none;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  color: var(--text-dim);
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.cmd-palette__footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 1rem;
  border-top: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-muted);
  font-size: 0.75rem;
}

/* --- Sections ouvertes et tuiles de ressources unifiées --- */
.page-section {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-bottom: 1.75rem;
}

.resource-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr));
  gap: 1rem;
  margin-top: 0.25rem;
}

.resource-card {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  padding: 1.05rem 1.15rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--border-highlight);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}

.resource-card[data-tone="success"] {
  border-left-color: var(--success);
}

.resource-card[data-tone="warning"] {
  border-left-color: var(--warning);
}

.resource-card[data-tone="danger"] {
  border-left-color: var(--danger);
}

.resource-card.is-clickable {
  cursor: pointer;
}

.resource-card:hover,
.resource-card.is-open {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

.resource-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
}

.resource-card__icon {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.resource-card__titles {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  min-width: 0;
  flex: 1;
}

.resource-card__title {
  margin: 0;
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--text-main);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.resource-card__subtitle {
  font-size: 0.78rem;
  color: var(--text-dim);
  line-height: 1.35;
}

.resource-card__badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex-shrink: 0;
}

.resource-card__body {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  flex: 1;
}

.resource-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding-top: 0.75rem;
  margin-top: auto;
  border-top: 1px solid var(--border-subtle);
}

.resource-card__meta {
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.resource-card__actions {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}

/* --- Étiquette unifiée (`Tag`) --- */
.ui-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  max-width: 100%;
  padding: 0.2rem 0.5rem;
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  font-weight: 600;
  line-height: 1.25;
  border: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  color: var(--text-dim);
}

.ui-tag[data-tone="primary"] {
  background: var(--primary-bg);
  border-color: color-mix(in srgb, var(--primary) 35%, transparent);
  color: var(--primary);
}

.ui-tag[data-tone="success"] {
  background: var(--success-bg);
  border-color: color-mix(in srgb, var(--success) 35%, transparent);
  color: var(--success);
}

.ui-tag[data-tone="warning"] {
  background: var(--warning-bg);
  border-color: color-mix(in srgb, var(--warning) 35%, transparent);
  color: var(--warning);
}

.ui-tag[data-tone="danger"] {
  background: var(--danger-bg);
  border-color: color-mix(in srgb, var(--danger) 35%, transparent);
  color: var(--danger);
}

.ui-tag[data-tone="mono"] {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--text-main);
}

.code-badge {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  max-width: 100%;
}

/* --- Inspection & Diagnostic --- */
.inspection-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.65rem 0.85rem;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  margin-bottom: 1rem;
}

.diagnostic-box {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.75rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--danger-bg);
  border: 1px solid var(--danger);
  color: var(--danger-text);
  margin-bottom: 1rem;
}

.diagnostic-box__title {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.diagnostic-box__message {
  font-size: 0.85rem;
  margin-top: 0.15rem;
}

.registre-row.is-clickable {
  cursor: pointer;
  transition: background-color 0.14s ease;
}

.registre-row.is-clickable:hover {
  background: var(--bg-subtle);
}

.system-volume-meter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1rem;
  padding-top: 0.85rem;
  border-top: 1px solid var(--border-color);
}

/* --- Grille Bento des Paramètres --- */
.settings-bento-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

.settings-bento-grid > .section-panel {
  margin-bottom: 0;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

@media (max-width: 960px) {
  .settings-bento-grid {
    grid-template-columns: 1fr;
  }
}

.settings-help-details {
  margin-top: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  overflow: hidden;
}

.settings-help-details__summary {
  padding: 0.6rem 0.85rem;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  user-select: none;
}

.settings-help-details__summary:hover {
  color: var(--primary);
}

.settings-help-details__body {
  padding: 0.25rem 0.85rem 0.75rem;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}


/* --- Étiquettes de statut de dépôt --- */
.repo-badge {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
}

.repo-badge.official {
  background: var(--primary-bg);
  color: var(--primary);
  border: 1px solid var(--primary);
}

.repo-badge.community {
  background: var(--bg-subtle);
  color: var(--text-dim);
  border: 1px solid var(--border-color);
}


/* --- Concepteur et Gestionnaire de Flux (Flows) --- */
.form-input--code {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  line-height: 1.5;
  resize: vertical;
}

.flow-card__pipeline {
  padding: 0.65rem 0.75rem;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
}

.flow-pipeline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
}

.pipeline-step-node {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.6rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-main);
}

.pipeline-step-node--more {
  background: var(--primary-bg);
  border-color: var(--border-highlight);
  color: var(--primary);
}

.pipeline-connector {
  color: var(--text-muted);
  font-size: 0.85rem;
  user-select: none;
}

/* --- Atelier plein écran (Workbench) --- */
.flow-workbench {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg-app);
}

.flow-workbench__readonly,
.flow-workbench__feedback {
  margin: 0;
  padding: 0.45rem 1rem;
  font-size: 0.8rem;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-dim);
}

.flow-workbench__readonly {
  background: var(--warning-bg);
  color: var(--warning);
}

/* --- Barre de commande de l'atelier --- */
.flow-command-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 0.85rem;
  flex-wrap: wrap;
  min-height: 46px;
  padding: 0.35rem 0.75rem;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  z-index: 20;
  flex-shrink: 0;
}

.flow-command-bar__lead {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  flex: 1 1 18rem;
}

.flow-command-bar__identity {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  flex-wrap: wrap;
}

.flow-command-bar__title-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.flow-title-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-main);
  font-size: 1rem;
  font-weight: 700;
  padding: 0.12rem 0.45rem;
  margin-left: -0.45rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  max-width: 340px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.flow-title-btn:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--border-color);
}

.flow-title-btn:disabled {
  cursor: default;
}

.flow-title-input {
  font-size: 1rem;
  font-weight: 700;
  padding: 0.18rem 0.5rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--primary);
  background: var(--bg-elevated);
  color: var(--text-main);
  min-width: 220px;
  max-width: 340px;
}

.flow-command-bar__pills {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.flow-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.12rem 0.5rem;
  border-radius: var(--radius-pill);
  font-size: 0.72rem;
  font-weight: 600;
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-dim);
  line-height: 1.35;
}

.flow-pill--mask {
  cursor: pointer;
  color: var(--primary);
  background: var(--primary-bg);
  border-color: var(--border-highlight);
}

.flow-pill--mask:hover {
  filter: brightness(1.08);
}

.flow-pill--default {
  color: var(--success);
  background: var(--success-bg);
  border-color: color-mix(in srgb, var(--success) 35%, transparent);
}

.flow-pill--state.is-saved {
  color: var(--success);
  background: var(--success-bg);
  border-color: color-mix(in srgb, var(--success) 35%, transparent);
}

.flow-pill--state.is-unsaved {
  color: var(--warning);
  background: var(--warning-bg);
  border-color: color-mix(in srgb, var(--warning) 40%, transparent);
}

.flow-pill--state .status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.flow-command-bar__actions {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.flow-cmd-btn[aria-pressed="true"] {
  background: var(--primary-bg);
  color: var(--primary);
  border-color: var(--border-highlight);
}

.flow-cmd-btn__count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.15rem;
  height: 1.15rem;
  padding: 0 0.32rem;
  border-radius: var(--radius-pill);
  background: var(--warning-bg);
  color: var(--warning);
  font-size: 0.7rem;
  font-weight: 700;
}

.flow-cmd-btn__count.is-error {
  background: var(--danger-bg);
  color: var(--danger-text);
}

/* --- Zone centrale de travail (Palette + Canevas + Inspecteur/Réglages) --- */
.flow-workspace-body {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* --- Tiroir latéral Réglages & Versions --- */
.flow-settings-drawer {
  width: 340px;
  flex-shrink: 0;
  background: var(--bg-card);
  border-left: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  min-height: 0;
  transition: width 0.2s var(--ease-out);
  z-index: 15;
}

.flow-settings-drawer.is-closed {
  width: 0;
  border-left: none;
  overflow: hidden;
}

.flow-settings__toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: var(--text-main);
  cursor: pointer;
}

/* --- Bandeau inférieur Diagnostics & Validation (flottant sans compresser le canevas) --- */
.flow-diagnostics-tray {
  position: absolute;
  left: 64px;
  right: 196px;
  bottom: 14px;
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  max-height: 200px;
  overflow-y: auto;
  z-index: 18;
}

.flow-workspace-body.is-panel-open .flow-diagnostics-tray {
  right: 342px;
}

.flow-diagnostics-tray.is-closed {
  display: none;
}

.flow-diagnostics__inner {
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.flow-diagnostics__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.flow-diagnostics__title-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.flow-diagnostics__title {
  margin: 0;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-main);
}

.flow-diagnostics__count {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.flow-diagnostics__list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.flow-diagnostic-item {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.45rem 0.65rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  font-size: 0.8125rem;
  color: var(--text-main);
}

.flow-diagnostic-item[data-level="error"] {
  border-color: color-mix(in srgb, var(--danger) 40%, transparent);
  background: var(--danger-bg);
}

.flow-diagnostic-item[data-level="warning"] {
  border-color: color-mix(in srgb, var(--warning) 40%, transparent);
  background: var(--warning-bg);
}

.flow-diagnostic-item[data-level="ok"] {
  border-color: color-mix(in srgb, var(--success) 40%, transparent);
  background: var(--success-bg);
  color: var(--success);
}

.flow-diagnostic-item__level {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.flow-diagnostic-item__msg {
  flex: 1;
  min-width: 0;
}

.flow-headers__row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}

/* Sélecteur historique conservé pour compatibilité des tests de thème. */
.studio-toolbar {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
}

@media (max-width: 960px) {
  .flow-settings-drawer {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: min(340px, 100%);
    box-shadow: var(--shadow-lg);
  }
  .flow-diagnostics-tray,
  .flow-workspace-body.is-panel-open .flow-diagnostics-tray {
    left: 10px;
    right: 10px;
    bottom: 10px;
  }
}


/* --- Tiroir droit unifié et flottant (Composants / Bloc / Réglages) --- */
.flow-right-dock {
  position: absolute;
  top: 10px;
  right: 10px;
  bottom: 10px;
  width: 320px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  transition: transform 0.2s var(--ease-out), opacity 0.2s var(--ease-out);
  z-index: 16;
}

.flow-right-dock.is-closed {
  transform: translateX(calc(100% + 18px));
  opacity: 0;
  pointer-events: none;
}

.flow-right-dock__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  padding: 0.45rem 0.55rem;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-card);
  flex-shrink: 0;
}

.flow-right-dock__tabs {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  min-width: 0;
  flex: 1;
}

.flow-right-dock__tab {
  flex: 1;
  min-width: 0;
  height: 28px;
  padding: 0 0.5rem;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.76rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
}

.flow-right-dock__tab:hover:not(:disabled) {
  color: var(--text-main);
  background: var(--bg-subtle);
}

.flow-right-dock__tab[aria-selected="true"] {
  background: var(--primary-bg);
  color: var(--primary);
  border-color: var(--border-highlight);
}

.flow-right-dock__tab:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.flow-right-dock__body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.flow-dock-pane {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.flow-palette__subbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.45rem 0.75rem 0;
}

/* --- Dock Palette latéral (conservé pour compatibilité) --- */
.flow-palette-dock {
  width: 300px;
  flex-shrink: 0;
  background: var(--bg-card);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  transition: width 0.2s var(--ease-out);
  z-index: 14;
}

.flow-palette-dock.is-closed {
  width: 0;
  border-right: none;
}

.flow-palette__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.75rem 0.85rem;
  border-bottom: 1px solid var(--border-subtle);
}

.flow-palette__title-wrap {
  display: flex;
  align-items: center;
  gap: 0.45rem;
}

.flow-palette__title {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-main);
}

.flow-palette__badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.4rem;
  height: 1.2rem;
  padding: 0 0.4rem;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  color: var(--text-dim);
  font-size: 0.72rem;
  font-weight: 700;
}

.flow-palette__header-actions {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.header-icon-btn.is-active {
  background: var(--primary-bg);
  color: var(--primary);
  border-color: var(--border-highlight);
}

.flow-palette__insertion {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.6rem 0.85rem;
  background: var(--primary-bg);
  border-bottom: 1px solid var(--border-highlight);
  font-size: 0.78rem;
  color: var(--text-main);
}

.flow-palette__insertion-text {
  flex: 1;
  min-width: 0;
  font-weight: 600;
}

.flow-palette__search {
  position: relative;
  display: flex;
  align-items: center;
  padding: 0.65rem 0.85rem;
  border-bottom: 1px solid var(--border-subtle);
}

.flow-palette__search-icon {
  position: absolute;
  left: 1.45rem;
  color: var(--text-muted);
  pointer-events: none;
}

.flow-palette__search-input {
  width: 100%;
  padding-left: 1.85rem;
  padding-right: 1.85rem;
  font-size: 0.8125rem;
}

.flow-palette__search-clear {
  position: absolute;
  right: 1.35rem;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0.2rem;
  display: inline-flex;
  align-items: center;
}

.flow-palette__groups {
  flex: 1;
  overflow-y: auto;
  padding: 0.65rem 0.85rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.flow-palette__empty {
  margin: 1rem 0;
  font-size: 0.8125rem;
  color: var(--text-dim);
  text-align: center;
}

.flow-palette__group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.flow-palette__summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0.25rem 0.15rem;
  user-select: none;
}

.flow-palette__count {
  padding: 0.05rem 0.4rem;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  color: var(--text-muted);
  font-size: 0.68rem;
}

.flow-palette__list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding-top: 0.3rem;
}

.flow-palette__drag {
  display: block;
}

.flow-palette__card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.52rem 0.65rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--component-accent, var(--primary));
  background: var(--bg-elevated);
  color: var(--text-main);
  text-align: left;
  cursor: grab;
  user-select: none;
  transition: transform 0.14s var(--ease-out), border-color 0.14s var(--ease-out), background-color 0.14s var(--ease-out);
}

.flow-palette__card:active {
  cursor: grabbing;
}

.flow-palette__card:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.flow-palette__card:hover {
  border-color: var(--component-accent, var(--primary));
  background: var(--bg-subtle);
  transform: translateY(-1px);
}

.flow-palette__card-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--component-accent, var(--primary)) 14%, transparent);
  color: var(--component-accent, var(--primary));
}

.flow-palette__card-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.flow-palette__card-title {
  font-size: 0.8125rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-palette__card-meta {
  font-size: 0.68rem;
  color: var(--text-muted);
}

.flow-palette__card-plus {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-muted);
}

/* --- Zone centrale du canevas 2D --- */
.flow-canvas-area {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background-color: var(--bg-app);
}

.flow-canvas__toolbar {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-wrap: wrap;
  padding: 0.5rem 0.85rem;
  background: var(--bg-glass);
  border-bottom: 1px solid var(--border-color);
  z-index: 12;
}

.flow-canvas__banner {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-main);
}

.flow-canvas__banner.is-error {
  color: var(--danger-text);
}

.flow-graph-board {
  flex: 1;
  overflow: hidden;
  background-color: var(--bg-app);
  background-image: radial-gradient(circle, var(--border-color) 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: grab;
  user-select: none;
  position: relative;
}

.flow-graph-board.is-panning {
  cursor: grabbing;
}

.flow-canvas__empty {
  position: relative;
  z-index: 2;
  margin: 3rem auto;
  max-width: 440px;
  text-align: center;
}

.flow-graph-stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  z-index: 2;
  overflow: visible;
  transform-origin: 0 0;
}

.flow-canvas__wires {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  overflow: visible;
  pointer-events: none;
}

/* --- Cartes nodales 2D --- */
.canvas-node-slot {
  position: absolute;
  z-index: 2;
}

.canvas-node-slot:has(.canvas-node.is-dragging) {
  z-index: 6;
}

.canvas-drop-ghost {
  position: absolute;
  z-index: 3;
  box-sizing: border-box;
  pointer-events: none;
  border: 2px dashed var(--primary);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--primary) 10%, var(--bg-elevated));
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
