[package]
name = "flux-frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
leptos = { version = "0.8.23", default-features = false, features = ["ssr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stylist = { version = "0.15.1", features = ["parser", "macros"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
