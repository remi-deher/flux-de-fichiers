# Branche test : seules les PR depuis dev sont acceptées (ouvertes automatiquement
# par promote.yml). Vérifications et essai du conteneur sans rien publier →
# fusion automatique → l'image est construite et publiée au moment de la fusion
# (:test et :test-<sha du merge>), puis la PR test → main est ouverte et se
# fusionne seule quand elle est verte. Les opérations de fusion et d'ouverture
# utilisent RELEASE_TOKEN : un push fait avec GITHUB_TOKEN ne déclenche aucun
# workflow.
# Les vérifications requises par la protection de branche s'exécutent toujours ;
# quand la PR ne touche pas au code, leurs étapes lourdes sont simplement sautées.
name: test

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: flux-de-fichiers
  CARGO_JOBS: 4

jobs:
  guard:
    name: source-is-dev
    runs-on: ubuntu-latest
    steps:
      - name: Refuser toute PR qui ne vient pas de dev
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::La branche test n'accepte que les PR depuis dev (reçu : $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi

  changes:
    name: detect-code-changes
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Le code ou le build ont-ils changé ?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Chemins qui influencent le binaire, l'image ou les scénarios Docker.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -qE '^(src/|frontend/|client/|shared/|migrations/|tests/|scripts/|deploy/|Cargo\.toml$|Cargo\.lock$|Dockerfile$|\.dockerignore$|compose\.yaml$|package\.json$|rust-toolchain\.toml$|\.github/workflows/test\.yml$|\.github/actions/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement de code : vérifications lourdes sautées."
          fi

  checks:
    name: fmt-clippy-tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        name: Installer la toolchain de rust-toolchain.toml
        run: rustup toolchain install
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.code == 'true'
        run: cargo fmt --check
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --locked
      - if: needs.changes.outputs.code == 'true'
        name: Contrat partagé, client WASM et page (ADR 0014)
        run: |
          cargo clippy -p flux-shared -p flux-client -p flux-frontend --all-targets --locked -- -D warnings
          cargo clippy -p flux-client --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test -p flux-shared -p flux-client -p flux-frontend --locked

  image-build:
    # Nom stable : destiné aux checks requis du ruleset de test. L'image n'est
    # pas publiée ici : elle est construite, chargée localement et essayée.
    name: docker-build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/build-image
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          tags: flux-smoke:ci
          load: "true"
          cargo-jobs: ${{ env.CARGO_JOBS }}
      - if: needs.changes.outputs.code == 'true'
        name: Smoke test du conteneur (/health)
        run: |
          docker run -d --name smoke -p 3000:3000 flux-smoke:ci central
          for _ in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            { [ "$status" = "200" ] || [ "$status" = "204" ]; } && break
            sleep 1
          done
          if ! curl -fsS http://localhost:3000/health; then
            echo "::error::Échec de la sonde /health."
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke

  merge:
    name: auto-merge
    needs: [guard, checks, image-build]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      short: ${{ steps.merge.outputs.short }}
    steps:
      - name: Fusionner la PR (merge commit)
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

  publish:
    name: docker-publish
    needs: [changes, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.merge.outputs.sha }}
      - if: needs.changes.outputs.code == 'true'
        name: Construire et publier l'image du merge (:test et :test-<sha>)
        uses: ./.github/actions/build-image
        with:
          sha: ${{ needs.merge.outputs.sha }}
          push: "true"
          cargo-jobs: ${{ env.CARGO_JOBS }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:test
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:test-${{ needs.merge.outputs.short }}
      - if: needs.changes.outputs.code != 'true'
        name: Sans changement de code, redonner l'image :test au merge
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHORT: ${{ needs.merge.outputs.short }}
        run: |
          docker buildx imagetools inspect "$REPO:test" > /dev/null \
            || { echo "::error::Image $REPO:test introuvable."; exit 1; }
          docker buildx imagetools create --tag "$REPO:test-$SHORT" "$REPO:test"

  main-pr:
    name: open-main-pr
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir la PR test → main et activer sa fusion automatique
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # L'image test-<sha> existe maintenant : main-checks peut la vérifier.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head test --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # Fermer puis rouvrir relance main-checks sur la tête de test, image présente.
            gh pr close "$existing" --repo "$GITHUB_REPOSITORY"
            gh pr reopen "$existing" --repo "$GITHUB_REPOSITORY"
            number="$existing"
          else
            number=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head test \
              --title "chore: test → main" \
              --body "Promotion automatique de test vers main (image test-<sha> publiée)." | grep -oE '[0-9]+$')
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --merge
