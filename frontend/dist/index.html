  justify-content: center;
  gap: 0.2rem;
  padding: 0.6rem 0.75rem;
}

.canvas-drop-ghost__badge {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.02em;
}

.canvas-drop-ghost__title {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.canvas-node-slot.is-drop-ok .canvas-node {
  outline: 2px dashed var(--success);
  outline-offset: 4px;
}

.canvas-node-slot.is-drop-refused .canvas-node {
  outline: 2px dashed var(--danger);
  outline-offset: 4px;
}

.canvas-node {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-card) 100%);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--node-accent, var(--primary));
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  padding: 0.6rem 0.7rem 0.75rem;
  color: var(--text-main);
  cursor: grab;
  transition: box-shadow 0.16s var(--ease-out), border-color 0.16s var(--ease-out);
}

.canvas-node:hover {
  border-color: var(--border-highlight);
  box-shadow: var(--shadow-md);
}

.canvas-node.is-selected {
  border-color: var(--primary);
  box-shadow: var(--shadow-glow);
}

.canvas-node.is-incomplete {
  border-color: var(--warning);
}

.canvas-node.is-dragging {
  opacity: 0.92;
  border-color: var(--primary);
  box-shadow: var(--shadow-lg);
  cursor: grabbing;
}

.canvas-node__heading {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
}

.canvas-node__icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--node-accent, var(--primary)) 14%, transparent);
  color: var(--node-accent, var(--primary));
  padding: 0;
  margin-top: 0.1rem;
}

.canvas-node__main {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 0;
  text-align: left;
  color: inherit;
  cursor: inherit;
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
}

.canvas-node__title-row {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.canvas-node__title {
  font-size: 0.875rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.canvas-node__warn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--warning-bg);
  color: var(--warning);
  font-size: 0.7rem;
  font-weight: 800;
}

.canvas-node__subtitle {
  font-size: 0.69rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.canvas-node__summary {
  margin-top: 0.2rem;
  padding: 0.15rem 0.4rem;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.canvas-node__actions {
  display: flex;
  align-items: center;
  gap: 0.15rem;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.canvas-node:hover .canvas-node__actions,
.canvas-node:focus-within .canvas-node__actions,
.canvas-node.is-selected .canvas-node__actions {
  opacity: 1;
}

.canvas-node__action-btn {
  width: 26px;
  height: 26px;
}

.canvas-node__action-btn.is-danger:hover {
  color: var(--danger-text);
  border-color: color-mix(in srgb, var(--danger) 40%, transparent);
  background: var(--danger-bg);
}

/* --- Ports d'entrée/sortie & Bouton + d'insertion --- */
.canvas-port {
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: var(--radius-pill);
  cursor: crosshair;
  z-index: 4;
}

.canvas-port.is-input {
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 14px;
  background: var(--bg-card);
  border: 2px solid var(--node-accent, var(--primary));
  transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
}

.canvas-port.is-input:hover,
.canvas-port.is-input.is-valid-target {
  border-color: var(--success);
  background: var(--success);
  transform: translateX(-50%) scale(1.25);
  box-shadow: 0 0 0 4px var(--success-bg);
}

.canvas-node__outputs {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: -12px;
  display: grid;
  grid-template-columns: repeat(var(--output-count, 1), minmax(0, 1fr));
  pointer-events: none;
}

.canvas-output-slot {
  --port-color: var(--primary);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: auto;
}

.canvas-output-slot[data-tone="success"] {
  --port-color: var(--success);
}

.canvas-output-slot[data-tone="warning"] {
  --port-color: var(--warning);
}

.canvas-port.is-output {
  width: 22px;
  height: 22px;
  background: var(--bg-card);
  border: 1.5px solid var(--port-color);
  color: var(--port-color);
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1;
  box-shadow: var(--shadow-sm);
  transition: transform 0.14s ease, background-color 0.14s ease;
}

.canvas-port.is-output:hover {
  transform: scale(1.15);
  background: var(--bg-subtle);
}

.canvas-port__add {
  position: absolute;
  top: 24px;
  width: 20px;
  height: 20px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-highlight);
  background: var(--bg-card);
  color: var(--primary);
  font-size: 0.85rem;
  font-weight: 700;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.canvas-output-slot:hover .canvas-port__add,
.canvas-output-slot:focus-within .canvas-port__add,
.canvas-node.is-selected .canvas-port__add {
  opacity: 1;
  pointer-events: auto;
}

.canvas-port__add:hover {
  transform: scale(1.12);
  background: var(--primary);
  color: var(--primary-contrast);
}

/* --- Liaisons SVG interactives --- */
.flow-wire__hit {
  fill: none;
  stroke: transparent;
  stroke-width: 18px;
  pointer-events: stroke;
  cursor: pointer;
}

.flow-wire {
  fill: none;
  stroke: var(--primary);
  stroke-width: 2.5px;
  stroke-linecap: round;
  transition: opacity 0.16s ease, stroke-width 0.16s ease;
}

.flow-wire[data-tone="success"] {
  stroke: var(--success);
}

.flow-wire[data-tone="warning"] {
  stroke: var(--warning);
}

.flow-wire.is-highlighted {
  stroke-width: 3.5px;
  filter: drop-shadow(0 0 3px var(--primary));
}

.flow-wire.is-muted {
  opacity: 0.25;
}

.flow-wire--ghost {
  stroke: var(--primary);
  stroke-dasharray: 6 6;
  animation: pulseWireGhost 1s linear infinite;
}

@keyframes pulseWireGhost {
  from {
    stroke-dashoffset: 24;
  }
  to {
    stroke-dashoffset: 0;
  }
}

.flow-wire__badge rect {
  fill: var(--bg-card);
  stroke: var(--border-color);
  stroke-width: 1px;
}

.flow-wire__badge text {
  fill: var(--text-dim);
  font-size: 10px;
  font-weight: 700;
}

.flow-wire__badge[data-tone="success"] rect {
  stroke: color-mix(in srgb, var(--success) 55%, transparent);
}

.flow-wire__badge[data-tone="success"] text {
  fill: var(--success);
}

.flow-wire__badge[data-tone="warning"] rect {
  stroke: color-mix(in srgb, var(--warning) 55%, transparent);
}

.flow-wire__badge[data-tone="warning"] text {
  fill: var(--warning);
}

/* --- Barre verticale flottante bas-gauche (Zoom, Fit, Layout, Undo/Redo) --- */
.flow-canvas-controls {
  position: absolute;
  left: 14px;
  bottom: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  padding: 0.3rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow-md);
  z-index: 11;
}

.flow-control-btn {
  width: 30px;
  height: 30px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: 700;
  transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}

.flow-control-btn:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--border-color);
}

.flow-control-btn.is-active {
  background: var(--primary-bg);
  border-color: color-mix(in srgb, var(--primary) 45%, transparent);
  color: var(--primary);
}

.flow-control-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.flow-control-btn--pct {
  height: 24px;
  font-size: 0.66rem;
  color: var(--text-dim);
}

.flow-controls-sep {
  width: 20px;
  height: 1px;
  background: var(--border-subtle);
  margin: 0.1rem 0;
}

/* --- Panneau Minimap flottant allégé --- */
.flow-minimap-panel {
  position: absolute;
  right: 14px;
  bottom: 14px;
  width: 168px;
  padding: 0.32rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow-md);
  opacity: 0.84;
  transition: right 0.2s var(--ease-out), opacity 0.15s ease;
  z-index: 10;
}

.flow-minimap-panel:hover {
  opacity: 1;
}

.flow-workspace-body.is-panel-open .flow-minimap-panel {
  right: 342px;
}

.flow-minimap__tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.25rem;
  margin-bottom: 0.35rem;
}

.flow-minimap__zoom-reset {
  flex: 1;
  height: 28px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  color: var(--text-main);
  font-size: 0.74rem;
  font-weight: 600;
  cursor: pointer;
}

.flow-minimap__svg {
  display: block;
  width: 100%;
  height: 88px;
  border-radius: var(--radius-sm);
  background: var(--bg-app);
  border: 1px solid var(--border-subtle);
}

.mini-wire {
  stroke: var(--border-color);
  stroke-width: 4;
}

.mini-node {
  fill: var(--text-muted);
  opacity: 0.7;
}

.mini-node.is-selected {
  fill: var(--primary);
  opacity: 1;
}

.mini-viewport {
  fill: color-mix(in srgb, var(--primary) 14%, transparent);
  stroke: var(--primary);
  stroke-width: 1.5px;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

.flow-quick-add {
  position: absolute;
  z-index: 19;
  width: 280px;
  max-height: 340px;
  display: flex;
  flex-direction: column;
  background: var(--bg-glass);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.flow-quick-add__search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-color);
}

.flow-quick-add__search-icon {
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}

.flow-quick-add__input {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text-main);
  font-size: 13px;
  outline: none;
}

.flow-quick-add__input::placeholder {
  color: var(--text-muted);
}

.flow-quick-add__list {
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.flow-quick-add__group-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 6px 8px 3px;
}

.flow-quick-add__item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-main);
  cursor: pointer;
  text-align: left;
}

.flow-quick-add__item:hover,
.flow-quick-add__item.is-active {
  background: var(--primary-bg);
  border-color: color-mix(in srgb, var(--primary) 35%, transparent);
}

.flow-quick-add__icon {
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}

.flow-quick-add__text {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.flow-quick-add__label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-quick-add__cat {
  font-size: 11px;
  color: var(--text-muted);
}

.flow-quick-add__empty {
  padding: 14px 10px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
}

.flow-canvas__marquee {
  position: absolute;
  pointer-events: none;
  z-index: 6;
  border: 1.5px solid var(--primary);
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  border-radius: var(--radius-sm);
}

.flow-wire__popover {
  position: absolute;
  z-index: 16;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-md);
}

/* --- Tiroir Inspecteur latéral --- */
.flow-inspector-drawer {
  width: 340px;
  flex-shrink: 0;
  background: var(--bg-card);
  border-left: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  min-height: 0;
  transition: width 0.2s var(--ease-out);
  z-index: 15;
}

.flow-inspector-drawer.is-closed {
  width: 0;
  border-left: none;
  overflow: hidden;
}

.flow-inspector__shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.flow-inspector__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.65rem;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border-subtle);
}

.flow-inspector__identity {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
}

.flow-inspector__eyebrow {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.flow-inspector__badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.14rem 0.48rem;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--node-accent, var(--primary)) 14%, transparent);
  color: var(--node-accent, var(--primary));
  font-size: 0.7rem;
  font-weight: 700;
  width: fit-content;
}

.flow-inspector__title {
  margin: 0;
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--text-main);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.flow-inspector__body {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.flow-inspector__section {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border-subtle);
}

.flow-inspector__section-title {
  margin: 0;
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
}

.flow-inspector__output-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.25rem;
}

.flow-inspector__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-elevated);
}

/* Sélecteur historique conservé pour les tests de thème. */
.flow-graph__port-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

@media (max-width: 960px) {
  .flow-right-dock {
    top: 0;
    right: 0;
    bottom: 0;
    width: min(340px, 100%);
    border-radius: 0;
  }
  .flow-workspace-body.is-panel-open .flow-minimap-panel {
    right: 14px;
  }
  .flow-palette-dock {
    position: absolute;
    left: 0;
    top: 0;

    box-shadow: var(--shadow-lg);
  }
  .flow-inspector-drawer {

}

@media (max-width: 680px) {
  .flow-minimap-panel {
    width: 140px;
    right: 10px;
    bottom: 10px;
  }
  .flow-canvas-controls {
    left: 10px;
    bottom: 10px;
  }
}


/* --- Grille de widgets : six colonnes, une seule sur petit écran --- */
.widget-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.widget {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
  padding: var(--space-3);
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.widget--small { grid-column: span 2; }
.widget--medium { grid-column: span 3; }
.widget--large { grid-column: span 6; }

@media (max-width: 960px) {
  .widget--small,
  .widget--medium,
  .widget--large {
    grid-column: span 6;
  }
}

.widget__head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.widget__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-sm);
  background-color: var(--primary-bg);
  color: var(--primary);
}

.widget__title {
  flex: 1;
  min-width: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-main);
}

.widget__actions {
  flex: none;
}

.widget__body {
  min-width: 0;
}

.widget__message {
  margin: 0;
  font-size: 0.875rem;
  color: var(--text-muted);
}

/* États : le squelette remplace le contenu tant que les données n'ont pas répondu. */
.widget[data-state="loading"] .widget__body {
  min-height: 4.5rem;
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--border-color) 50%, var(--bg-subtle) 75%);
  background-size: 200% 100%;
  animation: widget-shimmer 1.4s linear infinite;
}

.widget[data-state="loading"] .widget__message,
.widget[data-state="ready"] .widget__message {
  display: none;
}

.widget[data-state="empty"] .widget__body,
.widget[data-state="error"] .widget__body {
  display: none;
}

.widget[data-state="error"] .widget__message {
  color: var(--danger-text);
}

@keyframes widget-shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

/* --- Listes de lignes (pastille, libellé, métadonnée) --- */
.widget-list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.widget-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.5rem 0.65rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
}

button.widget-row {
  cursor: pointer;
}

button.widget-row:hover {
  background-color: var(--bg-subtle);
}

.widget-row__dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--text-muted);
}

.widget-row[data-tone="success"] .widget-row__dot { background-color: var(--success); }
.widget-row[data-tone="warning"] .widget-row__dot { background-color: var(--warning); }
.widget-row[data-tone="danger"] .widget-row__dot { background-color: var(--danger); }

.widget-row__label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-weight: 600;
  color: var(--text-main);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.widget-row__meta {
  flex: none;
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* --- Progression native (accessible) --- */
.widget-progress {
  flex: none;
  width: 6rem;
  height: 0.5rem;
  accent-color: var(--primary);
}

/* --- Histogramme CSS : la hauteur de chaque barre vient de --bar-height --- */
.widget-bars {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 6rem;
}

.widget-bars__bar {
  flex: 1;
  height: var(--bar-height, 4%);
  min-height: 3px;
  border-radius: 2px;
  background-color: var(--text-muted);
}

.widget-bars__bar[data-tone="success"] { background-color: var(--success); }
.widget-bars__bar[data-tone="danger"] { background-color: var(--danger); }

.widget-bars__axis {
  display: flex;
  justify-content: space-between;
  margin-top: 0.35rem;
  font-size: 0.6875rem;
  color: var(--text-muted);
}

.auth-gate__brand {

.auth-gate__logo {

.auth-gate__name {

.auth-gate__title {

.auth-gate__subtitle {

.auth-gate__form {

.auth-gate__notice {
